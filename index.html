<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>LEO v109 BONITO CON DIBUJOS</title><link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Andika:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:'Nunito',system-ui;background:#fff6f9;background-image:radial-gradient(#ffdeeb 2px, transparent 2px),radial-gradient(#d4f0ff 2px, transparent 2px);background-size:40px 40px;background-position:0 0,20px 20px}
header{background:linear-gradient(90deg,#e8438a,#ff8f5a);color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px;position:sticky;top:0;z-index:10;box-shadow:0 4px 15px rgba(232,67,138,.3)}
.tipos{display:flex;gap:8px;justify-content:center;background:#fff;padding:12px;position:sticky;top:50px;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.btn{border:0;padding:10px 16px;border-radius:20px;font-weight:900;cursor:pointer;font-family:'Nunito',sans-serif}
.btn.tipo{background:#fff0f6;color:#e8438a;border:2px solid #ffbdd7}
.btn.tipo.activo{background:#e8438a;color:#fff;transform:scale(1.05)}
.tabs{display:flex;overflow-x:auto;gap:8px;padding:12px;background:#fff;position:sticky;top:100px;z-index:10;scrollbar-width:none}
.tabs button{border:0;background:#fff0f6;padding:10px 16px;border-radius:20px;font-weight:900;color:#e8438a;white-space:nowrap;font-family:'Nunito',sans-serif}
.tabs button.activo{background:#e8438a;color:#fff}
.card{background:#fff;border-radius:24px;padding:18px;margin:12px;box-shadow:0 12px 30px rgba(0,0,0,.08);text-align:center;max-width:1100px;margin:12px auto;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:-20px;right:-20px;width:120px;height:120px;background:radial-gradient(#ffe0ec,#fff0 70%);opacity:.6;pointer-events:none}
.letra-big{font-size:140px;font-weight:900;line-height:.9;position:relative;z-index:1}
.letra-big.mayuscula{color:#e8438a}.letra-big.minuscula{font-family:'Andika',sans-serif;color:#e8438a}.letra-big.ligada{font-family:'Cedarville Cursive',cursive;color:#1a1a1a;font-weight:400;font-size:130px}
.ejemplo{font-size:26px;font-weight:900;color:#6c5ce7;margin-top:6px;font-family:'Cedarville Cursive',cursive}
.ejemplo small{font-family:'Nunito',sans-serif;font-size:14px;color:#ff8f5a;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.item{border:2px solid #ffe0ec;border-radius:20px;padding:10px;background:#fff;cursor:pointer;position:relative;overflow:hidden;transition:.2s}
.item:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(232,67,138,.15);border-color:#e8438a}
.item.ico{font-size:42px;line-height:1}
.item.txt{font-weight:900;color:#e8438a;font-size:20px;margin-top:4px}
.item.pal{font-size:11px;font-weight:800;color:#6c5ce7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head><body><header>🌈 LEO Y APRENDO v109</header><div class="tipos"><button class="btn tipo" id="bMayus" onclick="setTipo('mayuscula')">A MAYÚSCULA</button><button class="btn tipo" id="bMinus" onclick="setTipo('minuscula')">a minúscula</button><button class="btn tipo activo" id="bLigada" onclick="setTipo('ligada')" style="font-family:'Cedarville Cursive',cursive">a ligada</button></div><div class="tabs" id="tabs"></div><div class="card" id="cardMain"><div id="emoji" style="font-size:80px">✈️</div><div id="letraG" class="letra-big ligada">ae</div><div id="textoG" class="ejemplo">ae - <b>aeroplano</b><small>✈️ como en aeroplano</small></div><button class="btn" style="background:linear-gradient(90deg,#6c5ce7,#a66cff);color:white;width:100%;margin-top:14px;padding:18px;font-size:22px;border-radius:16px" onclick="hablar()" id="btnAudio">🔊 ae - aeroplano</button></div><div class="card"><div class="grid" id="grid"></div></div><script>
let tipo='ligada',seccion='vocalicos',actual='AE';
const DATA={
letras:[{A:'A',e:'🍎',p:'manzana',ej:'A de manzana'},{A:'B',e:'⚽',p:'balón',ej:'B de balón'},{A:'C',e:'🏠',p:'casa',ej:'C de casa'},{A:'D',e:'🐬',p:'delfín',ej:'D de delfín'},{A:'E',e:'🐘',p:'elefante',ej:'E de elefante'},{A:'F',e:'🐸',p:'foca',ej:'F de foca'},{A:'G',e:'🐱',p:'gato',ej:'G de gato'},{A:'H',e:'🦛',p:'hipo',ej:'H de hipo'},{A:'I',e:'🦎',p:'iguana',ej:'I de iguana'},{A:'J',e:'🦒',p:'jirafa',ej:'J de jirafa'},{A:'K',e:'🥝',p:'kiwi',ej:'K de kiwi'},{A:'L',e:'🦁',p:'león',ej:'L de león'},{A:'M',e:'🐒',p:'mono',ej:'M de mono'},{A:'N',e:'🪺',p:'nido',ej:'N de nido'},{A:'Ñ',e:'🪁',p:'ñu',ej:'Ñ de ñu'},{A:'O',e:'🐙',p:'oso',ej:'O de oso'},{A:'P',e:'🐼',p:'panda',ej:'P de panda'},{A:'Q',e:'🧀',p:'queso',ej:'Q de queso'},{A:'R',e:'🐀',p:'ratón',ej:'R de ratón'},{A:'S',e:'🐍',p:'serpiente',ej:'S de serpiente'},{A:'T',e:'🐢',p:'tortuga',ej:'T de tortuga'},{A:'U',e:'🦄',p:'unicornio',ej:'U de unicornio'},{A:'V',e:'🐄',p:'vaca',ej:'V de vaca'},{A:'W',e:'🍉',p:'watermelon',ej:'W de watermelon'},{A:'X',e:'❌',p:'xilófono',ej:'X de xilófono'},{A:'Y',e:'🪀',p:'yoyo',ej:'Y de yoyo'},{A:'Z',e:'🦊',p:'zorro',ej:'Z de zorro'}],
vocalicos:[
{A:'AE',e:'✈️',p:'aeroplano',ej:'ae como en aeroplano'},
{A:'AI',e:'🪁',p:'aire',ej:'ai como en aire'},
{A:'AO',e:'🐟',p:'bacalao',ej:'ao como en bacalao'},
{A:'AU',e:'🚗',p:'auto',ej:'au como en auto'},
{A:'EA',e:'🎭',p:'teatro',ej:'ea como en teatro'},
{A:'EI',e:'👑',p:'reina',ej:'ei como en reina'},
{A:'EO',e:'🦁',p:'león',ej:'eo como en león'},
{A:'EU',e:'💶',p:'euro',ej:'eu como en euro'},
{A:'IA',e:'🎹',p:'piano',ej:'ia como en piano'},
{A:'IE',e:'🦶',p:'pie',ej:'ie como en pie'},
{A:'IO',e:'🌊',p:'río',ej:'io como en río'},
{A:'IU',e:'🏙️',p:'ciudad',ej:'iu como en ciudad'},
{A:'OA',e:'🐨',p:'koala',ej:'oa como en koala'},
{A:'OE',e:'📜',p:'poeta',ej:'oe como en poeta'},
{A:'OI',e:'👂',p:'oído',ej:'oi como en oído'},
{A:'OU',e:'🧳',p:'tour',ej:'ou como en tour'},
{A:'UA',e:'💧',p:'agua',ej:'ua como en agua'},
{A:'UE',e:'🥚',p:'huevo',ej:'ue como en huevo'},
{A:'UI',e:'🔊',p:'ruido',ej:'ui como en ruido'},
{A:'UO',e:'🏛️',p:'antiguo',ej:'uo como en antiguo'}
],
directas:[{A:'BA',e:'👶',p:'bebé',ej:'ba como en bebé'},{A:'MA',e:'👩',p:'mamá',ej:'ma como en mamá'},{A:'PA',e:'🐾',p:'papa',ej:'pa como en papa'}],
inversas:[{A:'AN',e:'👼',p:'angel',ej:'an como en angel'},{A:'AL',e:'👽',p:'alto',ej:'al como en alto'}],
trabadas:[{A:'BRA',e:'💪',p:'brazo',ej:'bra como en brazo'},{A:'PLA',e:'🍽️',p:'plato',ej:'pla como en plato'}],
palabras:[{A:'LA MESA',e:'🪑',p:'la mesa',ej:'la mesa'}]
};
const SECCIONES=[{id:'letras',label:'🔤 LETRAS'},{id:'vocalicos',label:'👀 VOCÁLICOS'},{id:'directas',label:'➡️ SÍLABAS'},{id:'inversas',label:'⬅️ INVERSAS'},{id:'trabadas',label:'🚂 TRABADAS'}];
function initTabs(){let c=document.getElementById('tabs');SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id==='vocalicos')b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');render();mostrar(actual);}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');render();mostrar(DATA[s][0].A);}
function render(){let g=document.getElementById('grid');g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div class="ico">${it.e}</div><div class="txt">${fmt(it.A)}</div><div class="pal">${it.p}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];document.getElementById('emoji').textContent=it.e;let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+tipo;document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><small>${it.e} ${it.ej}</small>`;document.getElementById('btnAudio').textContent=`🔊 ${fmt(it.A)} - ${it.p}`;}
function hablar(){
  speechSynthesis.cancel();
  let it=DATA[seccion].find(x=>x.A===actual);
  let txt=it.A.toLowerCase();
  let voz=speechSynthesis.getVoices().find(v=>v.lang==='es-ES'&&v.name.includes('Google'))||speechSynthesis.getVoices().find(v=>v.lang==='es-ES')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));
  if(seccion==='vocalicos'){
    // 1º dice el grupo vocalico TODO JUNTO
    let u1=new SpeechSynthesisUtterance();
    u1.lang='es-ES';u1.volume=1;u1.pitch=1.3;
    if(voz) u1.voice=voz;
    if(txt==='ai'){u1.text='a i';u1.rate=0.32;} else if(txt==='au'){u1.text='a u';u1.rate=0.32;} else {u1.text=txt;u1.rate=0.42;}
    speechSynthesis.speak(u1);
    // 2º dice el ejemplo relacionado con el dibujo
    setTimeout(()=>{
      let u2=new SpeechSynthesisUtterance(it.p);
      u2.lang='es-ES';u2.volume=1;u2.rate=0.6;u2.pitch=1.1;
      if(voz) u2.voice=voz;
      speechSynthesis.speak(u2);
    },800);
  } else {
    let u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.volume=1;u.rate=0.6;u.pitch=1.2;if(voz)u.voice=voz;speechSynthesis.speak(u);
  }
}
speechSynthesis.onvoiceschanged=()=>{};
initTabs();render();mostrar('AE');
</script></body></html>
