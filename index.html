<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEO v115 LETRAS A DE AIRE</title><link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Andika:wght@700&family=Nunito:wght@800;900&display=swap" rel="stylesheet"><style>
body{margin:0;font-family:'Nunito',system-ui;background:#fff6f9;background-image:radial-gradient(#ffdeeb 2px, transparent 2px),radial-gradient(#d4f0ff 2px, transparent 2px);background-size:40px 40px;background-position:0 0,20px 20px}
header{background:linear-gradient(90deg,#e8438a,#ff8f5a);color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px;position:sticky;top:0;z-index:10}
.tipos{display:flex;gap:8px;justify-content:center;background:#fff;padding:12px;position:sticky;top:50px;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.btn{border:0;padding:10px 16px;border-radius:20px;font-weight:900;cursor:pointer}
.btn.tipo{background:#fff0f6;color:#e8438a;border:2px solid #ffbdd7}.btn.tipo.activo{background:#e8438a;color:#fff;transform:scale(1.05)}
.tabs{display:flex;overflow-x:auto;gap:8px;padding:12px;background:#fff;position:sticky;top:100px;z-index:10}
.tabs button{border:0;background:#fff0f6;padding:10px 16px;border-radius:20px;font-weight:900;color:#e8438a;white-space:nowrap}
.tabs button.activo{background:#e8438a;color:#fff}
.card{background:#fff;border-radius:24px;padding:18px;margin:12px auto;box-shadow:0 12px 30px rgba(0,0,0,.08);text-align:center;max-width:1150px}
.letra-big{font-size:130px;font-weight:900;line-height:.9}.letra-big.mayuscula{color:#e8438a}.letra-big.minuscula{font-family:'Andika',sans-serif;color:#e8438a}.letra-big.ligada{font-family:'Cedarville Cursive',cursive;color:#1a1a1a;font-weight:400;font-size:120px}
.ejemplo{font-size:26px;font-weight:900;color:#6c5ce7;margin-top:6px;font-family:'Cedarville Cursive',cursive}.ejemplo small{font-family:'Nunito',sans-serif;font-size:14px;color:#ff8f5a;display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:10px}
.item{border:2px solid #ffe0ec;border-radius:18px;padding:10px;background:#fff;cursor:pointer}
.item.activo{border-color:#e8438a;background:#fff0f6}
.item.ico{font-size:36px}.item.txt{font-weight:900;color:#e8438a;font-size:18px}.item.pal{font-size:11px;font-weight:800;color:#6c5ce7}
</style></head><body><header>🌈 LEO Y APRENDO v115</header><div class="tipos"><button class="btn tipo" id="bMayus" onclick="setTipo('mayuscula')">A MAYÚSCULA</button><button class="btn tipo" id="bMinus" onclick="setTipo('minuscula')">a minúscula</button><button class="btn tipo activo" id="bLigada" onclick="setTipo('ligada')" style="font-family:'Cedarville Cursive',cursive">a ligada</button></div><div class="tabs" id="tabs"></div><div class="card"><div id="emoji" style="font-size:70px">🍎</div><div id="letraG" class="letra-big ligada">a</div><div id="textoG" class="ejemplo">a - <b>aire</b><small>🪁 A de aire</small></div><button class="btn" style="background:linear-gradient(90deg,#6c5ce7,#a66cff);color:white;width:100%;margin-top:14px;padding:18px;font-size:22px;border-radius:16px" onclick="hablar()" id="btnAudio">🔊 A de aire</button></div><div class="card"><div class="grid" id="grid"></div></div><script>
let tipo='ligada',seccion='letras',actual='A';
// NUEVO ABECEDARIO: A de aire, B de barco...
const LETRAS=[
{A:'A',e:'🪁',p:'aire',ej:'A de aire'},{A:'B',e:'⛵',p:'barco',ej:'B de barco'},{A:'C',e:'🏠',p:'casa',ej:'C de casa'},{A:'D',e:'🐬',p:'delfín',ej:'D de delfín'},{A:'E',e:'🐘',p:'elefante',ej:'E de elefante'},{A:'F',e:'🗼',p:'faro',ej:'F de faro'},{A:'G',e:'🐱',p:'gato',ej:'G de gato'},{A:'H',e:'🦛',p:'hipo',ej:'H de hipo'},{A:'I',e:'🧲',p:'imán',ej:'I de imán'},{A:'J',e:'🦒',p:'jirafa',ej:'J de jirafa'},{A:'K',e:'🥝',p:'kiwi',ej:'K de kiwi'},{A:'L',e:'🌙',p:'luna',ej:'L de luna'},{A:'M',e:'🌊',p:'mar',ej:'M de mar'},{A:'N',e:'🪺',p:'nido',ej:'N de nido'},{A:'Ñ',e:'🍍',p:'piña',ej:'Ñ de piña'},{A:'O',e:'🐙',p:'oso',ej:'O de oso'},{A:'P',e:'⚽',p:'pelota',ej:'P de pelota'},{A:'Q',e:'🧀',p:'queso',ej:'Q de queso'},{A:'R',e:'🐀',p:'ratón',ej:'R de ratón'},{A:'S',e:'☀️',p:'sol',ej:'S de sol'},{A:'T',e:'🐢',p:'tortuga',ej:'T de tortuga'},{A:'U',e:'🍇',p:'uva',ej:'U de uva'},{A:'V',e:'🐄',p:'vaca',ej:'V de vaca'},{A:'W',e:'🍉',p:'waffle',ej:'W de waffle'},{A:'X',e:'🎷',p:'xilófono',ej:'X de xilófono'},{A:'Y',e:'🪀',p:'yoyo',ej:'Y de yoyo'},{A:'Z',e:'👟',p:'zapato',ej:'Z de zapato'}];
const VOC=[{A:'AE',e:'✈️',p:'aeroplano',ej:'ae como en aeroplano'},{A:'AI',e:'🪁',p:'aire',ej:'ai como en aire'},{A:'AO',e:'🐟',p:'bacalao',ej:'ao como en bacalao'},{A:'AU',e:'🚗',p:'auto',ej:'au como en auto'},{A:'EA',e:'🎭',p:'teatro',ej:'ea como en teatro'},{A:'EI',e:'👑',p:'reina',ej:'ei como en reina'},{A:'EO',e:'🦁',p:'león',ej:'eo como en león'},{A:'EU',e:'💶',p:'euro',ej:'eu como en euro'},{A:'IA',e:'🎹',p:'piano',ej:'ia como en piano'},{A:'IE',e:'🦶',p:'pie',ej:'ie como en pie'},{A:'IO',e:'🌊',p:'río',ej:'io como en río'},{A:'IU',e:'🏙️',p:'ciudad',ej:'iu como en ciudad'},{A:'OA',e:'🐨',p:'koala',ej:'oa como en koala'},{A:'OE',e:'📜',p:'poeta',ej:'oe como en poeta'},{A:'OI',e:'👂',p:'oído',ej:'oi como en oído'},{A:'OU',e:'🧳',p:'tour',ej:'ou como en tour'},{A:'UA',e:'💧',p:'agua',ej:'ua como en agua'},{A:'UE',e:'🥚',p:'huevo',ej:'ue como en huevo'},{A:'UI',e:'🔊',p:'ruido',ej:'ui como en ruido'},{A:'UO',e:'🏛️',p:'antiguo',ej:'uo como en antiguo'}];
const DIR_BASE=['B','C','D','F','G','H','J','K','L','M','N','Ñ','P','Q','R','S','T','V','W','X','Y','Z'];const VOCALES=['A','E','I','O','U'];let DIR=[];DIR_BASE.forEach(c=>{VOCALES.forEach(v=>{let sil=c+v;if(c==='Q'){if(v==='A')sil='QA';if(v==='E')sil='QUE';if(v==='I')sil='QUI';if(v==='O')sil='QO';if(v==='U')sil='QU';}let emoji={B:'🟤',C:'🏠',D:'🎲',F:'🐘',G:'🐱',H:'🦛',J:'🦒',K:'🥝',L:'🌙',M:'👩',N:'🪺',Ñ:'🍍',P:'🍞',Q:'🧀',R:'🐀',S:'☀️',T:'🐢',V:'🐄',W:'🍉',X:'❌',Y:'🪀',Z:'👟'}[c]||'🔤';let pal={BA:'barro',BE:'beso',BI:'bici',BO:'bola',BU:'búho',CA:'casa',CE:'cebra',CI:'cinco',CO:'coco',CU:'cuna',DA:'dado',DE:'dedo',DI:'dino',DO:'dos',DU:'dulce',FA:'faro',FE:'feo',FI:'fiesta',FO:'foca',FU:'fuego',GA:'gato',GE:'gente',GI:'giro',GO:'gota',GU:'gusano',HA:'hada',HE:'helado',HI:'hilo',HO:'hoja',HU:'huevo',JA:'jirafa',JE:'jefe',JI:'jirafa',JO:'joven',JU:'jugo',KA:'karate',KE:'keko',KI:'kiwi',KO:'koala',KU:'kung fu',LA:'luna',LE:'león',LI:'libro',LO:'lobo',LU:'luz',MA:'mamá',ME:'mesa',MI:'mío',MO:'mono',MU:'muro',NA:'nave',NE:'nene',NI:'nido',NO:'noche',NU:'nube',ÑA:'piña',ÑE:'muñeca',ÑI:'niño',ÑO:'año',ÑU:'ñu',PA:'papa',PE:'perro',PI:'pico',PO:'pollo',PU:'pulpo',QA:'queso',QUE:'queso',QUI:'queso',QO:'queso',QU:'queso',RA:'rata',RE:'rey',RI:'risa',RO:'rosa',RU:'rueda',SA:'sapo',SE:'seda',SI:'sí',SO:'sol',SU:'sube',TA:'taza',TE:'té',TI:'tigre',TO:'toro',TU:'tú',VA:'vaca',VE:'ver',VI:'vino',VO:'vuelo',VU:'vuelo',WA:'waffle',WE:'web',WI:'wifi',WO:'wombat',WU:'wushu',XA:'taxi',XE:'examen',XI:'taxi',XO:'boxeo',XU:'taxi',YA:'yate',YE:'yema',YI:'yin',YO:'yo',YU:'yuca',ZA:'zapato',ZE:'cero',ZI:'zinc',ZO:'zorro',ZU:'zumo'}[sil]||sil.toLowerCase();DIR.push({A:sil,e:emoji,p:pal,ej:`${sil.toLowerCase()} como en ${pal}`});});});
const FINALES=['N','S','L','R','M','Z','D','J'];let INV=[];['A','E','I','O','U'].forEach(v=>{FINALES.forEach(f=>{let sil=v+f;let emoji={N:'👼',S:'⭐',L:'⬆️',R:'🌳',M:'💛',Z:'💙',D:'🎁',J:'🕹️'}[f]||'⬅️';let pal={AN:'ángel',AS:'asta',AL:'alto',AR:'árbol',AM:'amor',AZ:'azul',AD:'edad',AJ:'ajo',EN:'en',ES:'es',EL:'él',ER:'ser',EM:'embudo',EZ:'vez',ED:'red',EJ:'eje',IN:'in',IS:'isla',IL:'hilo',IR:'ir',IM:'imán',IZ:'izquierda',ID:'idea',IJ:'jinete',ON:'con',OS:'oso',OL:'sol',OR:'or',OM:'sombra',OZ:'voz',OD:'red',OJ:'ojo',UN:'un',US:'usted',UL:'pulgar',UR:'sur',UM:'suma',UZ:'luz',UD:'sud',UJ:'lujo'}[sil]||sil.toLowerCase();INV.push({A:sil,e:emoji,p:pal,ej:`${sil.toLowerCase()} como en ${pal}`});});});
const DATA={letras:LETRAS,vocalicos:VOC,directas:DIR,inversas:INV,trabadas:[{A:'BLA',e:'⚪',p:'blanco',ej:'bla como en blanco'},{A:'BRA',e:'💪',p:'brazo',ej:'bra como en brazo'},{A:'CLA',e:'🔑',p:'clase',ej:'cla como en clase'},{A:'TRA',e:'🚂',p:'tren',ej:'tra como en tren'}]};
const SECCIONES=[{id:'letras',label:'🔤 LETRAS'},{id:'vocalicos',label:'👀 VOCÁLICOS (20)'},{id:'directas',label:'➡️ DIRECTAS (110)'},{id:'inversas',label:'⬅️ INVERSAS (40)'},{id:'trabadas',label:'🚂 TRABADAS'}];
function initTabs(){let c=document.getElementById('tabs');SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id==='letras')b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');render();mostrar(actual);}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');render();mostrar(DATA[s][0].A);}
function render(){let g=document.getElementById('grid');g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item'+(it.A===actual?' activo':'');d.innerHTML=`<div class="ico">${it.e}</div><div class="txt">${fmt(it.A)}</div><div class="pal">${it.p}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];document.getElementById('emoji').textContent=it.e;let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+tipo;document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><small>${it.e} ${it.ej}</small>`;document.getElementById('btnAudio').textContent=`🔊 ${it.ej}`;}
function hablar(){
  speechSynthesis.cancel();
  let it=DATA[seccion].find(x=>x.A===actual);
  let txt=it.A.toLowerCase().replace('que','ke').replace('qui','ki');
  let voz=speechSynthesis.getVoices().find(v=>v.lang==='es-ES'&&v.name.includes('Google'))||speechSynthesis.getVoices().find(v=>v.lang==='es-ES')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));
  // NUEVO: LETRAS dicen "A de aire, B de barco..."
  if(seccion==='letras'){
    let u=new SpeechSynthesisUtterance(it.ej); // ej = "A de aire"
    u.lang='es-ES';u.volume=1;u.rate=0.48;u.pitch=1.2;if(voz)u.voice=voz;
    speechSynthesis.speak(u);
    return;
  }
  if(seccion==='vocalicos'){
    let u=new SpeechSynthesisUtterance();u.lang='es-ES';u.volume=1;u.pitch=1.3;if(voz)u.voice=voz;
    if(txt==='ai'){u.text='a i';u.rate=0.32;} else if(txt==='au'){u.text='a u';u.rate=0.32;} else {u.text=txt;u.rate=0.42;}
    speechSynthesis.speak(u);
    setTimeout(()=>{let u2=new SpeechSynthesisUtterance(it.p);u2.lang='es-ES';u2.rate=0.6;if(voz)u2.voice=voz;speechSynthesis.speak(u2);},800);
    return;
  }
  if(txt==='ba'){
    let u1=new SpeechSynthesisUtterance('ba');u1.lang='es-ES';u1.volume=1;u1.rate=0.32;u1.pitch=1.4;if(voz)u1.voice=voz;speechSynthesis.speak(u1);
    setTimeout(()=>{let u2=new SpeechSynthesisUtterance('barro');u2.lang='es-ES';u2.rate=0.55;if(voz)u2.voice=voz;speechSynthesis.speak(u2);},700);
    return;
  }
  if(txt==='be'){
    let u1=new SpeechSynthesisUtterance('be');u1.lang='es-ES';u1.volume=1;u1.rate=0.32;u1.pitch=1.4;if(voz)u1.voice=voz;speechSynthesis.speak(u1);
    return;
  }
  let u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.volume=1;u.rate=0.55;u.pitch=1.2;if(voz)u.voice=voz;speechSynthesis.speak(u);
}
initTabs();render();mostrar('A');
</script></body></html>
