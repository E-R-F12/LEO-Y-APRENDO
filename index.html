function initTabs(){let c=document.getElementById('tabs');SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id==='letras')b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});let f=document.getElementById('filtros');['TODAS','A','B','C','D','E','F','G','H','I','J','K','L','M','N','Ñ','O','P','Q','R','S','T','U','V','W','X','Y','Z'].forEach(l=>{let btn=document.createElement('button');btn.textContent=l;btn.id='f_'+l;if(l==='TODAS')btn.classList.add('activo');btn.onclick=()=>{filtroLetra=l;[...f.children].forEach(c=>c.classList.remove('activo'));btn.classList.add('activo');renderFormacionList();};f.appendChild(btn);});}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');if(seccion!=='formacion'){render();mostrar(actual);}else{mostrarFormacion(palabraActual.p);}}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');if(s==='formacion'){document.getElementById('vista-normal').style.display='none';document.getElementById('vista-formacion').style.display='block';renderFormacionList();mostrarFormacion((FORMACION.find(x=>filtroLetra==='TODAS'||x.letra===filtroLetra)||FORMACION[0]).p);}else{document.getElementById('vista-normal').style.display='block';document.getElementById('vista-formacion').style.display='none';render();mostrar(DATA[s][0].A);}}
function render(){let g=document.getElementById('grid');g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item'+(it.A===actual?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt">${fmt(it.A)}</div><div class="pal">${it.p}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];document.getElementById('emoji').textContent=it.e;let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+tipo;document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><br><small style="font-family:'Nunito';color:#ff8f5a">${it.e} ${it.ej}</small>`;document.getElementById('btnAudio').textContent=`🔊 ${it.ej}`;}
function hablar(){
  speechSynthesis.cancel();
  let it=DATA[seccion].find(x=>x.A===actual)||DATA[seccion][0];
  let voz=speechSynthesis.getVoices().find(v=>v.lang==='es-ES'&&v.name.includes('Google'))||speechSynthesis.getVoices().find(v=>v.lang==='es-ES')||speechSynthesis.getVoices()[0];
  if(seccion==='letras'){
    let u=new SpeechSynthesisUtterance(it.ej);
    u.lang='es-ES';u.rate=0.42;u.pitch=1.1;u.volume=1;
    if(voz)u.voice=voz;
    speechSynthesis.speak(u);
    return;
  }
  let u=new SpeechSynthesisUtterance((it.A||'').toLowerCase());u.lang='es-ES';u.rate=0.5;if(voz)u.voice=voz;speechSynthesis.speak(u);
}
function renderFormacionList(){let g=document.getElementById('gridForm');g.innerHTML='';FORMACION.filter(x=>filtroLetra==='TODAS'||x.letra===filtroLetra).forEach(it=>{let d=document.createElement('div');d.className='item'+(palabraActual&&it.p===palabraActual.p?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt">${fmt(it.p)}</div><div class="pal">${it.sil.join('-')}</div>`;d.onclick=()=>mostrarFormacion(it.p);g.appendChild(d);});}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function mostrarFormacion(p){
  let it=FORMACION.find(x=>x.p===p)||FORMACION[0];palabraActual=it;

  document.getElementById('formPalabra').textContent=fmt(it.p);
  let pool=document.getElementById('pool');pool.innerHTML='';
  shuffle(it.sil).forEach(s=>{
    let d=document.createElement('div');d.className='sil-drag';d.draggable=true;d.textContent=fmt(s);d.dataset.sil=s.toLowerCase();
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',s.toLowerCase());});
    pool.appendChild(d);
  });
  let zone=document.getElementById('dropZone');zone.innerHTML='';
  it.sil.forEach(s=>{
    let box=document.createElement('div');box.className='drop-box';box.dataset.expected=s.toLowerCase();box.textContent='?';
    box.addEventListener('dragover',e=>{e.preventDefault();});
    box.addEventListener('drop',e=>{
      e.preventDefault();let sil=e.dataTransfer.getData('text/plain');if(!sil)return;box.textContent=sil;box.dataset.filled=sil;[...pool.children].find(c=>c.dataset.sil===sil)?.remove();
    });
    box.addEventListener('click',()=>{if(box.dataset.filled){let sil=box.dataset.filled;let d=document.createElement('div');d.className='sil-drag';d.draggable=true;d.textContent=fmt(sil);d.dataset.sil=sil;d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',sil);});pool.appendChild(d);box.textContent='?';delete box.dataset.filled;box.className='drop-box';}});
    zone.appendChild(box);
  });
  document.getElementById('formMsg').textContent='';renderFormacionList();
}
function hablarFormacion(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(palabraActual.p);u.lang='es-ES';u.rate=0.45;speechSynthesis.speak(u);}
function comprobarFormacion(){
  let boxes=[...document.querySelectorAll('.drop-box')];let ok=true;
  boxes.forEach(b=>{if(b.dataset.filled===b.dataset.expected){b.classList.add('ok');}else{b.classList.add('bad');ok=false;}});
  let msg=document.getElementById('formMsg');
  if(ok){msg.textContent='¡Perfecto! 🎉 '+palabraActual.sil.join('-');msg.style.color='#00b894';hablarFormacion();}
  else{msg.textContent='Sigue intentando 👀';msg.style.color='#e8438a';}
}
function siguienteFormacion(){let list=FORMACION.filter(x=>filtroLetra==='TODAS'||x.letra===filtroLetra);let idx=list.indexOf(palabraActual);let next=list[(idx+1)%list.length];mostrarFormacion(next.p);}
initTabs();render();mostrar('A');palabraActual=FORMACION[0];
</script></body></html>

- b de barco
- c de casa
