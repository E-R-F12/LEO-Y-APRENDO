</style></head><body><header>🌈 LEO v133 - ORTOGRAFÍA</header><div class="tipos"><button class="btn tipo" id="bMayus" onclick="setTipo('mayuscula')">A MAYÚSCULA</button><button class="btn tipo" id="bMinus" onclick="setTipo('minuscula')">a minúscula</button><button class="btn tipo activo" id="bLigada" onclick="setTipo('ligada')" style="font-family:'Dancing Script',cursive">a ligada Rubio</button></div><div class="tabs" id="tabs"></div>
<div id="vista-normal" style="display:none"><div class="card pauta"><div class="nav-row"><button class="arrow" onclick="anterior()">⬅️</button><div style="flex:1"><div id="emoji" style="font-size:70px">🌙</div><div id="letraG" class="letra-big ligada">an</div><div id="textoG" style="font-size:22px;font-weight:900;color:#6c5ce7"></div></div><button class="arrow" onclick="siguiente()">➡️</button></div><button class="btn" style="background:linear-gradient(90deg,#6c5ce7,#a66cff);color:white;width:100%;margin-top:14px;padding:16px;font-size:20px;border-radius:16px" onclick="hablar()" id="btnAudio">🔊</button></div><div class="card"><div class="grid" id="grid"></div></div></div>

<script>
let tipo='ligada',seccion='frases',actual='AN';let fraseActual=null;
const LETRAS=[{A:'A',e:'🪁',p:'aire',ej:'a de aire'}];
const TRABADAS_DATA=[{A:'BLA',e:'🏳️',p:'blanco',ej:'bla como en blanco',fon:'bla'}];
const INVERSAS_DATA=[{A:'AN',e:'⚓',p:'ancla',ej:'an como en ancla',fon:'an'}];
const DIR=[{A:'BA',e:'🟤',p:'barro',ej:'ba como en barro',fon:'ba'}];
const DATA={letras:LETRAS,directas:DIR,inversas:INVERSAS_DATA,trabadas:TRABADAS_DATA};
// 60 FRASES CON ORTOGRAFÍA CORRECTA
const FRASES_DATA=[
{f:'La luna brilla',e:'🌙',pal:['La','luna','brilla']},{f:'El sol sale',e:'☀️',pal:['El','sol','sale']},{f:'El gato bebe leche',e:'🐱',pal:['El','gato','bebe','leche']},{f:'Mi perro corre',e:'🐶',pal:['Mi','perro','corre']},{f:'La casa es bonita',e:'🏠',pal:['La','casa','es','bonita']},{f:'El niño juega',e:'👦',pal:['El','niño','juega']},{f:'La niña canta',e:'👧',pal:['La','niña','canta']},{f:'Paco come pan',e:'🍞',pal:['Paco','come','pan']},{f:'Luna toma agua',e:'💧',pal:['Luna','toma','agua']},{f:'El oso come miel',e:'🐻',pal:['El','oso','come','miel']},
{f:'La vaca da leche',e:'🐄',pal:['La','vaca','da','leche']},{f:'El pato nada',e:'🦆',pal:['El','pato','nada']},{f:'Mi bici es roja',e:'🚲',pal:['Mi','bici','es','roja']},{f:'El barco navega',e:'⛵',pal:['El','barco','navega']},{f:'Mamá me ama',e:'🤱',pal:['Mamá','me','ama']},
{f:'El perro ladra',e:'🐕',pal:['El','perro','ladra']},{f:'La gata duerme',e:'😺',pal:['La','gata','duerme']},{f:'Mi mamá cocina',e:'🍳',pal:['Mi','mamá','cocina']},{f:'Papá lee el libro',e:'📚',pal:['Papá','lee','el','libro']},{f:'El niño bebe agua',e:'👦',pal:['El','niño','bebe','agua']},
{f:'La niña come fresa',e:'🍓',pal:['La','niña','come','fresa']},{f:'El coche es rojo',e:'🚗',pal:['El','coche','es','rojo']},{f:'La flor es bonita',e:'🌸',pal:['La','flor','es','bonita']},{f:'El pájaro canta',e:'🐦',pal:['El','pájaro','canta']},{f:'El pez nada',e:'🐟',pal:['El','pez','nada']},
{f:'La tortuga camina lento',e:'🐢',pal:['La','tortuga','camina','lento']},{f:'El elefante es grande',e:'🐘',pal:['El','elefante','es','grande']},{f:'La jirafa es alta',e:'🦒',pal:['La','jirafa','es','alta']},{f:'El mono come plátano',e:'🐒',pal:['El','mono','come','plátano']},{f:'La abeja hace miel',e:'🐝',pal:['La','abeja','hace','miel']},
{f:'Mi casa es grande',e:'🏠',pal:['Mi','casa','es','grande']},{f:'El tren va rápido',e:'🚂',pal:['El','tren','va','rápido']},{f:'El avión vuela alto',e:'✈️',pal:['El','avión','vuela','alto']},{f:'El barco flota',e:'⛵',pal:['El','barco','flota']},{f:'El globo sube',e:'🎈',pal:['El','globo','sube']},
{f:'La nube es blanca',e:'☁️',pal:['La','nube','es','blanca']},{f:'La lluvia cae',e:'🌧️',pal:['La','lluvia','cae']},{f:'El viento sopla',e:'🌬️',pal:['El','viento','sopla']},{f:'La nieve es fría',e:'❄️',pal:['La','nieve','es','fría']},{f:'Mi mano está limpia',e:'✋',pal:['Mi','mano','está','limpia']},
{f:'La mesa es de madera',e:'🪑',pal:['La','mesa','es','de','madera']},{f:'La puerta se abre',e:'🚪',pal:['La','puerta','se','abre']},{f:'El lobo aúlla',e:'🐺',pal:['El','lobo','aúlla']},{f:'La vaca come hierba',e:'🐄',pal:['La','vaca','come','hierba']},{f:'El caballo corre',e:'🐴',pal:['El','caballo','corre']},
{f:'La oveja tiene lana',e:'🐑',pal:['La','oveja','tiene','lana']},{f:'La gallina pone huevos',e:'🐔',pal:['La','gallina','pone','huevos']},{f:'El gallo canta',e:'🐓',pal:['El','gallo','canta']},{f:'Los niños juegan',e:'👦',pal:['Los','niños','juegan']},{f:'Las niñas saltan',e:'👧',pal:['Las','niñas','saltan']},
{f:'Todos reímos juntos',e:'😂',pal:['Todos','reímos','juntos']},{f:'El sol brilla mucho',e:'☀️',pal:['El','sol','brilla','mucho']},{f:'La luna es blanca',e:'🌙',pal:['La','luna','es','blanca']},{f:'Mi pelota bota',e:'⚽',pal:['Mi','pelota','bota']},{f:'Tu libro tiene fotos',e:'📚',pal:['Tu','libro','tiene','fotos']},
{f:'La ventana brilla',e:'🪟',pal:['La','ventana','brilla']},{f:'El oso duerme',e:'🐻',pal:['El','oso','duerme']},{f:'El cerdo come',e:'🐖',pal:['El','cerdo','come']},{f:'Mi tío ríe',e:'👨',pal:['Mi','tío','ríe']},{f:'Mi tía canta',e:'👩',pal:['Mi','tía','canta']},
{f:'La moto corre',e:'🏍️',pal:['La','moto','corre']},{f:'El fuego quema',e:'🔥',pal:['El','fuego','quema']},{f:'Tus ojos brillan',e:'👀',pal:['Tus','ojos','brillan']},{f:'La silla es pequeña',e:'🪑',pal:['La','silla','es','pequeña']}
];
const SECCIONES=[
{id:'letras',label:'🔤 LETRAS'},{id:'directas',label:'➡️ DIRECTAS'},{id:'inversas',label:'🔄 INVERSAS'},{id:'trabadas',label:'🚂 TRABADAS'},{id:'formacion',label:'📝 FORMACIÓN'},{id:'frases',label:'💬 FRASES (60)'}
];
function initTabs(){
  let c=document.getElementById('tabs');c.innerHTML='';
  SECCIONES.forEach(s=>{
    let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;
    if(s.id==='frases') b.classList.add('activo');
    b.onclick=()=>setSeccion(s.id);c.appendChild(b);
  });
}
function fmt(t){
  // Para sílabas/letras sí aplica mayúscula/minúscula/ligada
  // Para FRASES no se usa fmt, se respeta ortografía
  return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();
}
function fmtFrase(t){
  // Respeta ortografía: si es ligada, pasa a minúscula pero luego capitaliza primera y nombres propios
  let base = t;
  if(tipo==='mayuscula') return t.toUpperCase();
  if(tipo==='minuscula') {
    // primera letra mayúscula siempre
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase().replace(/\b(paco|luna|mamá|papá|mimi)\b/gi, (m)=>m.charAt(0).toUpperCase()+m.slice(1).toLowerCase());
  }
  // ligada: respeta original pero en cursiva
  return t;
}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');if(fraseActual) mostrarFrase(fraseActual.f);}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');document.getElementById('vista-normal').style.display=s==='frases'?'none':'none';document.getElementById('vista-frases').style.display=s==='frases'?'block':'none';if(s==='frases'){renderFrasesList();mostrarFrase(FRASES_DATA[0].f);}else{document.getElementById('vista-normal').style.display='block';}}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function renderFrasesList(){let g=document.getElementById('gridFrases');g.innerHTML='';FRASES_DATA.forEach(it=>{let d=document.createElement('div');d.className='item'+(fraseActual&&it.f===fraseActual.f?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt ${tipo==='ligada'?'ligada':''}" style="font-size:10px">${fmtFrase(it.f)}</div>`;d.onclick=()=>mostrarFrase(it.f);g.appendChild(d);});}
function mostrarFrase(f){
  let it=FRASES_DATA.find(x=>x.f===f)||FRASES_DATA[0];fraseActual=it;
  document.getElementById('fraseEmoji').textContent=it.e;
  // ORTOGRAFÍA CORRECTA: siempre con mayúscula inicial y nombres propios
  let textoOrto = fmtFrase(it.f);
  let elTexto = document.getElementById('fraseTexto');
  elTexto.textContent=textoOrto;
  elTexto.className=tipo==='ligada'?'letra-big ligada':'letra-big';
  elTexto.style.fontSize='36px';
  elTexto.style.textTransform='none';
  document.getElementById('fraseSub').textContent=it.f; // original ortográfico siempre
  document.getElementById('fraseCont').textContent=`Frase ${FRASES_DATA.indexOf(it)+1} de ${FRASES_DATA.length} - Ortografía correcta`;
  let pool=document.getElementById('frasePool');pool.innerHTML='';
  shuffle(it.pal).forEach(w=>{
    // w ya viene con mayúscula correcta: La, Paco, Mamá
    let d=document.createElement('div');d.className='word';
    d.textContent = tipo==='mayuscula'? w.toUpperCase() : tipo==='ligada'? w : (w.charAt(0).toUpperCase()===w.charAt(0)? w : w);
    // Para palabras que son nombres propios, siempre mayúscula inicial
    if(['Paco','Luna','Mamá','Papá'].includes(w)) d.textContent=w;
    if(tipo==='minuscula' && ['La','El','Mi','Los','Las','Todos','Tus','Tu'].includes(w)) d.textContent=w; // mantiene mayúscula inicial por ortografía
    d.dataset.word=w.toLowerCase();d.draggable=true;
    d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',w.toLowerCase());});
    pool.appendChild(d);
  });
  let drop=document.getElementById('fraseDrop');drop.innerHTML='';
  it.pal.forEach(w=>{
    let box=document.createElement('div');box.className='drop';box.dataset.expected=w.toLowerCase();box.textContent='?';
    box.addEventListener('dragover',e=>{e.preventDefault();});
    box.addEventListener('drop',e=>{e.preventDefault();let wd=e.dataTransfer.getData('text/plain');if(!wd)return;let original = it.pal.find(p=>p.toLowerCase()===wd)||wd; box.textContent=original; box.dataset.filled=wd; [...pool.children].find(c=>c.dataset.word===wd)?.remove();});
    box.addEventListener('click',()=>{if(box.dataset.filled){let wd=box.dataset.filled;let original = it.pal.find(p=>p.toLowerCase()===wd)||wd;let d=document.createElement('div');d.className='word';d.textContent=original;d.dataset.word=wd;d.draggable=true;d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',wd);});pool.appendChild(d);box.textContent='?';delete box.dataset.filled;}});
    drop.appendChild(box);
  });
  document.getElementById('fraseMsg').textContent='';renderFrasesList();
}
function getVoice(){let vs=speechSynthesis.getVoices();return vs.find(v=>v.lang==='es-ES'&&v.name.toLowerCase().includes('google'))||vs.find(v=>v.lang==='es-ES')||vs[0];}
function hablarFrase(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(fraseActual.f);u.lang='es-ES';u.rate=0.45;u.voice=getVoice();speechSynthesis.speak(u);}
function comprobarFrase(){let boxes=[...document.querySelectorAll('#fraseDrop div')];let ok=true;boxes.forEach(b=>{if(b.dataset.filled!==b.dataset.expected) ok=false;});let msg=document.getElementById('fraseMsg');if(ok){msg.textContent='¡Perfecto! 🎉 '+fraseActual.f;msg.style.color='#00b894';hablarFrase();}else{msg.textContent='Sigue intentando 👀';msg.style.color='#e8438a';}}
function fraseNav(dir){let idx=FRASES_DATA.findIndex(x=>x.f===fraseActual.f);let next=(idx+dir+FRASES_DATA.length)%FRASES_DATA.length;mostrarFrase(FRASES_DATA[next].f);hablarFrase();}
function anterior(){}
function siguiente(){}
function hablar(){}
function mostrar(){}
function render(){}
initTabs();mostrarFrase(FRASES_DATA[0].f);
</script></body></html>
