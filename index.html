const SECCIONES=[{id:'letras',label:'🔤 LETRAS (27)'},{id:'vocalicos',label:'👀 VOCALICOS (20) ae ai ao au'},{id:'directas',label:'➡️ DIRECTAS (110) ba be bi'},{id:'inversas',label:'⬅️ INVERSAS (40) an as al'},{id:'trabadas',label:'🚂 TRABADAS (60) bla bra'},{id:'palabras',label:'📚 PALABRAS'}];
function initTabs(){let c=document.getElementById('tabs');SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id==='letras')b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');render();mostrar(actual);hablar();}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');render();mostrar(DATA[s][0].A);}
function render(){let g=document.getElementById('grid');g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<div style="font-size:28px">${it.e}</div><div class="l ${tipo}">${fmt(it.A)}</div><div style="font-size:9px;color:#888">${fmt(it.p)}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});document.getElementById('contador').textContent=`v102 - ${DATA[seccion].length} fichas - ${seccion}`;}
function mostrar(cod){
actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];
document.getElementById('emoji').textContent=it.e;
let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+tipo;
if(seccion==='vocalicos'){document.getElementById('textoG').textContent=fmt(it.A)+' - '+fmt(it.p);}
else{document.getElementById('textoG').textContent=fmt(it.A);}
document.getElementById('btnAudio').textContent='🔊 '+fmt(it.A);
let ops=[it.A];while(ops.length<4){let r=DATA[seccion][Math.floor(Math.random()*DATA[seccion].length)].A;if(!ops.includes(r))ops.push(r);}ops=ops.sort(()=>Math.random()-0.5);
let cont=document.getElementById('opciones');cont.innerHTML='';
ops.forEach(o=>{let div=document.createElement('div');div.className='op '+tipo;div.textContent=fmt(o);div.onclick=()=>{if(o===it.A){hablar();div.style.borderColor='#2ecc71';}else div.style.borderColor='#e74c3c';};cont.appendChild(div);});
}
function hablar(){
speechSynthesis.cancel();
let it=DATA[seccion].find(x=>x.A===actual);
let txt = it.A.toLowerCase();
let u = new SpeechSynthesisUtterance();
u.lang='es-ES';
if(seccion==='vocalicos'){
// FIX v102: decir ae, ai, ao... todo junto, no separado
const juntos = {'ae':'ae','ai':'ai','ao':'ao','au':'au','ea':'ea','ei':'ei','eo':'eo','eu':'eu','ia':'ia','ie':'ie','io':'io','iu':'iu','oa':'oa','oe':'oe','oi':'oi','ou':'ou','ua':'ua','ue':'ue','ui':'ui','uo':'uo'};
txt = juntos[txt] || txt;
u.text = txt;
u.rate = 1.0; // rapido para que suene junto
u.pitch = 1.0;
} else if(seccion==='directas' || seccion==='inversas' || seccion==='trabadas'){
u.text = txt;
u.rate = 0.7;
u.pitch = 1.1;
} else {
u.text = txt;
u.rate = 0.8;
}
speechSynthesis.speak(u);
}
initTabs();render();mostrar('A');
