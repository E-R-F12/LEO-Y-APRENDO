{f:'La moto corre',e:'🏍️',pal:['La','moto','corre']},{f:'El fuego quema',e:'🔥',pal:['El','fuego','quema']},{f:'Tus ojos brillan',e:'👀',pal:['Tus','ojos','brillan']},{f:'La silla es pequeña',e:'🪑',pal:['La','silla','es','pequeña']}

const FORMACION=[{p:'aire',e:'🪁',sil:['ai','re'],letra:'A'},{p:'barco',e:'⛵',sil:['bar','co'],letra:'B'},{p:'casa',e:'🏠',sil:['ca','sa'],letra:'C'}];
const DATA={letras:LETRAS,directas:DIR,inversas:INVERSAS_DATA,trabadas:TRABADAS_DATA,formacion:FORMACION,frases:FRASES_DATA};
const SECCIONES=[
{id:'letras',label:'🔤 LETRAS'},{id:'directas',label:'➡️ DIRECTAS'},{id:'inversas',label:'🔄 INVERSAS'},{id:'trabadas',label:'🚂 TRABADAS'},{id:'formacion',label:'📝 FORMACIÓN'},{id:'frases',label:'💬 FRASES (60)'}
];
function initTabs(){
  let c=document.getElementById('tabs');c.innerHTML='';
  SECCIONES.forEach(s=>{
    let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;
    if(s.id==='frases') b.classList.add('activo');
    b.onclick=()=>setSeccion(s.id);c.appendChild(b);
  });
}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');render();mostrar(actual);if(fraseActual) mostrarFrase(fraseActual.f);}
function setSeccion(s){
  seccion=s;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');
  document.getElementById('vista-normal').style.display='none';
  document.getElementById('vista-formacion').style.display='none';
  document.getElementById('vista-frases').style.display='none';
  if(s==='formacion'){document.getElementById('vista-formacion').style.display='block';}
  else if(s==='frases'){document.getElementById('vista-frases').style.display='block';renderFrasesList();mostrarFrase(FRASES_DATA[0].f);}
  else{document.getElementById('vista-normal').style.display='block';render();mostrar(DATA[s][0].A);}
}
function render(){let g=document.getElementById('grid');if(!g) return;g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item'+(it.A===actual?' activo':'');let txtClass=tipo==='ligada'?'txt ligada':'txt';d.innerHTML=`<span class="ilust">${it.e}</span><div class="${txtClass}">${fmt(it.A)}</div><div class="pal">${it.p||''}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];if(!it) return;document.getElementById('emoji').textContent=it.e;let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+(tipo==='ligada'?'ligada':'');document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><br><small style="color:#ff8f5a;font-family:'Caveat',cursive;font-size:22px">${it.e} ${it.ej}</small>`;document.getElementById('btnAudio').textContent=`🔊 ${it.ej}`;}
function getVoice(){let vs=speechSynthesis.getVoices();return vs.find(v=>v.lang==='es-ES'&&v.name.toLowerCase().includes('google'))||vs.find(v=>v.lang==='es-ES')||vs[0];}
function hablar(){speechSynthesis.cancel();let it=DATA[seccion].find(x=>x.A===actual)||DATA[seccion][0];let voz=getVoice();let u=new SpeechSynthesisUtterance(it.ej||it.A);u.lang='es-ES';u.rate=0.62;u.voice=voz;speechSynthesis.speak(u);}
function anterior(){let lista=DATA[seccion];let idx=lista.findIndex(x=>x.A===actual);let prev=(idx-1+lista.length)%lista.length;mostrar(lista[prev].A);hablar();}
function siguiente(){let lista=DATA[seccion];let idx=lista.findIndex(x=>x.A===actual);let next=(idx+1)%lista.length;mostrar(lista[next].A);hablar();}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function renderFrasesList(){let g=document.getElementById('gridFrases');g.innerHTML='';FRASES_DATA.forEach(it=>{let d=document.createElement('div');d.className='item'+(fraseActual&&it.f===fraseActual.f?' activo':'');let txtClass=tipo==='ligada'?'txt ligada':'txt';d.innerHTML=`<span class="ilust">${it.e}</span><div class="${txtClass}" style="font-size:10px">${fmt(it.f)}</div>`;d.onclick=()=>mostrarFrase(it.f);g.appendChild(d);});}
function mostrarFrase(f){
  let it=FRASES_DATA.find(x=>x.f===f)||FRASES_DATA[0];fraseActual=it;
  document.getElementById('fraseEmoji').textContent=it.e;
  document.getElementById('fraseTexto').textContent=fmt(it.f);
  document.getElementById('fraseTexto').className=tipo==='ligada'?'letra-big ligada':'letra-big';
  document.getElementById('fraseTexto').style.fontSize='36px';
  document.getElementById('fraseSub').textContent=it.f;
  document.getElementById('fraseCont').textContent=`Frase ${FRASES_DATA.indexOf(it)+1} de ${FRASES_DATA.length}`;
  let pool=document.getElementById('frasePool');pool.innerHTML='';
  shuffle(it.pal).forEach(w=>{
    let d=document.createElement('div');d.className='word';d.textContent=fmt(w);d.dataset.word=w.toLowerCase();d.draggable=true;
    d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';
    d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',w.toLowerCase());});
    pool.appendChild(d);
  });
  let drop=document.getElementById('fraseDrop');drop.innerHTML='';
  it.pal.forEach(w=>{
    let box=document.createElement('div');box.className='drop';box.dataset.expected=w.toLowerCase();box.textContent='?';
    box.addEventListener('dragover',e=>{e.preventDefault();});
    box.addEventListener('drop',e=>{e.preventDefault();let wd=e.dataTransfer.getData('text/plain');if(!wd)return;box.textContent=wd;box.dataset.filled=wd;[...pool.children].find(c=>c.dataset.word===wd)?.remove();});
    box.addEventListener('click',()=>{if(box.dataset.filled){let wd=box.dataset.filled;let d=document.createElement('div');d.className='word';d.textContent=fmt(wd);d.dataset.word=wd;d.draggable=true;d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',wd);});pool.appendChild(d);box.textContent='?';delete box.dataset.filled;}});
    drop.appendChild(box);
  });
  document.getElementById('fraseMsg').textContent='';renderFrasesList();
}
function hablarFrase(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(fraseActual.f);u.lang='es-ES';u.rate=0.45;u.voice=getVoice();speechSynthesis.speak(u);}
function comprobarFrase(){let boxes=[...document.querySelectorAll('#fraseDrop div')];let ok=true;boxes.forEach(b=>{if(b.dataset.filled!==b.dataset.expected) ok=false;});let msg=document.getElementById('fraseMsg');if(ok){msg.textContent='¡Perfecto! 🎉 '+fraseActual.f;msg.style.color='#00b894';hablarFrase();}else{msg.textContent='Sigue intentando 👀';msg.style.color='#e8438a';}}
function fraseNav(dir){let idx=FRASES_DATA.findIndex(x=>x.f===fraseActual.f);let next=(idx+dir+FRASES_DATA.length)%FRASES_DATA.length;mostrarFrase(FRASES_DATA[next].f);hablarFrase();}
function mostrarFormacion(){}
function hablarFormacion(){}
function comprobarFormacion(){}
function siguienteFormacion(){}
function renderFormacionList(){}
initTabs();setSeccion('frases');
</script></body></html>
