let INV=[];['A','E','I','O','U'].forEach(v=>{['N','S','L','R','M','Z','D','J'].forEach(f=>{let sil=v+f;let emoji={N:'👼',S:'⭐',L:'⬆️',R:'🌳',M:'💛',Z:'💙',D:'🎁',J:'🕹️'}[f]||'⬅️';let pal={AN:'ángel',AS:'asta',AL:'alto',AR:'árbol',AM:'amor',AZ:'azul',AD:'edad',AJ:'ajo',EN:'en',ES:'es',EL:'él',ER:'ser',EM:'embudo',EZ:'vez',ED:'red',EJ:'eje',IN:'in',IS:'isla',IL:'hilo',IR:'ir',IM:'imán',IZ:'izquierda',ID:'idea',IJ:'jinete',ON:'con',OS:'oso',OL:'sol',OR:'or',OM:'sombra',OZ:'voz',OD:'red',OJ:'ojo',UN:'un',US:'usted',UL:'pulgar',UR:'sur',UM:'suma',UZ:'luz',UD:'sud',UJ:'lujo'}[sil]||sil.toLowerCase();INV.push({A:sil,e:emoji,p:pal,ej:`${sil.toLowerCase()} como en ${pal}`});});});
// TRABADAS COMPLETAS 60 CON DIBUJO
const TRABADAS=[
{A:'BLA',e:'⬜',p:'blanco',ej:'bla como en blanco'},{A:'BLE',e:'🔵',p:'oble',ej:'ble como en cable'},{A:'BLI',e:'🦋',p:'obligo',ej:'bli como en ombligo'},{A:'BLO',e:'🧱',p:'bloque',ej:'blo como en bloque'},{A:'BLU',e:'👚',p:'blusa',ej:'blu como en blusa'},
{A:'BRA',e:'💪',p:'brazo',ej:'bra como en brazo'},{A:'BRE',e:'⏱️',p:'breve',ej:'bre como en breve'},{A:'BRI',e:'🌬️',p:'brisa',ej:'bri como en brisa'},{A:'BRO',e:'😂',p:'broma',ej:'bro como en broma'},{A:'BRU',e:'🧙‍♀️',p:'bruja',ej:'bru como en bruja'},
{A:'CLA',e:'📚',p:'clase',ej:'cla como en clase'},{A:'CLE',e:'🔑',p:'cle',ej:'cle como en chicle'},{A:'CLI',e:'🌤️',p:'clima',ej:'cli como en clima'},{A:'CLO',e:'🥚',p:'cloro',ej:'clo como en cloro'},{A:'CLU',e:'🎸',p:'club',ej:'clu como en club'},
{A:'CRA',e:'🦀',p:'cangrejo',ej:'cra como en cangrejo'},{A:'CRE',e:'🍦',p:'crema',ej:'cre como en crema'},{A:'CRI',e:'👶',p:'cría',ej:'cri como en cría'},{A:'CRO',e:'🥐',p:'cro',ej:'cro como en cromo'},{A:'CRU',e:'✝️',p:'cruz',ej:'cru como en cruz'},
{A:'DRA',e:'🐉',p:'dragón',ej:'dra como en dragón'},{A:'DRE',e:'🩱',p:'dre',ej:'dre como en madre'},{A:'DRI',e:'🐊',p:'drilo',ej:'dri como en cocodrilo'},{A:'DRO',e:'💊',p:'dro',ej:'dro como en droga'},{A:'DRU',e:'🧙',p:'druida',ej:'dru como en druida'},
{A:'FLA',e:'🍮',p:'flan',ej:'fla como en flan'},{A:'FLE',e:'🏹',p:'flecha',ej:'fle como en flecha'},{A:'FLI',e:'😎',p:'flipa',ej:'fli como en flipar'},{A:'FLO',e:'🌸',p:'flor',ej:'flo como en flor'},{A:'FLU',e:'🦠',p:'flu',ej:'flu como en gripe'},
{A:'FRA',e:'🍓',p:'fresa',ej:'fra como en fresa'},{A:'FRE',e:'🛑',p:'freno',ej:'fre como en freno'},{A:'FRI',e:'🥶',p:'frío',ej:'fri como en frío'},{A:'FRO',e:'🧽',p:'frote',ej:'fro como en frote'},{A:'FRU',e:'🍎',p:'fruta',ej:'fru como en fruta'},
{A:'GLA',e:'❄️',p:'globo',ej:'gla como en globo'},{A:'GLE',e:'🇬🇧',p:'ingle',ej:'gle como en inglés'},{A:'GLI',e:'🧊',p:'iglú',ej:'gli como en iglú'},{A:'GLO',e:'🌍',p:'globo',ej:'glo como en globo'},{A:'GLU',e:'🍭',p:'glu',ej:'glu como en gluten'},
{A:'GRA',e:'🏔️',p:'grande',ej:'gra como en grande'},{A:'GRE',e:'🩸',p:'sangre',ej:'gre como en sangre'},{A:'GRI',e:'⚫',p:'gris',ej:'gri como en gris'},{A:'GRO',e:'👹',p:'ogro',ej:'gro como en ogro'},{A:'GRU',e:'🏗️',p:'grúa',ej:'gru como en grúa'},
{A:'PLA',e:'🍽️',p:'plato',ej:'pla como en plato'},{A:'PLE',e:'💻',p:'simple',ej:'ple como en simple'},{A:'PLI',e:'📄',p:'pliegue',ej:'pli como en pliegue'},{A:'PLO',e:'🪙',p:'plomo',ej:'plo como en plomo'},{A:'PLU',e:'🪶',p:'pluma',ej:'plu como en pluma'},
{A:'PRA',e:'🌿',p:'prado',ej:'pra como en prado'},{A:'PRE',e:'🎁',p:'premio',ej:'pre como en premio'},{A:'PRI',e:'👦',p:'primo',ej:'pri como en primo'},{A:'PRO',e:'👩‍🏫',p:'profe',ej:'pro como en profe'},{A:'PRU',e:'✅',p:'prueba',ej:'pru como en prueba'},
{A:'TRA',e:'🚂',p:'tren',ej:'tra como en tren'},{A:'TRE',e:'1️⃣3️⃣',p:'trece',ej:'tre como en trece'},{A:'TRI',e:'🔺',p:'trigo',ej:'tri como en trigo'},{A:'TRO',e:'👢',p:'tronco',ej:'tro como en tronco'},{A:'TRU',e:'🎃',p:'truco',ej:'tru como en truco'}
];
const DATA={letras:LETRAS,vocalicos:VOC,directas:DIR,inversas:INV,trabadas:TRABADAS};
const SECCIONES=[{id:'letras',label:'🔤 LETRAS'},{id:'vocalicos',label:'👀 VOCÁLICOS'},{id:'directas',label:'➡️ DIRECTAS (110)'},{id:'inversas',label:'⬅️ INVERSAS (40)'},{id:'trabadas',label:'🚂 TRABADAS (60)'}];
function initTabs(){let c=document.getElementById('tabs');SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id==='trabadas')b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});}
function fmt(t){return tipo==='mayuscula'?t.toUpperCase():tipo==='minuscula'?t.toLowerCase():t.toLowerCase();}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');render();mostrar(actual);}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('tab_'+s).classList.add('activo');render();mostrar(DATA[s][0].A);}
function render(){let g=document.getElementById('grid');g.innerHTML='';DATA[seccion].forEach(it=>{let d=document.createElement('div');d.className='item'+(it.A===actual?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt">${fmt(it.A)}</div><div class="pal">${it.p}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod;let it=DATA[seccion].find(x=>x.A===cod)||DATA[seccion][0];document.getElementById('emoji').textContent=it.e;let lg=document.getElementById('letraG');lg.textContent=fmt(it.A);lg.className='letra-big '+tipo;document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><br><small style="font-family:'Nunito',sans-serif;font-size:13px;color:#ff8f5a">${it.e} ${it.ej}</small>`;document.getElementById('btnAudio').textContent=`🔊 ${it.ej}`;}
function hablar(){
  speechSynthesis.cancel();
  let it=DATA[seccion].find(x=>x.A===actual);
  let txt=it.A.toLowerCase().replace('que','ke').replace('qui','ki');
  let voz=speechSynthesis.getVoices().find(v=>v.lang==='es-ES'&&v.name.includes('Google'))||speechSynthesis.getVoices().find(v=>v.lang==='es-ES')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('es'));
  if(seccion==='letras'){let u=new SpeechSynthesisUtterance(it.ej);u.lang='es-ES';u.rate=0.48;if(voz)u.voice=voz;speechSynthesis.speak(u);return;}
  if(seccion==='vocalicos'){let u=new SpeechSynthesisUtterance();u.lang='es-ES';u.volume=1;u.pitch=1.3;if(voz)u.voice=voz;if(txt==='ai'){u.text='a i';u.rate=0.32;}else if(txt==='au'){u.text='a u';u.rate=0.32;}else{u.text=txt;u.rate=0.42;}speechSynthesis.speak(u);setTimeout(()=>{let u2=new SpeechSynthesisUtterance(it.p);u2.lang='es-ES';u2.rate=0.6;if(voz)u2.voice=voz;speechSynthesis.speak(u2);},800);return;}
  if(txt==='ba'){let u1=new SpeechSynthesisUtterance('ba');u1.lang='es-ES';u1.volume=1;u1.rate=0.32;u1.pitch=1.4;if(voz)u1.voice=voz;speechSynthesis.speak(u1);setTimeout(()=>{let u2=new SpeechSynthesisUtterance('barro');u2.lang='es-ES';u2.rate=0.55;if(voz)u2.voice=voz;speechSynthesis.speak(u2);},700);return;}
  if(txt==='be'){let u1=new SpeechSynthesisUtterance('be');u1.lang='es-ES';u1.volume=1;u1.rate=0.32;u1.pitch=1.4;if(voz)u1.voice=voz;speechSynthesis.speak(u1);return;}
  let u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.volume=1;u.rate=0.55;u.pitch=1.2;if(voz)u.voice=voz;speechSynthesis.speak(u);
}
initTabs();render();mostrar('BLA');
