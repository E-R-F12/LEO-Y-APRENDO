</style></head><body><header>VEO - ESCUCHO - LEO Y ESCRIBO</header><div class="tipos"><button class="btn tipo" id="bMayus" onclick="setTipo('mayuscula')">A MAYÚSCULA</button><button class="btn tipo" id="bMinus" onclick="setTipo('minuscula')">a minúscula</button><button class="btn tipo activo" id="bLigada" onclick="setTipo('ligada')" style="font-family:'Dancing Script',cursive">a ligada Rubio</button></div><div class="tabs" id="tabs"></div>

const FIX={BA:'ba',BE:'be',BI:'bi',BO:'bo',BU:'bu',CA:'ca',CE:'ce',CI:'ci',CO:'co',CU:'cu',DA:'da',DE:'de',DI:'di',DO:'do',DU:'du',FA:'fa',FE:'fe',FI:'fi',FO:'fo',FU:'fu',GA:'ga',GE:'je',GI:'ji',GO:'go',GU:'gu',HA:'a',HE:'e',HI:'i',HO:'o',HU:'u',JA:'ja',JE:'je',JI:'ji',JO:'jo',JU:'ju',KA:'ca',KE:'que',KI:'qui',KO:'co',KU:'cu',LA:'la',LE:'le',LI:'li',LO:'lo',LU:'lu',MA:'ma',ME:'me',MI:'mi',MO:'mo',MU:'mu',NA:'na',NE:'ne',NI:'ni',NO:'no',NU:'nu',ÑA:'ña',ÑE:'ñe',ÑI:'ñi',ÑO:'ño',ÑU:'ñu',PA:'pa',PE:'pe',PI:'pi',PO:'po',PU:'pu',QUE:'que',QUI:'qui',RA:'ra',RE:'re',RI:'ri',RO:'ro',RU:'ru',SA:'sa',SE:'se',SI:'si',SO:'so',SU:'su',TA:'ta',TE:'te',TI:'ti',TO:'to',TU:'tu',VA:'va',VE:'ve',VI:'vi',VO:'vo',VU:'vu',WA:'gua',WE:'güe',WI:'gui',WO:'gua',WU:'gu',XA:'sa',XE:'se',XI:'si',XO:'so',XU:'su',YA:'ya',YE:'ye',YI:'yi',YO:'yo',YU:'yu',ZA:'za',ZE:'ze',ZI:'zi',ZO:'zo',ZU:'zu'};
let DIR=[];Object.keys(PAL).forEach(s=>DIR.push({A:s,e:DIBUJOS[s]||'🔤',p:PAL[s],ej:`${s.toLowerCase()} como en ${PAL[s]}`,fon:FIX[s]||s.toLowerCase()}));
const TRABADAS_DATA=[{A:'BLA',e:'🏳️',p:'blanco',ej:'bla como en blanco'},{A:'BRA',e:'💪',p:'brazo',ej:'bra como en brazo'},{A:'CLA',e:'📚',p:'clase',ej:'cla como en clase'},{A:'CRA',e:'💀',p:'cráneo',ej:'cra como en cráneo'},{A:'DRA',e:'🐉',p:'dragón',ej:'dra como en dragón'},{A:'FLA',e:'🍮',p:'flan',ej:'fla como en flan'},{A:'FRA',e:'📝',p:'frase',ej:'fra como en frase'},{A:'GRA',e:'🙏',p:'gracias',ej:'gra como en gracias'},{A:'PLA',e:'🏖️',p:'playa',ej:'pla como en playa'},{A:'PRA',e:'🌿',p:'prado',ej:'pra como en prado'},{A:'TRA',e:'👗',p:'traje',ej:'tra como en traje'},{A:'TRE',e:'🚂',p:'tren',ej:'tre como en tren'}].map(x=>({...x,fon:x.A.toLowerCase()}));
const INVERSAS_DATA=[{A:'AN',e:'⚓',p:'ancla',ej:'an como en ancla'},{A:'AL',e:'🌳',p:'alto',ej:'al como en alto'},{A:'AR',e:'🌳',p:'árbol',ej:'ar como en árbol'}].map(x=>({...x,fon:x.A.toLowerCase()}));
const FRASES_DATA=[{f:'La luna brilla',e:'🌙',pal:['La','luna','brilla']},{f:'El sol sale',e:'☀️',pal:['El','sol','sale']},{f:'El gato bebe leche',e:'🐱',pal:['El','gato','bebe','leche']},{f:'Mi perro corre',e:'🐶',pal:['Mi','perro','corre']},{f:'La casa es bonita',e:'🏠',pal:['La','casa','es','bonita']},{f:'Paco come pan',e:'🍞',pal:['Paco','come','pan']},{f:'Luna toma agua',e:'💧',pal:['Luna','toma','agua']},{f:'Mamá me ama',e:'🤱',pal:['Mamá','me','ama']},{f:'El perro ladra',e:'🐕',pal:['El','perro','ladra']},{f:'Mi bici es roja',e:'🚲',pal:['Mi','bici','es','roja']},{f:'El barco navega',e:'⛵',pal:['El','barco','navega']},{f:'La niña come fresa',e:'🍓',pal:['La','niña','come','fresa']},{f:'El pájaro canta',e:'🐦',pal:['El','pájaro','canta']},{f:'La tortuga camina lento',e:'🐢',pal:['La','tortuga','camina','lento']},{f:'El elefante es grande',e:'🐘',pal:['El','elefante','es','grande']},{f:'Mi casa es grande',e:'🏠',pal:['Mi','casa','es','grande']},{f:'El tren va rápido',e:'🚂',pal:['El','tren','va','rápido']},{f:'La nube es blanca',e:'☁️',pal:['La','nube','es','blanca']},{f:'Mi mano está limpia',e:'✋',pal:['Mi','mano','está','limpia']},{f:'La puerta se abre',e:'🚪',pal:['La','puerta','se','abre']},{f:'El lobo aúlla',e:'🐺',pal:['El','lobo','aúlla']},{f:'Los niños juegan',e:'👦',pal:['Los','niños','juegan']},{f:'Todos reímos juntos',e:'😂',pal:['Todos','reímos','juntos']},{f:'El sol brilla mucho',e:'☀️',pal:['El','sol','brilla','mucho']},{f:'Mi pelota bota',e:'⚽',pal:['Mi','pelota','bota']},{f:'La silla es pequeña',e:'🪑',pal:['La','silla','es','pequeña']}];
const FORMACION=[{p:'barco',e:'⛵',sil:['bar','co'],letra:'B'},{p:'casa',e:'🏠',sil:['ca','sa'],letra:'C'},{p:'luna',e:'🌙',sil:['lu','na'],letra:'L'}];
const DATA={letras:LETRAS,directas:DIR,inversas:INVERSAS_DATA,trabadas:TRABADAS_DATA,formacion:FORMACION,frases:FRASES_DATA};
const SECCIONES=[{id:'letras',label:'🔤 LETRAS'},{id:'directas',label:'➡️ DIRECTAS'},{id:'inversas',label:'🔄 INVERSAS'},{id:'trabadas',label:'🚂 TRABADAS'},{id:'formacion',label:'📝 FORMACIÓN'},{id:'frases',label:'💬 FRASES'}];
function initTabs(){let c=document.getElementById('tabs');c.innerHTML='';SECCIONES.forEach(s=>{let b=document.createElement('button');b.textContent=s.label;b.id='tab_'+s.id;if(s.id===seccion) b.classList.add('activo');b.onclick=()=>setSeccion(s.id);c.appendChild(b);});let f=document.getElementById('filtros');if(f){f.innerHTML='';['TODAS','A','B','C','L','M','P'].forEach(l=>{let btn=document.createElement('button');btn.textContent=l;if(l===filtroLetra)btn.classList.add('activo');btn.style.cssText='border:0;background:#fff0f6;color:#e8438a;border:1px solid #ffbdd7;border-radius:12px;padding:6px 10px;font-weight:900;cursor:pointer';btn.onclick=()=>{filtroLetra=l;renderFormacionList();};f.appendChild(btn);});}}
function fmt(t){if(!t) return ''; if(tipo==='mayuscula') return t.toUpperCase(); if(tipo==='minuscula') return t.toLowerCase(); return t.toLowerCase();}
function fmtFraseCompleta(f){if(tipo==='mayuscula') return f.toUpperCase(); let words=f.split(' '); return words.map((w,i)=>{if(i===0) return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); let low=w.toLowerCase(); if(low==='paco') return 'Paco'; if(low==='luna') return 'Luna'; if(low==='mamá') return 'Mamá'; if(low==='papá') return 'Papá'; return w.toLowerCase();}).join(' ');}
function fmtFrasePalabra(w,esPrimera){if(tipo==='mayuscula') return w.toUpperCase(); if(esPrimera) return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase(); let low=w.toLowerCase(); if(low==='paco') return 'Paco'; if(low==='luna') return 'Luna'; if(low==='mamá') return 'Mamá'; if(low==='papá') return 'Papá'; return w.toLowerCase();}
function claseTipo(){if(tipo==='ligada') return 'ligada'; if(tipo==='mayuscula') return 'mayus'; return 'minus';}
function setTipo(t){tipo=t;document.getElementById('bMayus').classList.toggle('activo',t==='mayuscula');document.getElementById('bMinus').classList.toggle('activo',t==='minuscula');document.getElementById('bLigada').classList.toggle('activo',t==='ligada');if(seccion==='formacion'&&palabraActual) mostrarFormacion(palabraActual.p); else if(seccion==='frases'&&fraseActual) mostrarFrase(fraseActual.f); else {render(); mostrar(actual);} renderFormacionList(); renderFrasesList();}
function setSeccion(s){seccion=s;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('activo'));let tab=document.getElementById('tab_'+s); if(tab) tab.classList.add('activo');document.getElementById('vista-normal').style.display='none';document.getElementById('vista-formacion').style.display='none';document.getElementById('vista-frases').style.display='none';if(s==='formacion'){document.getElementById('vista-formacion').style.display='block';renderFormacionList();mostrarFormacion(FORMACION[0].p);} else if(s==='frases'){document.getElementById('vista-frases').style.display='block';renderFrasesList();mostrarFrase(FRASES_DATA[0].f);} else{document.getElementById('vista-normal').style.display='block';render();mostrar(DATA[s][0].A);}}
function render(){let g=document.getElementById('grid'); if(!g) return; g.innerHTML='';(DATA[seccion]||[]).forEach(it=>{let d=document.createElement('div');d.className='item'+(it.A===actual?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt ${claseTipo()}">${fmt(it.A)}</div><div class="pal">${it.p||''}</div>`;d.onclick=()=>{mostrar(it.A);hablar();};g.appendChild(d);});}
function mostrar(cod){actual=cod; let it=(DATA[seccion]||[]).find(x=>x.A===cod)|| (DATA[seccion]||[])[0]; if(!it) return; document.getElementById('emoji').textContent=it.e; let lg=document.getElementById('letraG'); lg.textContent=fmt(it.A); lg.className='letra-big '+claseTipo(); document.getElementById('textoG').innerHTML=`${fmt(it.A)} - <b>${it.p}</b><br><small style="color:#ff8f5a;font-family:'Caveat',cursive;font-size:22px">${it.e} ${it.ej}</small>`; document.getElementById('btnAudio').textContent=`🔊 ${it.ej}`;}
function getVoice(){let vs=speechSynthesis.getVoices();return vs.find(v=>v.lang==='es-ES'&&v.name.toLowerCase().includes('google'))||vs.find(v=>v.lang==='es-ES')||vs[0];}
function hablar(){speechSynthesis.cancel();let it=(DATA[seccion]||[]).find(x=>x.A===actual)|| (DATA[seccion]||[])[0]; if(!it) return; let u=new SpeechSynthesisUtterance(it.ej||it.A);u.lang='es-ES';u.rate=0.62;u.voice=getVoice();speechSynthesis.speak(u);}
function anterior(){let lista=DATA[seccion];let idx=lista.findIndex(x=>x.A===actual);let prev=(idx-1+lista.length)%lista.length;mostrar(lista[prev].A);hablar();}
function siguiente(){let lista=DATA[seccion];let idx=lista.findIndex(x=>x.A===actual);let next=(idx+1)%lista.length;mostrar(lista[next].A);hablar();}
function shuffle(arr){return [...arr].sort(()=>Math.random()-0.5);}
function renderFormacionList(){let g=document.getElementById('gridForm'); if(!g) return; g.innerHTML=''; FORMACION.filter(x=>filtroLetra==='TODAS'||x.letra===filtroLetra).forEach(it=>{let d=document.createElement('div');d.className='item'+(palabraActual&&it.p===palabraActual.p?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt ${claseTipo()}">${fmt(it.p)}</div><div class="pal">${it.sil.join('-')}</div>`;d.onclick=()=>mostrarFormacion(it.p);g.appendChild(d);});}
function mostrarFormacion(p){let it=FORMACION.find(x=>x.p===p)||FORMACION[0];palabraActual=it;document.getElementById('formEmoji').textContent=it.e;let fp=document.getElementById('formPalabra');fp.textContent=fmt(it.p);fp.className='letra-big '+claseTipo();fp.style.fontSize='70px';document.getElementById('formSub').textContent=it.sil.map(s=>fmt(s)).join(' - ');let pool=document.getElementById('pool');pool.innerHTML='';shuffle(it.sil).forEach(s=>{let d=document.createElement('div');d.draggable=true;d.textContent=fmt(s);d.dataset.sil=s.toLowerCase();d.style.cssText=`background:#fff;border:2px solid #e8438a;color:#e8438a;padding:12px 16px;border-radius:14px;font-weight:900;font-size:22px;cursor:grab;font-family:${tipo==='ligada'?'Dancing Script, cursive':'Nunito'}`;d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',s.toLowerCase());});pool.appendChild(d);});let zone=document.getElementById('dropZone');zone.innerHTML='';it.sil.forEach(s=>{let box=document.createElement('div');box.dataset.expected=s.toLowerCase();box.textContent='?';box.style.cssText='width:100px;height:70px;border:3px dashed #ffbdd7;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#6c5ce7;background:#fff';box.addEventListener('dragover',e=>{e.preventDefault();});box.addEventListener('drop',e=>{e.preventDefault();let sil=e.dataTransfer.getData('text/plain');if(!sil)return;box.textContent=fmt(sil);box.dataset.filled=sil;box.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';[...pool.children].find(c=>c.dataset.sil===sil)?.remove();});box.addEventListener('click',()=>{if(box.dataset.filled){let sil=box.dataset.filled;let d=document.createElement('div');d.textContent=fmt(sil);d.dataset.sil=sil;d.draggable=true;d.style.cssText=`background:#fff;border:2px solid #e8438a;color:#e8438a;padding:12px 16px;border-radius:14px;font-weight:900;font-size:22px;cursor:grab;font-family:${tipo==='ligada'?'Dancing Script, cursive':'Nunito'}`;d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',sil);});pool.appendChild(d);box.textContent='?';delete box.dataset.filled;}});zone.appendChild(box);});document.getElementById('formMsg').textContent='';}
function hablarFormacion(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(palabraActual.p);u.lang='es-ES';u.rate=0.5;u.voice=getVoice();speechSynthesis.speak(u);}
function comprobarFormacion(){let boxes=[...document.querySelectorAll('#dropZone div')];let ok=true;boxes.forEach(b=>{if(b.dataset.filled!==b.dataset.expected)ok=false;});let msg=document.getElementById('formMsg');if(ok){msg.textContent='¡Perfecto! 🎉 '+fmt(palabraActual.p);msg.style.color='#00b894';hablarFormacion();}else{msg.textContent='Sigue intentando 👀';msg.style.color='#e8438a';}}
function siguienteFormacion(dir=1){let list=FORMACION.filter(x=>filtroLetra==='TODAS'||x.letra===filtroLetra);let idx=list.findIndex(x=>x.p===palabraActual.p);let next=(idx+dir+list.length)%list.length;mostrarFormacion(list[next].p);hablarFormacion();}
function renderFrasesList(){let g=document.getElementById('gridFrases'); if(!g) return; g.innerHTML=''; FRASES_DATA.forEach(it=>{let d=document.createElement('div');d.className='item'+(fraseActual&&it.f===fraseActual.f?' activo':'');d.innerHTML=`<span class="ilust">${it.e}</span><div class="txt ${claseTipo()}" style="font-size:10px">${fmtFraseCompleta(it.f)}</div>`;d.onclick=()=>mostrarFrase(it.f);g.appendChild(d);});}
function mostrarFrase(f){let it=FRASES_DATA.find(x=>x.f===f)||FRASES_DATA[0];fraseActual=it;document.getElementById('fraseEmoji').textContent=it.e;let textoOrto=fmtFraseCompleta(it.f);let elTexto=document.getElementById('fraseTexto');elTexto.textContent=textoOrto;elTexto.className='letra-big '+claseTipo();elTexto.style.fontSize='34px';document.getElementById('fraseSub').textContent=it.f;document.getElementById('fraseCont').textContent=`Frase ${FRASES_DATA.indexOf(it)+1} de ${FRASES_DATA.length}`;let pool=document.getElementById('frasePool');pool.innerHTML='';shuffle(it.pal).forEach((w,i)=>{let esPrimera=it.pal.indexOf(w)===0;let display=fmtFrasePalabra(w,esPrimera);let d=document.createElement('div');d.className='word';d.textContent=display;d.dataset.word=w.toLowerCase();d.draggable=true;d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',w.toLowerCase());});pool.appendChild(d);});let drop=document.getElementById('fraseDrop');drop.innerHTML='';it.pal.forEach((w,idx)=>{let box=document.createElement('div');box.className='drop';box.dataset.expected=w.toLowerCase();box.textContent='?';box.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';box.addEventListener('dragover',e=>{e.preventDefault();});box.addEventListener('drop',e=>{e.preventDefault();let wd=e.dataTransfer.getData('text/plain');if(!wd)return;let original=it.pal.find(p=>p.toLowerCase()===wd)||wd; let disp=fmtFrasePalabra(original, idx===0); box.textContent=disp; box.dataset.filled=wd; [...pool.children].find(c=>c.dataset.word===wd)?.remove();});box.addEventListener('click',()=>{if(box.dataset.filled){let wd=box.dataset.filled;let original=it.pal.find(p=>p.toLowerCase()===wd)||wd; let disp=fmtFrasePalabra(original, idx===0); let d=document.createElement('div');d.className='word';d.textContent=disp;d.dataset.word=wd;d.draggable=true;d.style.fontFamily=tipo==='ligada'?'Dancing Script, cursive':'Nunito';d.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',wd);});pool.appendChild(d);box.textContent='?';delete box.dataset.filled;}});drop.appendChild(box);});document.getElementById('fraseMsg').textContent='';}
function hablarFrase(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(fraseActual.f);u.lang='es-ES';u.rate=0.45;u.voice=getVoice();speechSynthesis.speak(u);}
function comprobarFrase(){let boxes=[...document.querySelectorAll('#fraseDrop div')];let ok=true;boxes.forEach(b=>{if(b.dataset.filled!==b.dataset.expected) ok=false;});let msg=document.getElementById('fraseMsg');if(ok){msg.textContent='¡Perfecto! 🎉 '+fmtFraseCompleta(fraseActual.f);msg.style.color='#00b894';hablarFrase();}else{msg.textContent='Sigue intentando 👀';msg.style.color='#e8438a';}}
function fraseNav(dir){let idx=FRASES_DATA.findIndex(x=>x.f===fraseActual.f);let next=(idx+dir+FRASES_DATA.length)%FRASES_DATA.length;mostrarFrase(FRASES_DATA[next].f);hablarFrase();}
initTabs();setSeccion('frases');
</script></body></html>
