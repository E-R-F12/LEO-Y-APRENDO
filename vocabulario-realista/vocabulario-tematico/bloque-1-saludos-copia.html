<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 1 - Saludos | LEO Y APRENDO</title>
<style>
  body{font-family:Arial,sans-serif;background:#FFF8E1;margin:0;padding:20px;text-align:center}
  h1{color:#E65100}
  .volver{display:inline-block;background:#FF9800;color:white;padding:12px 20px;border-radius:20px;text-decoration:none;font-weight:bold;margin-bottom:15px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;max-width:950px;margin:0 auto}
  .card{background:white;border-radius:20px;padding:12px;box-shadow:0 4px 10px rgba(0,0,0,0.1)}
  .card img{width:100%;height:120px;object-fit:contain;border-radius:14px;background:#f5f5f5}
  .pp{font-size:1.35em;font-weight:bold;margin:10px 0 2px;color:#333}
  .fr{font-size:1.15em;color:#1565C0;font-style:italic;margin:0 0 10px}
  .btns{display:flex;gap:6px;justify-content:center}
  button{border:none;padding:9px 10px;border-radius:20px;font-size:0.95em;cursor:pointer;color:white}
  .es{background:#4CAF50}
  .frb{background:#1E88E5}
</style>
</head>
<body>

<a class="volver" href="../index.html">⬅ Volver</a>
<h1>👋 Bloque 1 - Saludos</h1>
<p>Español + Français - Pulsa para escuchar</p>
<p><button class="es" onclick="juegoEscucha()">🎧 Juego: Escucha y adivina</button></p>

<div class="grid" id="grid"></div>

<script>
function hablar(texto, idioma){
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = idioma || 'es-ES';
  u.rate = 0.85;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

// --- PALABRAS ---
const palabras=[
{id:'hola', nombre:'¡Hola!', frances:'Bonjour !', alts:['https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400','https://cdn.pixabay.com/photo/2017/09/25/13/12/cocker-spaniel-2785074_640.jpg']},
{id:'buenos-dias', nombre:'Buenos días', frances:'Bonjour', alts:['https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=400']},
{id:'buenas-tardes', nombre:'Buenas tardes', frances:'Bon après-midi', alts:['https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=400']},
{id:'buenas-noches', nombre:'Buenas noches', frances:'Bonne nuit', alts:['https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400']},
{id:'adios', nombre:'Adiós', frances:'Au revoir', alts:['https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=400']},
{id:'hasta-luego', nombre:'Hasta luego', frances:'À plus tard', alts:['https://images.unsplash.com/photo-1517842645767-c639042777db?w=400']},
{id:'como-estas', nombre:'¿Cómo estás?', frances:'Comment vas-tu ?', alts:['https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=400']},
{id:'muy-bien', nombre:'Muy bien', frances:'Très bien', alts:['https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400']},
{id:'gracias', nombre:'Gracias', frances:'Merci', alts:['https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=400']},
{id:'por-favor', nombre:'Por favor', frances:"S'il te plaît", alts:['https://images.unsplash.com/photo-1521791136064-7986c2920216?w=400']},
{id:'perdon', nombre:'Perdón', frances:'Pardon', alts:['https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=400']},
{id:'de-nada', nombre:'De nada', frances:'De rien', alts:['https://images.unsplash.com/photo-1552058544-f2b08422138a?w=400']},
{id:'encantado', nombre:'¡Encantado!', frances:'Enchanté !', alts:['https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400']}
];

function crearImg(p){
  const img=document.createElement('img');
  const intentos=(p.alts||[]).slice();
  let idx=0;
  img.src=intentos[0];
  img.onerror=()=>{ idx++; if(idx<intentos.length){img.src=intentos[idx];} else {img.style.display='none';} };
  return img;
}

const grid=document.getElementById('grid');
palabras.forEach(p=>{
  const card=document.createElement('div'); card.className='card';
  const img=crearImg(p);
  const pp=document.createElement('p'); pp.className='pp'; pp.textContent=p.nombre;
  const pf=document.createElement('p'); pf.className='fr'; pf.textContent=p.frances;
  const divBtn=document.createElement('div'); divBtn.className='btns';
  const btn=document.createElement('button'); btn.className='es'; btn.textContent='🔊 Español'; btn.onclick=()=>hablar(p.nombre,'es-ES');
  const btnFr=document.createElement('button'); btnFr.className='frb'; btnFr.textContent='🇫🇷 Français'; btnFr.onclick=()=>hablar(p.frances,'fr-FR');
  divBtn.appendChild(btn); divBtn.appendChild(btnFr);
  card.appendChild(img); card.appendChild(pp); card.appendChild(pf); card.appendChild(divBtn);
  grid.appendChild(card);
});

let actual=null;
function juegoEscucha(){
  hablar(palabras[Math.floor(Math.random()*palabras.length)].nombre,'es-ES');
}
</script>
<style>
.fr{font-size:1.1em;color:#1565C0;font-style:italic;margin:2px 0 8px}
.btn-fr{background:#1E88E5!important;color:white!important}
</style>
<script>
const trad={
"HOLA":"Salut !!! TEST",
"ADIÓS":"Au revoir",
"BUENOS DÍAS":"Bonjour",
"BUENAS TARDES":"Bon après-midi",
"BUENAS NOCHES":"Bonne nuit",
"POR FAVOR":"S'il te plaît",
"GRACIAS":"Merci",
"DE NADA":"De rien",
"PERDÓN":"Pardon",
"LO SIENTO":"Je suis désolé",
"¿CÓMO ESTÁS?":"Comment vas-tu ?",
"MUY BIEN":"Très bien",
"HASTA LUEGO":"À plus tard",
"HASTA MAÑANA":"À demain",
"BIENVENIDO":"Bienvenue",
"ENCANTADO":"Enchanté !"
};
document.querySelectorAll('.card').forEach(card=>{
  const titulo=card.querySelector('.pp');
  if(!titulo) return;
  const esp=titulo.textContent.trim().toUpperCase().replace(/[¡!¿?]/g,'').trim();
  const fr=trad[esp];
  if(!fr) return;
  if(card.querySelector('.fr')) return;
  const p=document.createElement('p');
  p.className='fr'; p.textContent=fr;
  titulo.after(p);
  const btnEs=card.querySelector('button');
  if(btnEs){
    const btnFr=document.createElement('button');
    btnFr.className='btn-fr';
    btnFr.textContent='🇫🇷 Français';
    btnFr.onclick=()=>{const u=new SpeechSynthesisUtterance(fr);u.lang='fr-FR';u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u);};
    btnEs.after(btnFr);
  }
});
</script></body>
</html>
