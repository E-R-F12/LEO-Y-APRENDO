<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 3 - Comida</title>
<style>
body{font-family:Segoe UI,Arial;background:#fef9f2;padding:15px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1100px;margin:20px auto}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;padding:15px 10px 10px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:120px;height:120px;object-fit:contain;background:#e6f0ff;border-radius:50%;padding:10px;display:block;margin:0 auto 8px}
.palabra{font-weight:bold;text-transform:uppercase;font-size:14px}
.audio{position:absolute;top:8px;right:8px;background:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.juegos{max-width:900px;margin:50px auto;text-align:center;background:#fff;padding:25px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.juegos button{margin:8px;padding:12px 20px;border-radius:12px;border:none;background:#d35400;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<h1 style="text-align:center;color:#d35400">🍎 BLOQUE 3 - COMIDA</h1>
<p style="text-align:center"><a href="../../index.html">← Volver</a></p>
<p id="contador" style="text-align:center;color:gray">Cargando...</p>
<div class="grid" id="grid"></div>

<div class="juegos">
<h2>🎮 Juegos finales</h2>
<p>¡A jugar con la comida!</p>
<button onclick="location.reload()">🔄 Mezclar</button>
<button onclick="repasar()">🔊 Repasar todo</button>
<button onclick="window.scrollTo({top:0,behavior:'smooth'})">⬆️ Volver arriba</button>
</div>

<script>
const RAW="https://raw.githubusercontent.com/e-r-f12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/bloque-3-comida/";
const API="https://api.github.com/repos/e-r-f12/LEO-Y-APRENDO/contents/vocabulario-realista/imagenes/bloque-3-comida";
function hablar(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
function repasar(){let palabras=[...document.querySelectorAll('.palabra')].map(p=>p.textContent.replace('🔊','').trim());let i=0;function siguiente(){if(i<palabras.length){hablar(palabras[i]);i++;setTimeout(siguiente,1500)}}siguiente();}
fetch(API).then(r=>r.json()).then(files=>{
  let lista=files.filter(f=>f.type==='file' && /\.(jpe?g|png|webp)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('contador').textContent=`¡Perfecto! ${lista.length} fotos encontradas`;
  const grid=document.getElementById('grid');
  lista.forEach(f=>{
    let file=f.name;
    let texto=file.replace(/\.[^/.]+$/,'').replace(/[-_]/g,' ');
    let div=document.createElement('div');div.className='card';
    div.innerHTML=`<div class="audio">🔊</div><img src="${RAW+encodeURI(file)}" loading="lazy"><div class="palabra">${texto}</div>`;
    div.onclick=()=>hablar(texto);
    grid.appendChild(div);
  });
});
</script>
</body>
</html>
