<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOQUE 3 - LA COMIDA (30) - Fotos reales + Audios</title>
<style>
body{background:#FFFEF5;margin:0;padding:15px;font-family:Arial,sans-serif}
.barra{background:#e65100;color:white;text-align:center;padding:10px;border-radius:8px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:180px;object-fit:contain;background:#fff3e0;display:block}
.num{font-weight:bold;font-size:13px;margin:8px 0;text-transform:uppercase}
.audio-row{display:flex;justify-content:center;gap:6px;padding:5px}
.btn-audio{background:#e65100;color:white;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer}
.back{color:#e65100;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<a class="back" href="../../index.html">← Volver</a>
