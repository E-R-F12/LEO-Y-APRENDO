<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 3 - Comida</title>
<style>
body{font-family:Segoe UI,Arial;background:#fff8f0;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1100px;margin:20px auto}
.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;padding-bottom:10px;overflow:hidden;cursor:pointer;position:relative}
.card img{width:100%;height:140px;object-fit:contain;padding:10px;background:#eef6ff;border-radius:50%;margin:10px auto;display:block;width:120px;height:120px}
.palabra{font-weight:bold;text-transform:uppercase;margin-top:5px}
.audio{font-size:18px;margin-left:5px}
.juegos{max-width:800px;margin:40px auto;text-align:center;background:#fff;padding:20px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.juegos button{margin:8px;padding:12px 18px;border-radius:10px;border:none;background:#ff8c42;color:#fff;font-weight:bold;cursor:pointer;font-size:16px}
</style>
</head>
<body>
<h1 style="text-align:center;color:#d35400">🍎 BLOQUE 3 - COMIDA</h1>
<p style="text-align:center"><a href="../../index.html">← Volver</a></p>
<p id="contador" style="text-align:center;color:gray">Cargando...</p>
<div class="grid" id="grid"></div>

<div class="juegos">
<h2>🎮 Juegos finales</h2>
<p>Practica lo aprendido</p>
<button onclick="location.reload()">🔄 Mezclar tarjetas</button>
<button onclick="hablar('Vamos a repasar la comida')">🔊 Repasar todo</button>
</div>

<script>
const RAW="https://raw.githubusercontent.com/e-r-f12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/bloque-3-comida/";
const API="https://api.github.com/repos/e-r-f12/LEO-Y-APRENDO/contents/vocabulario-realista/imagenes/bloque-3-comida";
function hablar(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
fetch(API).then(r=>r.json()).then(files=>{
  let lista=files.filter(f=>f.type==='file' && /\.(jpe?g|png|webp)$/i.test(f.name)).sort((a,b)=>a.name.localeCompare(b.name));
  document.getElementById('contador').textContent=`¡Perfecto! ${lista.length} fotos encontradas`;
  const grid=document.getElementById('grid');
  lista.forEach(f=>{
    let file=f.name;
    let texto=file.replace(/\.[^/.]+$/,'').replace(/[-_]/g,' ');
    let div=document.createElement('div');div.className='card';
    div.innerHTML=`<img src="${RAW+encodeURI(file)}" loading="lazy" onerror="this.style.display='none'"><div class="palabra">${texto} <span class="audio">🔊</span></div>`;
    div.onclick=()=>hablar(texto);
    grid.appendChild(div);
  });
}).catch(()=>{document.getElementById('contador').textContent='Error cargando, recarga con Ctrl+F5';});
</script>
</body>
</html>
