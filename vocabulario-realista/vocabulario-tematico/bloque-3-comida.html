<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 3 - Comida</title>
<style>body{font-family:Segoe UI,Arial;background:#fff8f0;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1100px;margin:20px auto}.card{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center;padding-bottom:10px;overflow:hidden;cursor:pointer}.card img{width:100%;height:140px;object-fit:contain;padding:10px}.palabra{font-weight:bold;text-transform:uppercase}</style>
</head>
<body>
<h1 style="text-align:center;color:#d35400">🍎 BLOQUE 3 - COMIDA</h1>
<p style="text-align:center"><a href="../../index.html">← Volver</a></p>
<p id="contador" style="text-align:center;color:gray">Cargando...</p>
<div class="grid" id="grid"></div>
<script>
const RAW="https://raw.githubusercontent.com/e-r-f12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/bloque-3-comida/";
const API="https://api.github.com/repos/e-r-f12/LEO-Y-APRENDO/contents/vocabulario-realista/imagenes/bloque-3-comida";
function hablar(t){const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
fetch(API).then(r=>r.json()).then(files=>{
  let lista=files.filter(f=>f.type==='file' && /\.(jpe?g|png|webp)$/i.test(f.name));
  document.getElementById('contador').textContent=`¡Perfecto! ${lista.length} fotos encontradas`;
  const grid=document.getElementById('grid');
  lista.forEach(f=>{
    let file=f.name;
    let texto=file.replace(/\.[^/.]+$/,'').replace(/[-_]/g,' ');
    let div=document.createElement('div');div.className='card';
    div.onclick=()=>hablar(texto);
    div.innerHTML=`<img src="${RAW+encodeURI(file)}" loading="lazy"><div class="palabra">${texto}</div>`;
    grid.appendChild(div);
  });
});
</script>
</body>
</html>
