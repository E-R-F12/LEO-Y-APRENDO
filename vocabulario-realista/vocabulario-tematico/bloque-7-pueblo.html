<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 7 - El Pueblo Real</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#fef3c7}
header{background:#d97706;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0}
.wrap{max-width:1050px;margin:auto;padding:16px}
a.volver{color:#d97706;font-weight:900;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.12);border:2px solid #fde68a;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#d97706}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:12px;text-align:center}
.info b{font-size:18px;display:block}
.info span{font-size:11px;color:#d97706;font-weight:900}
.btn{border:0;background:#d97706;color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>🏘️ Bloque 7 - El Pueblo - Fotos reales de Marruecos</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver</a>
<div class="grid" id="grid"></div>
</div>
<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
const data=[
{es:"El mercado",desc:"Zoco con especias de colores y frutos secos",img:"https://images.unsplash.com/photo-1518684079-3c830dcef090?w=500"},
{es:"La mezquita",desc:"Lugar de oración con minarete",img:"https://images.unsplash.com/photo-1591604466107-ec97de577aff?w=500"},
{es:"La tienda",desc:"Tendero del barrio con pan y huevos",img:"https://images.unsplash.com/photo-1608198093002-ad4e005484ec?w=500"},
{es:"La calle",desc:"Calle con puertas azules y verdes",img:"https://images.unsplash.com/photo-1539650116574-75c0c6d73f6e?w=500"},
{es:"El parque",desc:"Parque con olivos, palmeras y columpios",img:"https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=500"},
{es:"La farmacia",desc:"Cruz verde, medicinas y salud",img:"https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=500"},
{es:"El hospital",desc:"Hospital con ambulancia",img:"https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=500"},
{es:"La panadería",desc:"Pan recién horneado khobz",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500"},
{es:"El colegio",desc:"Escuela grande con niños",img:"https://images.unsplash.com/photo-1588075592446-265fd1e4e76f?w=500"},
{es:"La plaza",desc:"Plaza con fuente y gente",img:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=500"},
];
const g=document.getElementById('grid');
data.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<img src="${d.img}"><div class="info"><b>${d.es}</b><span>${d.desc}</span><br><button class="btn">🔊 ${d.es}</button></div>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
</script>
</body>
</html>
