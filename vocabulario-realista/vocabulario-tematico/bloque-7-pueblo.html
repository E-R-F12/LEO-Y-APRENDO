<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 7 - Pueblo (30)</title>
<style>
body{font-family:Arial,sans-serif;background:#e8f8ee;margin:0;padding:10px}
h1{text-align:center;color:#1b5e20;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:8px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.card img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.card p{margin:6px 0 4px;font-weight:bold;text-transform:uppercase;font-size:13px}
.card button{background:#1976d2;color:#fff;border:none;border-radius:20px;padding:5px 14px;cursor:pointer}
.seccion{max-width:1100px;margin:30px auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.seccion h2{color:#2e7d32;margin-top:0}
.btn-juego{background:#2e7d32;color:#fff;border:none;padding:10px 18px;border-radius:8px;margin:5px;cursor:pointer;font-size:15px}
.opcion{display:inline-block;margin:6px;padding:8px 12px;background:#f1f8e9;border-radius:8px;cursor:pointer;border:2px solid transparent}
.opcion.correcta{border-color:#2e7d32;background:#c8e6c9}
.opcion.incorrecta{border-color:#c62828;background:#ffcdd2}
#juego-area{text-align:center;min-height:120px}
</style>
</head>
<body>

<h1>🏘️ BLOQUE 7 - PUEBLO (30)</h1>

<div class="grid" id="vocab-grid"></div>

<div class="seccion">
<h2>🎧 Juego 1: Escucha y elige</h2>
<p>Pulsa play y elige la imagen correcta</p>
<div id="juego-area"></div>
<button class="btn-juego" onclick="nuevoJuegoEscucha()">▶️ Nuevo audio</button>
</div>

<div class="seccion">
<h2>🧠 Juego 2: ¿Qué palabra es?</h2>
<div id="juego-test"></div>
<button class="btn-juego" onclick="nuevoTest()">Siguiente pregunta ➡️</button>
</div>

<script>
const palabras = [
{id:'autobus',nombre:'autobús'},{id:'ayuntamiento',nombre:'ayuntamiento'},{id:'banco',nombre:'banco'},{id:'bicicleta',nombre:'bicicleta'},{id:'buzon',nombre:'buzón'},{id:'camino',nombre:'camino'},{id:'campo',nombre:'campo'},{id:'casa',nombre:'casa'},{id:'castillo',nombre:'castillo'},{id:'coche',nombre:'coche'},{id:'cosechadora',nombre:'cosechadora'},{id:'escuela',nombre:'escuela'},{id:'farmacia',nombre:'farmacia'},{id:'farola',nombre:'farola'},{id:'fuente',nombre:'fuente'},{id:'granja',nombre:'granja'},{id:'iglesia',nombre:'iglesia'},{id:'jardin',nombre:'jardín'},{id:'mercado',nombre:'mercado'},{id:'montana',nombre:'montaña'},{id:'panaderia',nombre:'panadería'},{id:'papelera',nombre:'papelera'},{id:'parque',nombre:'parque'},{id:'paso-de-cebra',nombre:'paso de cebra'},{id:'plaza',nombre:'plaza'},{id:'puente',nombre:'puente'},{id:'rio',nombre:'río'},{id:'semaforo',nombre:'semáforo'},{id:'tienda',nombre:'tienda'},{id:'tractor',nombre:'tractor'}
];

function hablar(texto){
  const u = new SpeechSynthesisUtterance(texto);
  u.lang='es-ES'; u.rate=0.9;
  speechSynthesis.speak(u);
}

function imgPath(id){
  // prueba con y sin ñ, GitHub a veces guarda con ñ
  return `../imagenes/bloque-7-pueblo/${id}.jpg`;
}

// Render vocabulario
const grid=document.getElementById('vocab-grid');
palabras.forEach(p=>{
  grid.innerHTML+=`<div class="card">
    <img src="${imgPath(p.id)}" onerror="this.src='../imagenes/bloque-7-pueblo/${p.id}.jpeg';this.onerror=null" alt="${p.nombre}">
    <p>${p.nombre}</p>
    <button onclick="hablar('${p.nombre}')">🔊</button>
  </div>`;
});

let actual=null;
function nuevoJuegoEscucha(){
  actual=palabras[Math.floor(Math.random()*palabras.length)];
  hablar(actual.nombre);
  const area=document.getElementById('juego-area');
  let mezcladas=[...palabras].sort(()=>0.5-Math.random()).slice(0,5);
  if(!mezcladas.find(x=>x.id===actual.id)){mezcladas[0]=actual;mezcladas.sort(()=>0.5-Math.random())}
  area.innerHTML=`<p><b>¿Qué has escuchado?</b> <button onclick="hablar('${actual.nombre}')">🔊 Repetir</button></p>`+
  mezcladas.map(o=>`<div class="opcion" onclick="checkEscucha(this,'${o.id}')"><img src="${imgPath(o.id)}" style="width:80px;height:60px;object-fit:cover;border-radius:6px;display:block;margin:0 auto"><small>${o.nombre}</small></div>`).join('');
}
function checkEscucha(el,id){
  if(id===actual.id){el.classList.add('correcta');hablar('¡Muy bien! '+actual.nombre);setTimeout(nuevoJuegoEscucha,1200)}
  else{el.classList.add('incorrecta');}
}

function nuevoTest(){
  const correcta=palabras[Math.floor(Math.random()*palabras.length)];
  const area=document.getElementById('juego-test');
  let opciones=[...palabras].sort(()=>0.5-Math.random()).slice(0,4);
  if(!opciones.find(x=>x.id===correcta.id)){opciones[0]=correcta;opciones.sort(()=>0.5-Math.random())}
  area.innerHTML=`<p>¿Cómo se dice esta imagen? 🔊 <button onclick="hablar('${correcta.nombre}')">Escuchar</button></p>
  <img src="${imgPath(correcta.id)}" style="width:180px;height:120px;object-fit:cover;border-radius:10px"><br><br>`+
  opciones.map(o=>`<div class="opcion" onclick="checkTest(this,'${o.id}','${correcta.id}','${correcta.nombre}')">${o.nombre}</div>`).join('');
}
function checkTest(el,id,correctId,nombre){
  if(id===correctId){el.classList.add('correcta');hablar('Correcto');}else{el.classList.add('incorrecta');hablar(nombre)}
}
nuevoJuegoEscucha();nuevoTest();
</script>
</body>
</html>
