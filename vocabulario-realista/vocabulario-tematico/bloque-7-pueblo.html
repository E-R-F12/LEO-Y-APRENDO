<script>
let desbloqueado=false;
function desblo(){if(desbloqueado)return;desbloqueado=true;speechSynthesis.resume();let v=new SpeechSynthesisUtterance('');v.volume=0;speechSynthesis.speak(v);}
function hablar(t){desblo();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
document.addEventListener('click',desblo,{once:true});document.addEventListener('touchstart',desblo,{once:true});
</script>
