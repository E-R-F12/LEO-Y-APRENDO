<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 6 - Mi Árbol Genealógico - LEO Y APRENDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#fffdf7;color:#1e293b;padding:8px}
a.volver{display:inline-block;margin:8px 0 10px 8px;text-decoration:none;background:white;padding:10px 18px;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.08);color:#ea580c;font-weight:bold;font-size:1.1rem}
h1{text-align:center;font-size:2.4rem}
p.sub{text-align:center;color:#64748b;margin:8px 0 12px;font-size:1.15rem}
.contenedor{max-width:1200px;margin:0 auto}
.tarjeta{background:white;border:4px solid #fde68a;border-radius:24px;padding:10px 10px 16px;margin:16px 0;box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer;text-align:center}
.tarjeta.seleccionado{border:6px solid red}
.tarjeta img{width:100%;max-width:1150px;height:auto;border-radius:16px;display:block;margin:0 auto;background:white}
.tarjeta b{display:inline-block;margin-top:14px;font-size:1.8rem;background:#fde68a;padding:8px 32px;border-radius:20px}
.tarjeta.seleccionado b{background:red;color:white}
.tarjeta small{display:block;color:#64748b;margin:8px 0 12px;font-size:1.15rem}
.btn-escuchar{background:#ea580c;color:white;border:none;padding:14px 36px;border-radius:24px;cursor:pointer;font-weight:bold;font-size:1.2rem}
.btn-grande{display:block;margin:20px auto;background:#ea580c;color:white;border:none;padding:16px 32px;border-radius:24px;font-weight:bold;cursor:pointer;font-size:1.3rem}
</style>
</head>
<body>
<a class="volver" href="index.html">Volver</a>
<h1>MI ÁRBOL GENEALÓGICO</h1>
<p class="sub">Pulsa en cada imagen para marcarla en rojo. Pulsa en Escuchar para oír el nombre.</p>
<div class="contenedor">

<div class="tarjeta" onclick="seleccionar(this,'Abuelo')"><img src="../imagenes/bloque-6-familia/abuelo.jpg"><b>ABUELO</b><small>El papá de Papá</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Abuelo')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Abuela')"><img src="../imagenes/bloque-6-familia/abuela.jpg"><b>ABUELA</b><small>La mamá de Papá</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Abuela')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Papá')"><img src="../imagenes/bloque-6-familia/papa.jpg"><b>PAPÁ</b><small>Mi padre</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Papá')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Mamá')"><img src="../imagenes/bloque-6-familia/mama.jpg"><b>MAMÁ</b><small>Mi madre</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Mamá')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Tío')"><img src="../imagenes/bloque-6-familia/tio.jpg"><b>TÍO</b><small>Hermano de Papá</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Tío')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Tía')"><img src="../imagenes/bloque-6-familia/tia.jpg"><b>TÍA</b><small>Hermana de Papá</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Tía')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Hijo')"><img src="../imagenes/bloque-6-familia/hijo.jpg"><b>HIJO</b><small>Mi hijo</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Hijo')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Hija')"><img src="../imagenes/bloque-6-familia/hija.jpg"><b>HIJA</b><small>Mi hija</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Hija')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Bebé')"><img src="../imagenes/bloque-6-familia/bebe.jpg"><b>BEBÉ</b><small>El bebé</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Bebé')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Primo')"><img src="../imagenes/bloque-6-familia/primo.jpg"><b>PRIMO</b><small>Hijo de mi tío</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Primo')">Escuchar</button></div>

<div class="tarjeta" onclick="seleccionar(this,'Prima')"><img src="../imagenes/bloque-6-familia/prima.jpg"><b>PRIMA</b><small>Hija de mi tía</small><button class="btn-escuchar" onclick="event.stopPropagation();hablar('Prima')">Escuchar</button></div>

<button class="btn-grande" onclick="hablar('Este es mi árbol genealógico. Abuelo, abuela, papá, mamá, tío, tía, hijo, hija, bebé, primo y prima.')">Escuchar todo el árbol</button>
</div>
<script>
function hablar(t){ try{ speechSynthesis.cancel(); let u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=0.9; speechSynthesis.speak(u);}catch(e){} }
function seleccionar(el,nombre){ document.querySelectorAll('.tarjeta').forEach(n=>n.classList.remove('seleccionado')); el.classList.add('seleccionado'); el.scrollIntoView({behavior:'smooth',block:'center'}); hablar(nombre); }
</script>
</body>
</html>
