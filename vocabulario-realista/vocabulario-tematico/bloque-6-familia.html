<div class="card"><img src="../imagenes/bloque-6-familia/mama.jpg"><div class="label">7. MAMA</div><div class="audio-box"><button onclick="hablar('mamá')">🔊</button></div></div>

<script>
let desbloqueado=false;
function desbloquear(){if(desbloqueado)return;desbloqueado=true;if(speechSynthesis){speechSynthesis.resume();let v=new SpeechSynthesisUtterance('');v.volume=0;speechSynthesis.speak(v);}}
function hablar(t){desbloquear();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}
document.addEventListener('click',desbloquear,{once:true});document.addEventListener('touchstart',desbloquear,{once:true});
</script></body></html>
