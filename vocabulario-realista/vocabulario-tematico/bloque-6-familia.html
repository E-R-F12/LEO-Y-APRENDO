<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOQUE 6 - FAMILIA - 14</title>
<style>
body{font-family:Arial;background:#fce7f3;margin:0;padding:15px}
.container{max-width:1250px;margin:0 auto}
h1{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:15px}
.card{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.card img{width:100%;height:160px;object-fit:cover;border-radius:8px}
.label{font-weight:bold;margin:10px 0;font-size:18px}
.audio-box button{background:#2563eb;color:white;border:0;padding:8px 18px;border-radius:20px;font-size:18px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
<h1>👨‍👩‍👧‍👦 BLOQUE 6 - FAMILIA (14)</h1>
<div class="grid">

<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/abuelos.jpg"><div class="label">1. ABUELOS</div><div class="audio-box"><button onclick="hablar('abuelos')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/abuelo.jpg"><div class="label">2. ABUELO</div><div class="audio-box"><button onclick="hablar('abuelo')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/abuela.jpg"><div class="label">3. ABUELA</div><div class="audio-box"><button onclick="hablar('abuela')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/matrimonio.jpg"><div class="label">4. MATRIMONIO</div><div class="audio-box"><button onclick="hablar('matrimonio')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/papa.jpg"><div class="label">5. PAPA</div><div class="audio-box"><button onclick="hablar('papá')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/mama.jpg"><div class="label">6. MAMA</div><div class="audio-box"><button onclick="hablar('mamá')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/hijo.jpg"><div class="label">7. HIJO</div><div class="audio-box"><button onclick="hablar('hijo')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/hija.jpg"><div class="label">8. HIJA</div><div class="audio-box"><button onclick="hablar('hija')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/tio.jpg"><div class="label">9. TIO</div><div class="audio-box"><button onclick="hablar('tío')">🔊</button></div></div>

<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/primo.jpg"><div class="label">11. PRIMO</div><div class="audio-box"><button onclick="hablar('primo')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/prima.jpg"><div class="label">12. PRIMA</div><div class="audio-box"><button onclick="hablar('prima')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/familia.jpg"><div class="label">13. FAMILIA</div><div class="audio-box"><button onclick="hablar('familia')">🔊</button></div></div>
<div class="card"><img src="../vocabulario-realista/imagenes/bloque-6-familia/bebe.jpg"><div class="label">14. BEBE</div><div class="audio-box"><button onclick="hablar('bebé')">🔊</button></div></div>

</div>
</div>

<script>
let desbloqueado=false;
function desblo(){if(desbloqueado)return;desbloqueado=true;if(window.speechSynthesis){speechSynthesis.resume();let v=new SpeechSynthesisUtterance('');v.volume=0;speechSynthesis.speak(v);}}
function hablar(t){desblo();speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}
document.addEventListener('click',desblo,{once:true});
document.addEventListener('touchstart',desblo,{once:true});
</script>
</body>
</html>
