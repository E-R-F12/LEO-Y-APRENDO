<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bloque 1 - SALUDOS (30) - Fotos reales + Audios</title>
<style>
body{font-family:Arial,sans-serif;background:#fefce8;margin:0;padding:15px}
.container{max-width:1250px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.card img{width:100%;height:190px;object-fit:cover}
.label{padding:8px;font-weight:bold;text-align:center}
.audio-box{padding:8px;background:#f9fafb;display:flex;gap:6px;justify-content:center}
audio{width:180px;height:32px}
.btn{border:none;padding:6px 10px;border-radius:20px;background:#1a5aa8;color:white;cursor:pointer}
.back{display:inline-block;background:white;padding:8px 16px;border-radius:20px;text-decoration:none;margin-bottom:12px}
.total{background:#1a5aa8;color:white;padding:10px;border-radius:8px;text-align:center;margin-bottom:14px}
</style>
</head>
<body>
<div class="container">
<a href="index.html" class="back">← Volver al índice</a>
<h1>👋 BLOQUE 1 - SALUDOS (30) - Fotos reales + Audios</h1>
<div class="total">30 fotos reales relacionadas + 30 audios 🔊</div>
<div class="grid">

<!-- COPIA ESTE PATRÓN PARA LAS 30 PALABRAS -->
<div class="card">
<img src="https://loremflickr.com/400/250/hello?lock=hola" alt="HOLA" onerror="this.src='https://source.unsplash.com/400x250/?hello'">
<div class="label">1. HOLA</div>
<div class="audio-box">
<audio controls src="audios/bloque-1-saludos/hola.mp3"></audio>
<button class="btn" onclick="hablar('Hola')">🔊</button>
</div>
</div>

<div class="card">
<img src="https://loremflickr.com/400/250/goodbye?lock=adios" alt="ADIOS" onerror="this.src='https://source.unsplash.com/400x250/?goodbye'">
<div class="label">2. ADIOS</div>
<div class="audio-box">
<audio controls src="audios/bloque-1-saludos/adios.mp3"></audio>
<button class="btn" onclick="hablar('Adiós')">🔊</button>
</div>
</div>

<div class="card">
<img src="https://loremflickr.com/400/250/good-morning?lock=buenos-dias" alt="BUENOS DIAS">
<div class="label">3. BUENOS DIAS</div>
<div class="audio-box">
<audio controls src="audios/bloque-1-saludos/buenos-dias.mp3"></audio>
<button class="btn" onclick="hablar('Buenos días')">🔊</button>
</div>
</div>

<!-- ... REPITE EL MISMO BLOQUE PARA LAS 27 PALABRAS RESTANTES ... -->
<!-- 4. BUENAS TARDES, 5. BUENAS NOCHES, 6. GRACIAS, 7. POR FAVOR, 8. DE NADA, 9. PERDON, 10. LO SIENTO, 11. COMO ESTAS, 12. BIEN, 13. MAL, 14. SI, 15. NO, 16. VALE, 17. HASTA LUEGO, 18. HASTA MANANA, 19. BIENVENIDO, 20. ENCANTADO, 21. MUCHO GUSTO, 22. QUE TAL, 23. REGULAR, 24. FENOMENAL, 25. NOS VEMOS, 26. SALUDOS, 27. ABRAZO, 28. BESO, 29. CHOCA ESOS CINCO, 30. ADIOS AMIGO -->

</div>
</div>
<script>
function hablar(t){
  const u=new SpeechSynthesisUtterance(t);
  u.lang='es-ES'; u.rate=0.9;
  speechSynthesis.speak(u);
}
</script>
</body>
</html>
