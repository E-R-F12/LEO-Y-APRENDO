<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOQUE 1 - SALUDOS (30) - Fotos reales + Audios</title>
<style>
body{background:#FFFEF5;margin:0;padding:20px;font-family:Arial,sans-serif}
h1{font-size:22px;margin-bottom:15px}
.barra{background:#1a5fb4;color:white;text-align:center;padding:10px;border-radius:8px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:180px;object-fit:contain;background:#e3f2fd;display:block}
.card .num{font-weight:bold;font-size:14px;margin:10px 0 6px;text-transform:uppercase}
.audio-row{display:flex;align-items:center;justify-content:center;gap:6px;background:#f6f6f6;padding:6px;border-radius:20px;margin:0 10px}
.audio-row audio{width:120px;height:30px}
.btn-audio{background:#1a5fb4;color:white;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer}
.back{display:inline-block;margin-bottom:15px;color:#1a5fb4;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<a class="back" href="../../index.html">← Volver</a>

</body>
</html>
