<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOQUE 1 - SALUDOS (30) - Fotos reales + Audios</title>
<style>
body{background:#FFFEF5;margin:0;padding:15px;font-family:Arial,sans-serif}
.barra{background:#1a5fb4;color:white;text-align:center;padding:10px;border-radius:8px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.card{background:white;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:180px;object-fit:contain;background:#e3f2fd;display:block}
.num{font-weight:bold;font-size:13px;margin:8px 0;text-transform:uppercase}
.audio-row{display:flex;justify-content:center;gap:6px;padding:5px}
.btn-audio{background:#1a5fb4;color:white;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer}
.back{color:#1a5fb4;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<a class="back" href="../vocabulario-tematico/../..">← Volver</a>
<h1>👋 BLOQUE 1 - SALUDOS (30) - Fotos reales + Audios</h1>
<div class="barra">30 fotos reales relacionadas + 30 audios 🔊</div>
<div class="grid" id="grid"></div>
<script>
const baseImg = "../imagenes/bloque-1-saludos/";
const palabras=[
{file:"hola.jpg",texto:"HOLA"},
{file:"adios.jpg",texto:"ADIOS"},
{file:"buenos dias.jpg",texto:"BUENOS DIAS"},
{file:"buenas tardes.jpg",texto:"BUENAS TARDES"},
{file:"buenas noches.jpg",texto:"BUENAS NOCHES"},
{file:"por favor.jpg",texto:"POR FAVOR"},
{file:"gracias.jpg",texto:"GRACIAS"},
{file:"de nada.jpg",texto:"DE NADA"},
{file:"perdon.jpg",texto:"PERDON"},
{file:"lo siento.jpg",texto:"LO SIENTO"},
{file:"si.jpg",texto:"SI"},
{file:"no.jpg",texto:"NO"},
{file:"como estas.jpg",texto:"COMO ESTAS"},
{file:"muy bien.jpg",texto:"MUY BIEN"},
{file:"hasta luego.jpg",texto:"HASTA LUEGO"},
{file:"hasta mañana.jpg",texto:"HASTA MAÑANA"},
{file:"bienvenido.jpg",texto:"BIENVENIDO"},
{file:"encantado.jpg",texto:"ENCANTADO"},
{file:"disculpe.jpg",texto:"DISCULPE"},
{file:"salud.jpg",texto:"SALUD"},
{file:"que tal.jpg",texto:"QUE TAL"},
{file:"como te llamas.jpg",texto:"COMO TE LLAMAS"},
{file:"me llamo.jpg",texto:"ME LLAMO"},
{file:"mucho gusto.jpg",texto:"MUCHO GUSTO"},
{file:"cuidate.jpg",texto:"CUIDATE"},
{file:"buen dia.jpg",texto:"BUEN DIA"},
{file:"nos vemos.jpg",texto:"NOS VEMOS"},
{file:"hasta pronto.jpg",texto:"HASTA PRONTO"},
{file:"donde esta.jpg",texto:"DONDE ESTA"},
{file:"estoy bien gracias.jpg",texto:"ESTOY BIEN GRACIAS"}
];
const grid=document.getElementById('grid');
function hablar(t){const u=new SpeechSynthesisUtterance(t.toLowerCase());u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
palabras.forEach((p,i)=>{
 const card=document.createElement('div');card.className='card';
 card.innerHTML=`<img src="${baseImg+p.file}" alt="${p.texto}"><div class="num">${i+1}. ${p.texto}</div><div class="audio-row"><audio controls src="../audios/bloque-1-saludos/${p.file.replace('.jpg','.mp3')}"></audio><button class="btn-audio" onclick="hablar('${p.texto}')">🔊</button></div>`;
 grid.appendChild(card);
});
</script>
</body>
</html>
