<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 3 - La Comida Real</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#fff7ed}
header{background:#f97316;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0}
.wrap{max-width:1050px;margin:auto;padding:16px}
a.volver{color:#f97316;font-weight:900;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.12);border:2px solid #ffedd5;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#f97316}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:12px;text-align:center}
.info b{font-size:18px;color:#1e293b;display:block}
.info span{font-size:12px;color:#f97316;font-weight:900;display:block;margin-top:2px}
.btn{border:0;background:#f97316;color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>🍎 Bloque 3 - La Comida - Fotos que explican</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver</a>
<div class="grid" id="grid"></div>
</div>
<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
const data=[
{es:"El pan",desc:"Khobz redondo marroquí y barra española",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500"},
{es:"La leche",desc:"Vaso de leche blanca de vaca",img:"https://images.unsplash.com/photo-1550583724-b2692b85b150?w=500"},
{es:"La manzana",desc:"Manzana roja en mano de niño",img:"https://images.unsplash.com/photo-1570913149827-d2ac84ab3f9a?w=500"},
{es:"El agua",desc:"Jarra sirviendo agua transparente",img:"https://images.unsplash.com/photo-1548839140-29a749e1cf4d?w=500"},
{es:"La ensalada",desc:"Tomate, pepino, lechuga y aceitunas",img:"https://images.unsplash.com/photo-1512621776952-a57141f2eefd?w=500"},
{es:"El pollo",desc:"Pollo asado doradito",img:"https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=500"},
{es:"Los dátiles",desc:"Dátiles dulces de Marruecos en cuenco",img:"https://images.unsplash.com/photo-1591206369811-0cc68a3a4edf?w=500"},
{es:"La harira",desc:"Sopa tradicional con garbanzos y tomate",img:"https://images.unsplash.com/photo-1547592180-85f173990554?w=500"},
{es:"El cuscús",desc:"Cuscús con verduras y garbanzos",img:"https://images.unsplash.com/photo-1585937421612-70a008356cfbe?w=500"},
{es:"El zumo",desc:"Zumo de naranja recién exprimido",img:"https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=500"},
];
const g=document.getElementById('grid');
data.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<img src="${d.img}"><div class="info"><b>${d.es}</b><span>${d.desc}</span><br><button class="btn">🔊 ${d.es}</button></div>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
</script>
</body>
</html>
