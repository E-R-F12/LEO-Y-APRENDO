<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 12 - Ciudad | LEO Y APRENDO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f8fafc;color:#0f172a}
.header{background:#fff;padding:14px 28px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:20px;text-decoration:none;color:#0f172a}
.back{background:#14a8b8;color:#fff!important;padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:600;font-size:13px}
.hero{max-width:1200px;margin:0 auto;padding:28px 20px 10px;text-align:center}
.hero h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;font-weight:800}
.hero p{color:#64748b;margin:8px 0}
.grid{max-width:1280px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:16px;padding:0 20px 40px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06);border:1px solid #eef2f7;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 22px rgba(0,0,0,.10)}
.card-img{height:130px;background:#e2e8f0;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px 12px;text-align:center}
.card-body b{font-size:13px;text-transform:uppercase;display:block}
.count{text-align:center;margin:0 0 10px;font-weight:600;color:#14a8b8}
</style>
</head>
<body>
<div class="header"><a class="logo" href="../index.html">📘 LEO Y APRENDO</a><a class="back" href="../index.html">← Volver</a></div>
<div class="hero"><h1>12. LA CIUDAD - 50 palabras</h1><p>Vocabulario urbano real para secundaria. Haz clic para escuchar.</p><div class="count" id="count"></div></div>
<div class="grid" id="grid"></div>
<script>
const palabras = ["avenida","bulevar","rotonda","semaforo","paso de cebra","acera","carril bici","metro","tranvia","estacion de autobuses","aeropuerto","rascacielos","bloque de pisos","atico","poligono industrial","centro comercial","mercado central","quiosco","biblioteca municipal","museo","teatro","cine","estadio","polideportivo","piscina municipal","parque de bomberos","comisaria","juzgado","universidad","instituto","guarderia","centro de salud","hospital","farmacia 24h","gasolinera","taller mecanico","cajero automatico","oficina de correos","peluqueria","gimnasio","restaurante","cafeteria","hotel","discoteca","parking subterraneo","contenedor de reciclaje","alcantarilla","alumbrado publico","ascensor","pasarela"];
const base="../imagenes/%20%20%20bloque-12-ciudad/";
const grid=document.getElementById('grid');
document.getElementById('count').innerText = palabras.length + ' palabras';
palabras.forEach(p=>{
  const safe = p.replace(/ /g,'_');
  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`<div class="card-img"><img src="${base}${safe}.jpg" alt="${p}" onerror="this.src='https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=400&q=80'"></div><div class="card-body"><b>${p}</b></div>`;
  card.onclick=()=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);
  };
  grid.appendChild(card);
});
</script>
</body>
</html>
