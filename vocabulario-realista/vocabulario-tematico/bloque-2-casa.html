<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 2 - Casa | Leo y Aprendo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f7ff;padding:15px}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#1a5fb4;font-size:28px}
.header a{color:#1a5fb4;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1000px;margin:0 auto}
.card{background:white;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:140px;object-fit:contain;background:white;padding:10px;display:block}
.palabra{font-size:16px;font-weight:bold;color:#333;text-transform:uppercase;margin-top:5px}
.silabas{font-size:13px;color:#666;margin:4px 0}
.articulo{font-size:12px;color:#999}
.btn-audio{background:#1a5fb4;color:white;border:none;border-radius:50%;width:26px;height:26px;cursor:pointer;margin-left:6px}
.games{max-width:1000px;margin:30px auto;background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.games h2{color:#1a5fb4;margin-bottom:10px}
.game-btn{background:#ffd60a;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;margin:5px}
.game-area{margin-top:15px;min-height:80px}
.choice{display:inline-block;background:#eef5ff;border:2px solid #1a5fb4;border-radius:12px;padding:8px 14px;margin:6px;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<h1>🏠 BLOQUE 2 - CASA</h1>
<p><a href="../../index.html">← Volver al inicio</a></p>
</div>
<div class="grid" id="grid"></div>

<div class="games">
<h2>🎮 JUEGO 1: ¿Qué objeto es?</h2>
<button class="game-btn" onclick="iniciarJuego1Casa()">¡Jugar!</button>
<div id="juego1" class="game-area"></div>
</div>

<div class="games">
<h2>🔊 JUEGO 2: Escucha y elige</h2>
<button class="game-btn" onclick="iniciarJuego2Casa()">¡Escuchar!</button>
<div id="juego2" class="game-area"></div>
</div>

<script>
const RAW_BASE = "https://raw.githubusercontent.com/e-r-f12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/bloque-2-casa/";
const PAGES_BASE = "https://e-r-f12.github.io/LEO-Y-APRENDO/vocabulario-realista/imagenes/bloque-2-casa/";
const REL_BASE = "../imagenes/bloque-2-casa/";

const palabras = [
{texto:"alfombra", silabas:"al-fom-bra", art:"la"},
{texto:"cortina", silabas:"cor-ti-na", art:"la"},
{texto:"televisión", silabas:"te-le-vi-sión", art:"la"},
{texto:"ordenador", silabas:"or-de-na-dor", art:"el"},
{texto:"teléfono", silabas:"te-lé-fo-no", art:"el"},
{texto:"reloj", silabas:"re-loj", art:"el"},
{texto:"cuadro", silabas:"cua-dro", art:"el"},
{texto:"planta", silabas:"plan-ta", art:"la"},
{texto:"escalera", silabas:"es-ca-le-ra", art:"la"},
{texto:"garaje", silabas:"ga-ra-je", art:"el"},
{texto:"cama", silabas:"ca-ma", art:"la"},
{texto:"armario", silabas:"ar-ma-rio", art:"el"},
{texto:"mesa", silabas:"me-sa", art:"la"},
{texto:"silla", silabas:"si-lla", art:"la"},
{texto:"sofá", silabas:"so-fá", art:"el"},
{texto:"lámpara", silabas:"lám-pa-ra", art:"la"},
{texto:"espejo", silabas:"es-pe-jo", art:"el"},
{texto:"puerta", silabas:"puer-ta", art:"la"},
{texto:"ventana", silabas:"ven-ta-na", art:"la"},
{texto:"cocina", silabas:"co-ci-na", art:"la"},
{texto:"nevera", silabas:"ne-ve-ra", art:"la"},
{texto:"baño", silabas:"ba-ño", art:"el"},
{texto:"ducha", silabas:"du-cha", art:"la"},
{texto:"váter", silabas:"vá-ter", art:"el"},
{texto:"lavabo", silabas:"la-va-bo", art:"el"},
{texto:"toalla", silabas:"to-a-lla", art:"la"},
{texto:"mesita", silabas:"me-si-ta", art:"la"},
{texto:"sillón", silabas:"si-llón", art:"el"},
{texto:"horno", silabas:"hor-no", art:"el"},
{texto:"fregadero", silabas:"fre-ga-de-ro", art:"el"}
];

function hablar(t){ const u=new SpeechSynthesisUtterance(t); u.lang='es-ES'; u.rate=0.8; speechSynthesis.speak(u); }
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ñ/g,'n').replace(/[^a-z0-9]/g,'');}

const grid=document.getElementById('grid');
let reales=[];

fetch('https://api.github.com/repos/e-r-f12/LEO-Y-APRENDO/contents/vocabulario-realista/imagenes/bloque-2-casa')
.then(r=>r.json()).then(data=>{
  reales=data.filter(f=>f.type==='file').map(f=>f.name);
  pintar();
}).catch(()=>{ pintar(); });

function buscar(p){
  const n=norm(p.texto);
  for(let real of reales){
    const nr=norm(real.replace(/\.[^/.]+$/,""));
    if(nr===n || nr.includes(n) || n.includes(nr)) return real;
  }
  return reales.find(r=> norm(r).includes(n) ) || null;
}

function pintar(){
  grid.innerHTML='';
  palabras.forEach(p=>{
    const card=document.createElement('div'); card.className='card';
    const real=buscar(p);
    const img=document.createElement('img');
    img.alt=p.texto;
    if(real){
      img.src=RAW_BASE+encodeURI(real);
    } else {
      // fallback a posibles nombres
      img.src=RAW_BASE+norm(p.texto)+".jpg";
    }
    img.onerror=function(){
      // prueba segunda ruta (Pages)
      if(this.src.startsWith(RAW_BASE)){
        this.src=PAGES_BASE+encodeURI(real||p.texto+".jpg");
        this.onerror=function(){
          // prueba relativa
          this.src=REL_BASE+(real||p.texto+".jpg");
          this.onerror=function(){ this.style.display='none'; };
        };
      }
    };
    card.appendChild(img);
    const d1=document.createElement('div'); d1.className='palabra'; d1.textContent=p.texto;
    const d2=document.createElement('div'); d2.className='silabas'; d2.innerHTML=`<span>${p.silabas}</span> <button class="btn-audio" onclick="hablar('${p.texto}')">🔊</button>`;
    const d3=document.createElement('div'); d3.className='articulo'; d3.textContent=p.art;
    card.appendChild(d1); card.appendChild(d2); card.appendChild(d3);
    grid.appendChild(card);
  });
}

let actualCasa=null;
function iniciarJuego1Casa(){
  const cont=document.getElementById('juego1'); 
  actualCasa=palabras[Math.floor(Math.random()*palabras.length)];
  let opciones=[actualCasa]; 
  while(opciones.length<4){ const r=palabras[Math.floor(Math.random()*palabras.length)]; if(!opciones.includes(r)) opciones.push(r); } 
  opciones.sort(()=>Math.random()-0.5);
  cont.innerHTML=`<p style="font-size:20px;font-weight:bold;margin-bottom:10px">¿Dónde está <span style="color:#1a5fb4">${actualCasa.texto.toUpperCase()}</span>?</p>`;
  opciones.forEach(op=>{ 
    const d=document.createElement('div'); d.className='choice'; d.textContent=op.texto.toUpperCase(); 
    d.onclick=()=>{ if(op===actualCasa){ d.style.background='#c8f7c5'; hablar(actualCasa.texto); } else { d.style.background='#ffcdd2'; } }; 
    cont.appendChild(d); 
  });
}
function iniciarJuego2Casa(){
  const cont=document.getElementById('juego2'); 
  actualCasa=palabras[Math.floor(Math.random()*palabras.length)]; 
  hablar(actualCasa.texto);
  let opciones=[actualCasa]; 
  while(opciones.length<4){ const r=palabras[Math.floor(Math.random()*palabras.length)]; if(!opciones.includes(r)) opciones.push(r); } 
  opciones.sort(()=>Math.random()-0.5);
  cont.innerHTML=`<p style="margin-bottom:10px"><button class="game-btn" onclick="hablar('${actualCasa.texto}')">🔊 Repetir</button></p>`;
  opciones.forEach(op=>{ 
    const d=document.createElement('div'); d.className='choice'; d.textContent=op.texto.toUpperCase(); 
    d.onclick=()=>{ if(op===actualCasa){ d.style.background='#c8f7c5'; } else { d.style.background='#ffcdd2'; } }; 
    cont.appendChild(d); 
  });
}
</script>
</body>
</html>
