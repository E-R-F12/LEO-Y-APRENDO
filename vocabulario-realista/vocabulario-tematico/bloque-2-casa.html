<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 2 - La Casa Real</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#f0f9ff}
header{background:#0ea5e9;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0}
.wrap{max-width:1050px;margin:auto;padding:16px}
a.volver{color:#0ea5e9;font-weight:900;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.12);border:2px solid #e0f2fe;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#0ea5e9}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:12px;text-align:center}
.info b{font-size:18px;color:#0f172a;display:block}
.info span{font-size:12px;color:#0ea5e9;font-weight:900}
.btn{border:0;background:#0ea5e9;color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>🏠 Bloque 2 - La Casa - Fotos que explican</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver</a>
<div class="grid" id="grid"></div>
</div>
<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
const data=[
{es:"La cocina",desc:"Lugar donde cocinamos, con fuego y sartén",img:"https://images.unsplash.com/photo-1556911220-bff31c812dba?w=500"},
{es:"El salón",desc:"Sofá, tele y familia sentada junta",img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=500"},
{es:"El dormitorio",desc:"Habitación con cama y osito",img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=500"},
{es:"El baño",desc:"Lavabo, espejo y toalla",img:"https://images.unsplash.com/photo-1620626011761-b8ff4b38f186?w=500"},
{es:"La puerta",desc:"Se abre y cierra para entrar",img:"https://images.unsplash.com/photo-1502005097973-6a7082348e28?w=500"},
{es:"La ventana",desc:"Cristal abierto, entra luz y se ve jardín",img:"https://images.unsplash.com/photo-1524634126442-357e0eac3c14?w=500"},
{es:"El jardín",desc:"Fuera de casa con flores y árboles",img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=500"},
{es:"La mesa",desc:"Donde comemos con platos",img:"https://images.unsplash.com/photo-1533090484-07cc94c8a6f1?w=500"},
{es:"La cama",desc:"Para dormir con almohada",img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=500"},
{es:"La lámpara",desc:"Da luz por la noche para leer cuento",img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=500"},
];
const g=document.getElementById('grid');
data.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<img src="${d.img}"><div class="info"><b>${d.es}</b><span>${d.desc}</span><br><button class="btn">🔊 ${d.es}</button></div>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
</script>
</body>
</html>
