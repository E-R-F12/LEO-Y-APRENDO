<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 2 - La Casa</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#f0f9ff}
header{background:#0ea5e9;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px;position:sticky;top:0;z-index:10}
.wrap{max-width:900px;margin:auto;padding:16px}
a.volver{color:#0ea5e9;font-weight:900;text-decoration:none;display:inline-block;margin-bottom:12px}
h2{color:#0284c7;margin:22px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}
.card{background:#fff;border:2px solid #e0f2fe;border-radius:18px;padding:12px;text-align:center;cursor:pointer;box-shadow:0 6px 16px rgba(14,165,233,.12);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#0ea5e9}
.card.emoji{font-size:38px}.card b{display:block;margin-top:6px;color:#1e293b}.card small{color:#64748b;font-size:12px}
.btn{border:0;background:#0ea5e9;color:#fff;border-radius:999px;padding:8px 14px;font-weight:900;cursor:pointer;margin-top:8px}
.game{background:#fff;border:2px dashed #7dd3fc;border-radius:18px;padding:16px;margin-top:18px}
.opcion{display:inline-block;background:#f0f9ff;border:2px solid #e0f2fe;border-radius:12px;padding:10px 14px;margin:6px;font-weight:800;cursor:pointer}
.opcion.correct{background:#d4edda;border-color:#28a745}.opcion.wrong{background:#f8d7da;border-color:#dc3545}
.scene{background:#fff;border-radius:18px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center;font-size:12px;font-weight:800}
.scene div{background:#f8fafc;border-radius:12px;padding:8px}
</style>
</head>
<body>
<header>🏠 Bloque 2 - La Casa</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver a los 9 bloques</a>

<h2>1. Partes de la casa 🏡</h2>
<div class="grid" id="partes"></div>

<h2>2. Cosas de la casa 🛋️</h2>
<div class="grid" id="cosas"></div>

<h2>3. Mini-Diálogo en casa 🗣️</h2>
<div class="game">
<p><b>Ahlam:</b> Adam, ¿dónde está la mochila? 🎒</p>
<p><b>Adam:</b> Está en el dormitorio, en la cama.</p>
<p><b>Ahlam:</b> ¿Y la mesa?</p>
<p><b>Adam:</b> La mesa está en la cocina.</p>
<button class="btn" onclick="hablar('¿Dónde está la mochila? Está en el dormitorio, en la cama. ¿Y la mesa? La mesa está en la cocina.')">🔊 Escuchar</button>
</div>

<h2>4. Juego: ¿Dónde está? 🎮</h2>
<div class="game" id="quiz">
<p id="pregunta" style="font-weight:900;font-size:18px"></p>
<div id="opciones"></div>
<p id="feedback" style="font-weight:900;margin-top:10px"></p>
<button class="btn" onclick="nuevaPregunta()">Siguiente ➡️</button>
</div>
</div>

<script>
function hablar(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}

const partes=[
{es:"La casa",em:"🏠",ej:"Mi casa es bonita"},
{es:"La cocina",em:"🍳",ej:"Estoy en la cocina"},
{es:"El salón",em:"🛋️",ej:"Tele en el salón"},
{es:"El dormitorio",em:"🛏️",ej:"Duermo en el dormitorio"},
{es:"El baño",em:"🚿",ej:"Me lavo en el baño"},
{es:"La puerta",em:"🚪",ej:"Abre la puerta"},
{es:"La ventana",em:"🪟",ej:"Cierra la ventana"},
{es:"El jardín",em:"🌳",ej:"Jugamos en el jardín"},
];
const cosas=[
{es:"La mesa",em:"🪑",ej:"La mesa de la cocina"},
{es:"La silla",em:"💺",ej:"Siéntate en la silla"},
{es:"La cama",em:"🛏️",ej:"La cama grande"},
{es:"El sofá",em:"🛋️",ej:"El sofá del salón"},
{es:"La lámpara",em:"💡",ej:"Enciende la lámpara"},
{es:"El espejo",em:"🪞",ej:"Mírate en el espejo"},
{es:"La nevera",em:"🧊",ej:"Agua en la nevera"},
{es:"La tele",em:"📺",ej:"Ver la tele"},
];

function pintar(id,lista){
const g=document.getElementById(id);
lista.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<div style="font-size:38px">${d.em}</div><b>${d.es}</b><small>${d.ej}</small><br><button class="btn">🔊</button>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
}
pintar('partes',partes); pintar('cosas',cosas);

const preguntas=[
{q:"¿Dónde cocinamos?",op:["En el baño","En la cocina","En el jardín"],ok:1},
{q:"¿Dónde dormimos?",op:["En el dormitorio","En la puerta","En la mesa"],ok:0},
{q:"¿Dónde vemos la tele?",op:["En el salón","En la nevera","En la ventana"],ok:0},
{q:"La silla está en...",op:["La casa","El agua","El cielo"],ok:0},
{q:"Abre la...",op:["Puerta","Cama","Tele"],ok:0},
];
function nuevaPregunta(){
const p=preguntas[Math.floor(Math.random()*preguntas.length)];
document.getElementById('pregunta').innerText=p.q;
const cont=document.getElementById('opciones');cont.innerHTML='';document.getElementById('feedback').innerText='';
p.op.forEach((t,i)=>{
const b=document.createElement('div');b.className='opcion';b.innerText=t;
b.onclick=()=>{
if(i===p.ok){b.classList.add('correct');document.getElementById('feedback').innerText='¡Correcto! 🏠';hablar('¡Muy bien!');}
else{b.classList.add('wrong');document.getElementById('feedback').innerText='Intenta otra vez 😊';}
};cont.appendChild(b);
});
}
nuevaPregunta();
</script>
</body>
</html>
