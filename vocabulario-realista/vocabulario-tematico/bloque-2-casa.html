<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 2 - En Casa | LEO Y APRENDO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#FFF7ED;padding:16px}
a{color:#EA580C;text-decoration:none;font-weight:bold}
header{text-align:center;padding:20px 10px}
header h1{font-size:32px;color:#9A3412}
header p{color:#666;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;max-width:1000px;margin:20px auto}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center;cursor:pointer}
.card img{width:100%;height:130px;object-fit:cover;background:#fff;padding:8px}
.card.icon img{object-fit:contain}
.card h2{font-size:19px;padding:10px 6px 2px;text-transform:lowercase}
.card h2::first-letter{text-transform:uppercase}
.card button{background:#EA580C;color:#fff;border:0;padding:8px 14px;border-radius:20px;margin:8px 0 14px;cursor:pointer;font-size:15px}
.card button:hover{background:#C2410C}
</style>
</head>
<body>

<a href="../">← Volver</a>
<header>
<h1>🏠 Bloque 2 - En Casa</h1>
<p>Toca la tarjeta para escuchar la palabra. 34 palabras.</p>
</header>

<div class="grid" id="grid"></div>

<script>
const PALABRAS = [
// --- FOTOS ---
{palabra:"ALMOHADA", img:"https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?w=600&q=80"},
{palabra:"ARMARIO", img:"https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=600&q=80"},
{palabra:"BAÑO", img:"https://images.unsplash.com/photo-1620626011761-996317b8d101?w=600&q=80"},
{palabra:"CAMA", img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=600&q=80"},
{palabra:"COCINA", img:"https://images.unsplash.com/photo-1556911220-bff31c812dba?w=600&q=80"},
{palabra:"COMEDOR", img:"https://images.unsplash.com/photo-1617806118233-18e1de247200?w=600&q=80"},
{palabra:"DORMITORIO", img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=600&q=80"},
{palabra:"HORNO", img:"https://images.unsplash.com/photo-1584267385494-9fdd9a71ad75?w=600&q=80"},
{palabra:"LÁMPARA", img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=600&q=80"},
{palabra:"LAVADORA", img:"https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=600&q=80"},
{palabra:"MESA", img:"https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?w=600&q=80"},
{palabra:"NEVERA", img:"https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=600&q=80"},
{palabra:"SALÓN", img:"https://images.unsplash.com/photo-1554995207-c18c203602cb?w=600&q=80"},
{palabra:"SILLA", img:"https://images.unsplash.com/photo-1592078615290-033ee584e267?w=600&q=80"},
{palabra:"SOFÁ", img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=600&q=80"},

// --- ICONOS REPRESENTATIVOS ---
{palabra:"BALCÓN", img:"https://img.icons8.com/color/240/balcony.png", icon:true},
{palabra:"BAÑERA", img:"https://img.icons8.com/color/240/bath.png", icon:true},
{palabra:"CORTINA", img:"https://img.icons8.com/color/240/curtains.png", icon:true},
{palabra:"DUCHA", img:"https://img.icons8.com/color/240/shower.png", icon:true},
{palabra:"ESPEJO", img:"https://img.icons8.com/color/240/mirror.png", icon:true},
{palabra:"GARAJE", img:"https://img.icons8.com/color/240/garage.png", icon:true},
{palabra:"PASILLO", img:"https://img.icons8.com/color/240/hallway.png", icon:true},
{palabra:"PUERTA", img:"https://img.icons8.com/color/240/door.png", icon:true},
{palabra:"SILLÓN", img:"https://img.icons8.com/color/240/armchair.png", icon:true},
{palabra:"TECHO", img:"https://img.icons8.com/color/240/roof.png", icon:true},
{palabra:"TERRAZA", img:"https://img.icons8.com/color/240/terrace.png", icon:true},
{palabra:"VENTANA", img:"https://img.icons8.com/color/240/window.png", icon:true},
{palabra:"COJÍN", img:"https://img.icons8.com/color/240/pillow.png", icon:true},
{palabra:"MANTEL", img:"https://img.icons8.com/color/240/tablecloth.png", icon:true},
{palabra:"TOALLA", img:"https://img.icons8.com/color/240/towel.png", icon:true},
{palabra:"SÁBANA", img:"https://img.icons8.com/color/240/bed-sheets.png", icon:true},
];

const grid = document.getElementById('grid');
PALABRAS.forEach(p => {
  const d = document.createElement('div');
  d.className = 'card' + (p.icon ? ' icon' : '');
  d.innerHTML = `<img src="${p.img}" alt="${p.palabra}"><h2>${p.palabra}</h2><button>🔊 Escuchar</button>`;
  d.onclick = () => {
    const u = new SpeechSynthesisUtterance(p.palabra.toLowerCase());
    u.lang = 'es-ES'; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  grid.appendChild(d);
});
</script>
</body>
</html>
