<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 2 - La Casa Realista</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#f0f9ff}
header{background:#0ea5e9;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0;z-index:10}
.wrap{max-width:1000px;margin:auto;padding:16px}
a.volver{color:#0ea5e9;font-weight:900;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 20px rgba(14,165,233,.15);border:2px solid #e0f2fe}
.card img{width:100%;height:130px;object-fit:cover;display:block}
.card .info{padding:10px;text-align:center}
.btn{border:0;background:#0ea5e9;color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>🏠 Bloque 2 - La Casa - REAL</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver a los 9 bloques</a>
<h2 style="color:#0ea5e9">Partes de la casa con fotos reales 📸</h2>
<div class="grid" id="grid"></div>
</div>
<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}
const data=[
{es:"La cocina",img:"https://images.unsplash.com/photo-1556911220-bff31c812dba?w=400"},
{es:"El salón",img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"},
{es:"El dormitorio",img:"https://images.unsplash.com/photo-1616594039964-ae9021a400a0?w=400"},
{es:"El baño",img:"https://images.unsplash.com/photo-1620626011761-b8ff4b38f186?w=400"},
{es:"La puerta",img:"https://images.unsplash.com/photo-1502005097973-6a7082348e28?w=400"},
{es:"La ventana",img:"https://images.unsplash.com/photo-1524634126442-357e0eac3c14?w=400"},
{es:"El jardín",img:"https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400"},
{es:"La mesa",img:"https://images.unsplash.com/photo-1533090484-07cc94c8a6f1?w=400"},
{es:"La cama",img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?w=400"},
{es:"La lámpara",img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?w=400"},
];
const g=document.getElementById('grid');
data.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<img src="${d.img}"><div class="info"><b>${d.es}</b><br><button class="btn">🔊 ${d.es}</button></div>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
</script>
</body>
</html>
