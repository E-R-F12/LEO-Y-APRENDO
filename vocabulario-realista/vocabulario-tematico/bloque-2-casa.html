<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloque 2 CASA</title>
<style>body{font-family:Arial;background:#eff6ff;padding:15px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.12)}.card img{width:100%;height:190px;object-fit:cover;display:block}.label{padding:8px;font-weight:bold;text-align:center}.box{padding:6px;background:#f9fafb;text-align:center}button{border:none;padding:6px 12px;border-radius:20px;background:#1a5aa8;color:white;cursor:pointer}</style></head><body>
