<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BLOQUE 8 - ROPA</title>
<style>
body{font-family:'Segoe UI',sans-serif;background:#e6fffa;margin:0;padding:16px}
.header-top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}
.volver{background:white;padding:8px 14px;border-radius:20px;text-decoration:none;color:#4a4ae0;box-shadow:0 2px 6px rgba(0,0,0,.1)}
h1{color:#0f766e;text-align:center;flex:1;margin:0}
.sub{max-width:1100px;margin:12px auto;background:#0f766e;color:white;text-align:center;padding:10px;border-radius:10px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;max-width:1100px;margin:18px auto}
.card{background:white;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.08);overflow:hidden;text-align:center;padding-bottom:10px}
.card img{width:100%;height:140px;object-fit:cover}
.card h3{margin:8px 0 2px;font-size:15px}
.card button{margin:4px;background:#0f766e;color:white;border:none;padding:6px 12px;border-radius:8px;cursor:pointer}
.games{max-width:1100px;margin:24px auto;background:white;border-radius:16px;padding:16px}
.game-box{border:2px dashed #0f766e;border-radius:12px;padding:16px;margin:12px 0;text-align:center}
</style></head>
<body>
<div class="header-top"><a class="volver" href="../index.html">← Volver</a><h1>👕 BLOQUE 8 - ROPA</h1></div>
<div class="sub" id="subtitulo"></div>
<div class="grid" id="grid"></div>
<div class="games">
<h2>🎮 Juegos finales</h2>
<div class="game-box"><h3>1️⃣ 🔊 Adivina por el AUDIO</h3><p id="audio-question"></p><button onclick="playGameAudio()">🔊 Escuchar</button><div id="audio-options"></div><p id="audio-result"></p><button onclick="nextAudioGame()">Siguiente ▶️</button></div>
<div class="game-box"><h3>2️⃣ 🖼️ Adivina por la IMAGEN</h3><img id="game-img" style="width:200px;height:140px;object-fit:cover;border-radius:10px;display:none"><p id="img-question"></p><div id="img-options"></div><p id="img-result"></p><button onclick="nextImgGame()">Siguiente ▶️</button></div>
</div>
<script>const IMG_BASE="https://e-r-f12.github.io/LEO-Y-APRENDO/vocabulario-realista/imagenes/bloque-8-ropa/";
const AUDIO_BASE="https://e-r-f12.github.io/LEO-Y-APRENDO/vocabulario-realista/audios/bloque-8-ropa/";
const items=[
{file:"abrigo.jpg",name:"Abrigo"},{file:"blusa.jpg",name:"Blusa"},{file:"bolso.jpg",name:"Bolso"},{file:"botas.jpg",name:"Botas"},{file:"bufanda.jpg",name:"Bufanda"},{file:"calcetines.jpg",name:"Calcetines"},{file:"camisa.jpg",name:"Camisa"},{file:"camiseta.jpg",name:"Camiseta"},{file:"cazadora.jpg",name:"Cazadora"},{file:"cinturon.jpg",name:"Cinturón"},{file:"corbata.jpg",name:"Corbata"},{file:"falda.jpg",name:"Falda"},{file:"gorra.jpg",name:"Gorra"},{file:"gorro.jpg",name:"Gorro"},{file:"guantes.jpg",name:"Guantes"},{file:"jersey.jpg",name:"Jersey"},{file:"pantalon.jpg",name:"Pantalón"},{file:"pantalon-corto.jpg",name:"Pantalón corto"},{file:"pijama.jpg",name:"Pijama"},{file:"sandalias.jpg",name:"Sandalias"},{file:"sombrero.jpg",name:"Sombrero"},{file:"sudadera.jpg",name:"Sudadera"},{file:"traje.jpg",name:"Traje"},{file:"vaqueros.jpg",name:"Vaqueros"},{file:"vestido.jpg",name:"Vestido"},{file:"zapatillas.jpg",name:"Zapatillas"},{file:"banador.jpg",name:"Bañador"}
];
document.getElementById('subtitulo').textContent=items.length+' fotos reales + '+items.length+' audios 🔊';
const grid=document.getElementById('grid');
items.forEach(it=>{
 const div=document.createElement('div');div.className='card';
 div.innerHTML=`<img src="${IMG_BASE+it.file}" loading="lazy"><h3>${it.name}</h3><button onclick="playAudio('${it.file.replace('.jpg','.mp3')}')">🔊 Escuchar</button>`;
 grid.appendChild(div);
});
function playAudio(mp3){
 const a=new Audio(AUDIO_BASE+mp3);
 a.play().catch(()=>{
   const utter=new SpeechSynthesisUtterance(mp3.replace('.mp3','').replace(/-/g,' '));
   utter.lang='es-ES';speechSynthesis.speak(utter);
 });
}
let currentAudio=null;
function nextAudioGame(){
 const rnd=items[Math.floor(Math.random()*items.length)];currentAudio=rnd;
 document.getElementById('audio-question').textContent='¿Qué prenda es?';
 document.getElementById('audio-result').textContent='';
 let opts=[...items].sort(()=>0.5-Math.random()).slice(0,4);
 if(!opts.find(o=>o.name===rnd.name)) opts[0]=rnd;
 opts.sort(()=>0.5-Math.random());
 document.getElementById('audio-options').innerHTML=opts.map(o=>`<button onclick="checkAudio('${o.name}')">${o.name}</button> `).join('');
 playGameAudio();
}
function playGameAudio(){if(currentAudio) playAudio(currentAudio.file.replace('.jpg','.mp3'))}
function checkAudio(name){
 const res=document.getElementById('audio-result');
 if(name===currentAudio.name){res.textContent='✅ ¡Correcto! Es '+currentAudio.name;res.style.color='green'}else{res.textContent='❌ Era '+currentAudio.name;res.style.color='red'}
}
nextAudioGame();
let currentImg=null;
function nextImgGame(){
 const rnd=items[Math.floor(Math.random()*items.length)];currentImg=rnd;
 document.getElementById('game-img').src=IMG_BASE+rnd.file;
 document.getElementById('game-img').style.display='inline-block';
 document.getElementById('img-question').textContent='¿Qué prenda ves?';
 document.getElementById('img-result').textContent='';
 let opts=[...items].sort(()=>0.5-Math.random()).slice(0,4);
 if(!opts.find(o=>o.name===rnd.name)) opts[0]=rnd;
 opts.sort(()=>0.5-Math.random());
 document.getElementById('img-options').innerHTML=opts.map(o=>`<button onclick="checkImg('${o.name}')">${o.name}</button> `).join('');
}
function checkImg(name){
 const res=document.getElementById('img-result');
 if(name===currentImg.name){res.textContent='✅ ¡Correcto!';res.style.color='green'}else{res.textContent='❌ Era '+currentImg.name;res.style.color='red'}
}
nextImgGame();
</script></body></html>
