<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 8 - Ropa | Leo y Aprendo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f7ff;padding:15px}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#1a5fb4;font-size:28px}
.header a{color:#1a5fb4;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1000px;margin:0 auto}
.card{background:white;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;text-align:center;padding-bottom:12px}
.card img{width:100%;height:140px;object-fit:contain;background:white;padding:10px}
.card h3{font-size:16px;margin:8px 0;color:#333;text-transform:uppercase}
.btn-audio{background:#1a5fb4;color:white;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px}
.games{max-width:1000px;margin:30px auto;background:white;border-radius:16px;padding:20px}
</style>
</head>
<body>
<div class="header">
<h1>👕 BLOQUE 8 - ROPA</h1>
<p><a href="../../index.html">← Volver al inicio</a> | 30 palabras</p>
<p style="font-size:12px;color:gray" id="debug"></p>
</div>
<div class="grid" id="grid"></div>

<script>
const palabras = ["abrigo","reloj","bañador","sombrero","blusa","sudadera","bolso","traje","bufanda","uniforme","calcetines","vaqueros","camisa","vestido","camiseta","zapatillas","cazadora","zapatos","chandal","chanclas","cinturón","pantalon","corbata","botas","falda","gafas","gorra","guantes","jersey","pijama"];
function normalizar(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ñ/g,'n').replace(/[^a-z0-9]/g,'');}

function getBases(){
 return [
  "https://e-r-f12.github.io/LEO-Y-APRENDO/vocabulario-realista/imagenes/bloque-8-ropa/",
  "https://e-r-f12.github.io/LEO-Y-APRENDO/vocabulario-realista/imagenes/bloque-8-ropa/bloque-8-ropa/",
  "../imagenes/bloque-8-ropa/",
  "../imagenes/bloque-8-ropa/bloque-8-ropa/",
  "imagenes/bloque-8-ropa/"
 ];
}
function getCandidatos(palabra){
  const bases = getBases();
  const n = palabra.toLowerCase();
  const n2 = normalizar(palabra);
  let lista=[];
  bases.forEach(b=>{
    lista.push(b+n+".jpg", b+n2+".jpg", b+n+".JPG", b+n2+".jpeg");
  });
  return lista;
}
function crearTarjeta(palabra){
  const div = document.createElement('div'); div.className='card';
  const candidatos = getCandidatos(palabra);
  const img = document.createElement('img'); img.alt=palabra;
  let idx=0; 
  function probar(){ 
    if(idx<candidatos.length){ 
      img.src=candidatos[idx++]; 
      document.getElementById('debug').textContent = 'Probando: '+img.src;
    } else { 
      img.src='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="%23eee"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">NO IMG</text></svg>'; 
    } 
  }
  img.onerror=probar; probar();
  const h3=document.createElement('h3'); h3.textContent=palabra;
  const btn=document.createElement('button'); btn.className='btn-audio'; btn.textContent='🔊 Escuchar'; btn.onclick=()=>{ const u=new SpeechSynthesisUtterance(palabra); u.lang='es-ES'; u.rate=0.8; speechSynthesis.speak(u); };
  div.appendChild(img); div.appendChild(h3); div.appendChild(btn); return div;
}
function renderGrid(){ const g=document.getElementById('grid'); palabras.forEach(p=>g.appendChild(crearTarjeta(p))); }
renderGrid();
</script>
</body>
</html>
