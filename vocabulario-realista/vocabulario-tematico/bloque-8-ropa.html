<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 8 - Ropa</title>
<style>
body{font-family:Arial,sans-serif;background:#e0f7f4;margin:0;padding:20px}
h1{color:#0a6b5e;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:1100px;margin:20px auto}
.card{background:white;border-radius:14px;padding:10px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.card img{width:100%;height:130px;object-fit:contain;background:#fff;border-radius:10px}
.card p{margin:10px 0 6px;font-weight:bold;color:#333}
button{background:#0a6b5e;color:white;border:none;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:14px}
button:hover{background:#084f45}
</style>
</head>
<body>
<h1>👕 Bloque 8 - La Ropa</h1>
<div class="grid" id="grid"></div>

<script>
const IMG_BASE="https://raw.githubusercontent.com/E-R-F12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/%20%20%20bloque-8-ropa/";
const AUDIO_BASE="https://raw.githubusercontent.com/E-R-F12/LEO-Y-APRENDO/main/vocabulario-realista/imagenes/%20%20%20bloque-8-ropa/";

const items=[
{file:"abrigo.jpg",name:"Abrigo"},
{file:"banador.jpg",name:"Bañador"},
{file:"blusa.jpg",name:"Blusa"},
{file:"bolso.jpg",name:"Bolso"},
{file:"botas.jpg",name:"Botas"},
{file:"bufanda.jpg",name:"Bufanda"},
{file:"calcetines.jpg",name:"Calcetines"},
{file:"camisa.jpg",name:"Camisa"},
{file:"camiseta.jpg",name:"Camiseta"},
{file:"cazadora.jpg",name:"Cazadora"},
{file:"chanclas.jpg",name:"Chanclas"},
{file:"chandal.jpg",name:"Chándal"},
{file:"cinturon.jpg",name:"Cinturón"},
{file:"gafas.jpg",name:"Gafas"},
{file:"gorro.jpg",name:"Gorro"},
{file:"guantes.jpg",name:"Guantes"},
{file:"jersey.jpg",name:"Jersey"},
{file:"pantalon.jpg",name:"Pantalón"},
{file:"pantalon-corto.jpg",name:"Pantalón corto"},
{file:"pijama.jpg",name:"Pijama"},
{file:"sandalias.jpg",name:"Sandalias"},
{file:"sombrero.jpg",name:"Sombrero"},
{file:"sudadera.jpg",name:"Sudadera"},
{file:"traje.jpg",name:"Traje"},
{file:"vaqueros.jpg",name:"Vaqueros"},
{file:"vestido.jpg",name:"Vestido"},
{file:"zapatillas.jpg",name:"Zapatillas"},
{file:"zapatos.jpg",name:"Zapatos"}
];

const grid=document.getElementById("grid");
items.forEach(it=>{
  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
    <img src="${IMG_BASE+it.file}" alt="${it.name}" loading="lazy" onerror="this.style.opacity=.3">
    <p>${it.name}</p>
    <button onclick="let a=new Audio('${AUDIO_BASE+it.file.replace('.jpg','.mp3')}'); a.play().catch(()=>alert('Audio no disponible'))">🔊 Escuchar</button>
  `;
  grid.appendChild(div);
});
</script>
</body>
</html>
