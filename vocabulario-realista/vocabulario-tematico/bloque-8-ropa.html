<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 8 - Ropa | Leo y Aprendo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f7ff;padding:15px}
.header{text-align:center;margin-bottom:20px}
.header h1{color:#1a5fb4;font-size:28px}
.header a{color:#1a5fb4;text-decoration:none;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1000px;margin:0 auto}
.card{background:white;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.1);overflow:hidden;text-align:center;padding-bottom:12px;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.card img{width:100%;height:140px;object-fit:contain;background:white;padding:10px}
.card h3{font-size:16px;margin:8px 0;color:#333;text-transform:uppercase}
.btn-audio{background:#1a5fb4;color:white;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:14px}
.btn-audio:hover{background:#0f4a8f}
.games{max-width:1000px;margin:30px auto;background:white;border-radius:16px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.games h2{color:#1a5fb4;margin-bottom:15px}
.game-btn{background:#ffd60a;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;margin:5px}
.game-area{margin-top:15px;min-height:120px}
.choice{display:inline-block;background:#eef5ff;border:2px solid #1a5fb4;border-radius:12px;padding:8px 12px;margin:6px;cursor:pointer}
.choice.correct{background:#c8f7c5;border-color:#2e7d32}
.choice.wrong{background:#ffcdd2;border-color:#c62828}
</style>
</head>
<body>
<div class="header">
<h1>👕 BLOQUE 8 - ROPA</h1>
<p><a href="../../index.html">← Volver al inicio</a> | 30 palabras</p>
</div>
<div class="grid" id="grid"></div>
<div class="games">
<h2>🎮 JUEGO 1: ¿Qué ropa es?</h2>
<button class="game-btn" onclick="iniciarJuego1()">¡Jugar!</button>
<div id="juego1" class="game-area"></div>
</div>
<div class="games">
<h2>🔊 JUEGO 2: Escucha y elige</h2>
<button class="game-btn" onclick="iniciarJuego2()">¡Escuchar!</button>
<div id="juego2" class="game-area"></div>
</div>
<script>
const palabras = [
"abrigo","reloj","bañador","sombrero","blusa","sudadera","bolso","traje","bufanda","uniforme",
"calcetines","vaqueros","camisa","vestido","camiseta","zapatillas","cazadora","zapatos",
"chandal","chanclas","cinturón","pantalon","corbata","botas","falda","gafas","gorra","guantes","jersey","pijama"
];
function normalizar(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ñ/g,'n').replace(/[^a-z0-9]/g,'');}
function getCandidatos(palabra){
  const base = "../imagenes/bloque-8-ropa/";
  const n = palabra.toLowerCase();
  const n2 = normalizar(palabra);
  return [
    base+n+".jpg", base+n+".jpeg", base+n+".png", base+n+".webp",
    base+n2+".jpg", base+n2+".jpeg", base+n2+".png", base+n2+".webp",
    base+n.replace(/ /g,'-')+".jpg", base+n2.replace(/ /g,'-')+".jpg"
  ];
}
function crearTarjeta(palabra){
  const div = document.createElement('div'); div.className='card';
  const candidatos = getCandidatos(palabra);
  const img = document.createElement('img'); img.alt=palabra;
  let idx=0; function probar(){ if(idx<candidatos.length){ img.src=candidatos[idx++]; } else { img.src='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><rect width="100%" height="100%" fill="%23f0f0f0"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">NO IMG</text></svg>'; } }
  img.onerror=probar; probar();
  const h3=document.createElement('h3'); h3.textContent=palabra;
  const btn=document.createElement('button'); btn.className='btn-audio'; btn.textContent='🔊 Escuchar'; btn.onclick=()=>hablar(palabra);
  div.appendChild(img); div.appendChild(h3); div.appendChild(btn); return div;
}
function hablar(texto){ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(texto); u.lang='es-ES'; u.rate=0.8; speechSynthesis.speak(u); } }
function renderGrid(){ const g=document.getElementById('grid'); palabras.forEach(p=>g.appendChild(crearTarjeta(p))); }
let actual=null;
function iniciarJuego1(){
  const cont=document.getElementById('juego1'); actual=palabras[Math.floor(Math.random()*palabras.length)];
  const opciones=[actual]; while(opciones.length<4){ const r=palabras[Math.floor(Math.random()*palabras.length)]; if(!opciones.includes(r)) opciones.push(r); } opciones.sort(()=>Math.random()-0.5);
  cont.innerHTML=`<p style="font-size:22px;font-weight:bold;margin-bottom:10px">¿Dónde está <span style="color:#1a5fb4">${actual.toUpperCase()}</span>?</p>`;
  opciones.forEach(op=>{ const d=document.createElement('div'); d.className='choice'; d.textContent=op.toUpperCase(); d.onclick=()=>{ if(op===actual){ d.classList.add('correct'); cont.innerHTML+=`<p style="margin-top:10px;color:green">¡Correcto! ✅</p>`; hablar(actual); } else { d.classList.add('wrong'); } }; cont.appendChild(d); });
}
function iniciarJuego2(){
  const cont=document.getElementById('juego2'); actual=palabras[Math.floor(Math.random()*palabras.length)]; hablar(actual);
  const opciones=[actual]; while(opciones.length<4){ const r=palabras[Math.floor(Math.random()*palabras.length)]; if(!opciones.includes(r)) opciones.push(r); } opciones.sort(()=>Math.random()-0.5);
  cont.innerHTML=`<p style="margin-bottom:10px">Escucha y elige: <button class="game-btn" onclick="hablar('${actual}')">🔊 Repetir</button></p>`;
  opciones.forEach(op=>{ const d=document.createElement('div'); d.className='choice'; d.textContent=op.toUpperCase(); d.onclick=()=>{ if(op===actual){ d.classList.add('correct'); cont.innerHTML+=`<p style="margin-top:10px;color:green">¡Muy bien! Es ${actual.toUpperCase()} ✅</p>`; } else { d.classList.add('wrong'); } }; cont.appendChild(d); });
}
renderGrid();
</script>
</body>
</html>
