<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 9 - El Cuerpo Real</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Nunito',system-ui;margin:0;background:#fdf2f8}
header{background:#db2777;color:#fff;padding:16px;text-align:center;font-weight:900;font-size:22px;position:sticky;top:0}
.wrap{max-width:1050px;margin:auto;padding:16px}
a.volver{color:#db2777;font-weight:900;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;margin-top:14px}
.card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 22px rgba(0,0,0,.12);border:2px solid #fce7f3;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#db2777}
.card img{width:100%;height:180px;object-fit:cover}
.info{padding:12px;text-align:center}
.info b{font-size:18px;display:block}
.info span{font-size:11px;color:#db2777;font-weight:900}
.btn{border:0;background:#db2777;color:#fff;border-radius:999px;padding:7px 14px;font-weight:900;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<header>🧒 Bloque 9 - El Cuerpo - Fotos reales significativas</header>
<div class="wrap">
<a class="volver" href="index.html">← Volver</a>
<div class="grid" id="grid"></div>
</div>
<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.85;speechSynthesis.speak(u);}
const data=[
{es:"La cabeza",desc:"Cabeza de niño sonriendo con chilaba azul",img:"https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=500"},
{es:"Las manos",desc:"Palmas abiertas hacia arriba",img:"https://images.unsplash.com/photo-1575658755248-66cc9d1dbaea?w=500"},
{es:"Los ojos",desc:"Ojos marrones brillantes",img:"https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=500"},
{es:"La boca",desc:"Boca sonriendo con dientes blancos",img:"https://images.unsplash.com/photo-1609220136736-443140cffec6?w=500"},
{es:"Los pies",desc:"Pies con zapatillas azules en alfombra",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{es:"El pelo",desc:"Pelo con trenzas y gomas de colores",img:"https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=500"},
{es:"La nariz",desc:"Nariz pequeña",img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500"},
{es:"Las orejas",desc:"Orejas escuchando",img:"https://images.unsplash.com/photo-1522771930-78848d9293e4?w=500"},
{es:"Los brazos",desc:"Brazos abiertos jugando",img:"https://images.unsplash.com/photo-1503454537195-1dcabb73ffb9?w=500"},
{es:"La cara",desc:"Cara feliz completa",img:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=500"},
];
const g=document.getElementById('grid');
data.forEach(d=>{
const el=document.createElement('div');el.className='card';
el.innerHTML=`<img src="${d.img}"><div class="info"><b>${d.es}</b><span>${d.desc}</span><br><button class="btn">🔊 ${d.es}</button></div>`;
el.onclick=()=>hablar(d.es);g.appendChild(el);
});
</script>
</body>
</html>
