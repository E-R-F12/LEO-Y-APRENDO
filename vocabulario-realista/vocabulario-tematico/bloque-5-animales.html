<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloque 5 - Los Animales | LEO Y APRENDO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#ECFDF5;padding:16px}
a{color:#059669;text-decoration:none;font-weight:bold}
header{text-align:center;padding:20px 10px}
header h1{font-size:32px;color:#065F46}
header p{color:#666;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;max-width:1000px;margin:20px auto}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.1);text-align:center}
.card img{width:100%;height:130px;object-fit:cover;background:#fff;padding:8px}
.card h2{font-size:19px;padding:10px 6px 0;text-transform:lowercase}
.card h2::first-letter{text-transform:uppercase}
.btns{display:flex;gap:6px;justify-content:center;padding:8px 0 14px}
.btns button{background:#059669;color:#fff;border:0;padding:7px 10px;border-radius:20px;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<a href="../">← Volver</a>
<header>
<h1>🐶 Bloque 5 - Los Animales</h1>
<p>Toca para escuchar en español. 30 palabras.</p>
</header>
<div class="grid" id="grid"></div>
<script>
function hablar(texto, lang){
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = lang; u.rate = 0.85;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function respaldo(img, emojiCode){
  img.onerror = null;
  img.src = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/"+emojiCode+".png";
  img.style.objectFit = "contain"; img.style.padding = "18px";
}
const PALABRAS = [
{es:"PERRO", img:"https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600&q=80"},
{es:"GATO", img:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600&q=80"},
{es:"CABALLO", img:"https://images.unsplash.com/photo-1553284965-83fd3e82fa5a?w=600&q=80"},
{es:"VACA", img:"https://img.icons8.com/color/240/cow.png", backup:"1f404"},
{es:"CERDO", img:"https://img.icons8.com/color/240/pig.png", backup:"1f437"},
{es:"OVEJA", img:"https://img.icons8.com/color/240/sheep.png", backup:"1f411"},
{es:"CABRA", img:"https://img.icons8.com/color/240/goat.png", backup:"1f410"},
{es:"GALLINA", img:"https://img.icons8.com/color/240/hen.png", backup:"1f414"},
{es:"GALLO", img:"https://img.icons8.com/color/240/rooster.png", backup:"1f413"},
{es:"PATO", img:"https://img.icons8.com/color/240/duck.png", backup:"1f986"},
{es:"CONEJO", img:"https://images.unsplash.com/photo-1585110396000-c9ffd4e4b308?w=600&q=80"},
{es:"RATÓN", img:"https://img.icons8.com/color/240/mouse.png", backup:"1f42d"},
{es:"PÁJARO", img:"https://images.unsplash.com/photo-1444464666168-49d633b86797?w=600&q=80"},
{es:"PEZ", img:"https://images.unsplash.com/photo-1522069169874-c58ec4b76be5?w=600&q=80"},
{es:"TORTUGA", img:"https://img.icons8.com/color/240/turtle.png", backup:"1f422"},
{es:"SERPIENTE", img:"https://img.icons8.com/color/240/snake.png", backup:"1f40d"},
{es:"LEÓN", img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=600&q=80"},
{es:"TIGRE", img:"https://images.unsplash.com/photo-1561731216-c3a4d99437d5?w=600&q=80"},
{es:"ELEFANTE", img:"https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?w=600&q=80"},
{es:"MONO", img:"https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=600&q=80"},
{es:"OSO", img:"https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?w=600&q=80"},
{es:"LOBO", img:"https://images.unsplash.com/photo-1564349683136-77e08dba1ef7?w=600&q=80"},
{es:"ZORRO", img:"https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=600&q=80"},
{es:"CIERVO", img:"https://images.unsplash.com/photo-1484406566174-9da000fda645?w=600&q=80"},
{es:"RANA", img:"https://img.icons8.com/color/240/frog.png", backup:"1f438"},
{es:"MARIPOSA", img:"https://images.unsplash.com/photo-1452570053594-1b985d6ea890?w=600&q=80"},
{es:"ABEJA", img:"https://img.icons8.com/color/240/bee.png", backup:"1f41d"},
{es:"ARAÑA", img:"https://img.icons8.com/color/240/spider.png", backup:"1f577"},
{es:"POLLITO", img:"https://img.icons8.com/color/240/chick.png", backup:"1f424"},
{es:"BURRO", img:"https://img.icons8.com/color/240/donkey.png", backup:"1f40e"},
];
const grid = document.getElementById('grid');
PALABRAS.forEach(p => {
  const d = document.createElement('div');
  d.className = 'card';
  const backupAttr = p.backup ? `onerror="respaldo(this,'${p.backup}')"` : '';
  d.innerHTML = `<img src="${p.img}" alt="${p.es}" ${backupAttr}><h2>${p.es}</h2><div class="btns"><button onclick="hablar('${p.es.toLowerCase()}','es-ES')">🔊 ESCUCHAR</button></div>`;
  grid.appendChild(d);
});
</script>
</body>
</html>
