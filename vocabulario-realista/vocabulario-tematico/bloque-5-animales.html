<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 5 - Animales</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #2c3e50; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; max-width: 1100px; margin: 30px auto; }
        .card { background: white; border-radius: 12px; padding: 10px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); cursor: pointer; transition: transform 0.2s; }
        .card:hover { transform: scale(1.05); background: #e8f8f5; }
        .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; }
        .card p { margin: 10px 0 0; font-weight: bold; text-transform: capitalize; color: #333; font-size: 18px; }
        .card:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <h1>Bloque 5 - Animales (30) 🔊</h1>
    <p style="text-align:center; color:#666;">Haz clic en cada animal para escuchar su nombre</p>
    <div class="grid">
        <div class="card" onclick="hablar('abeja')"><img src="../imagenes/bloque-5-animales/abeja.jpg"><p>Abeja</p></div>
        <div class="card" onclick="hablar('araña')"><img src="../imagenes/bloque-5-animales/arana.jpg"><p>Araña</p></div>

        <div class="card" onclick="hablar('conejo')"><img src="../imagenes/bloque-5-animales/conejo.jpg"><p>Conejo</p></div>
        <div class="card" onclick="hablar('delfín')"><img src="../imagenes/bloque-5-animales/delfin.jpg"><p>Delfín</p></div>

    </div>

<script>
function hablar(texto) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(texto);
        msg.lang = 'es-ES';
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg);
    }
}
</script>
