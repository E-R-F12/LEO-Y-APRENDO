<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO Y APRENDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f8fb;color:#1e293b;padding-bottom:40px}
header{background:white;padding:12px 3%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.logo{font-weight:900;font-size:22px;color:#1e3a8a}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{background:#f1f5f9;color:#1e3a8a;text-decoration:none;font-weight:800;font-size:11px;padding:7px 11px;border-radius:20px;border:1px solid #e2e8f0}
nav a:hover{background:#facc15}
.barra{background:#facc15;color:#1e3a8a;font-weight:900;padding:10px 14px;border-radius:8px;margin:22px 1% 10px}
.barra.sub{font-size:12px;background:#e0e7ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;padding:0 1%}
.tarjeta{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;min-height:105px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tarjeta .emoji{font-size:34px;margin-bottom:4px}
.tarjeta b{color:#c0265a}
.sep{color:#64748b;font-size:10px}
footer{background:#1e3a8a;color:white;text-align:center;padding:16px;margin-top:30px}
</style>
</head>
<body>
<header>
<div class="logo">📖 LEO Y APRENDO</div>
<nav>
<a href="#letras">🔠 LETRAS</a>
<a href="#grupos">🔤 GRUPOS</a>
<a href="#directas">🅰️ DIRECTAS</a>
<a href="#inversas">🔊 INVERSAS</a>
<a href="#palabras">📝 PALABRAS</a>
<a href="#oraciones">📖 ORACIONES</a>
</nav>
</header>

<div id="letras"><div class="barra">1. LETRAS</div><div class="grid" id="grid-letras"></div></div>
<div id="grupos"><div class="barra">2. GRUPOS VOCALICOS</div><div class="grid" id="grid-grupos"></div></div>
<div id="directas"><div class="barra">3. DIRECTAS</div><div id="grid-directas"></div></div>
<div id="inversas"><div class="barra">4. INVERSAS</div><div id="grid-inversas"></div></div>
<div id="palabras"><div class="barra">5. PALABRAS - 100 palabras</div><div id="grid-palabras"></div></div>
<div id="oraciones"><div class="barra">6. ORACIONES - 25 oraciones</div><div class="grid" id="grid-oraciones"></div></div>

<footer>https://e-r-f12.github.io/LEO-Y-APRENDO/lectoescritura/</footer>

<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}

const letras=[["A","Avion","✈️"],["E","Elefante","🐘"],["I","Iglu","🧊"],["O","Oso","🐻"],["U","Uva","🍇"],["B","Barco","🚢"],["C","Casa","🏠"],["D","Dado","🎲"],["F","Foca","🦭"],["G","Gato","🐱"],["H","Hada","🧚"],["J","Jirafa","🦒"],["K","Kiwi","🥝"],["L","Luna","🌙"],["M","Mama","👩"],["N","Nube","☁️"],["Ñ","Pina","🍍"],["P","Papa","👨"],["Q","Queso","🧀"],["R","Rosa","🌹"],["S","Sol","☀️"],["T","Taza","☕"],["V","Vaca","🐄"],["W","Waterpolo","🤽"],["X","Xilofono","🎼"],["Y","Yate","🛥️"],["Z","Zorro","🦊"]];
document.getElementById("grid-letras").innerHTML=letras.map(a=>`<div class="tarjeta" onclick="hablar('${a[1]}')"><span class="emoji">${a[2]}</span><p><b>${a[0]}</b> - ${a[1]}</p>🔊</div>`).join("");

const grupos=[["ae","aereo","✈️"],["ao","caos","🌪️"],["ea","teatro","🎭"],["eo","leon","🦁"],["oa","boa","🐍"],["oe","poeta","✍️"],["ai","aire","💨"],["au","aula","🏫"],["ei","peine","🪮"],["eu","Europa","🌍"],["ia","piano","🎹"],["ie","cielo","☁️"],["io","avion","✈️"],["iu","ciudad","🏙️"],["ua","agua","💧"],["ue","huevo","🥚"],["ui","ruido","🔊"],["uo","antiguo","🏛️"],["ay","playa","🏖️"],["ey","rey","👑"],["oy","hoy","📅"]];
document.getElementById("grid-grupos").innerHTML=grupos.map(a=>`<div class="tarjeta" onclick="hablar('${a[1]}')"><span class="emoji">${a[2]}</span><p><b>${a[0]}</b> - ${a[1]}</p>🔊</div>`).join("");

document.getElementById("grid-directas").innerHTML=[["da","dado","🎲"],["de","dedo","☝️"],["fa","foca","🦭"],["ga","gato","🐱"],["la","luna","🌙"],["ma","mama","👩"],["pa","papa","🥔"],["sa","sapo","🐸"]].map(a=>`<div class="tarjeta" onclick="hablar('${a[1]}')"><span class="emoji">${a[2]}</span><p><b>${a[0]}</b> - ${a[1]}</p>🔊</div>`).join("");
document.getElementById("grid-inversas").innerHTML=[["al","alto","⛰️"],["as","asno","🫏"],["an","ancla","⚓"],["ar","arbol","🌳"],["am","ambos","👫"],["ac","accion","🎬"]].map(a=>`<div class="tarjeta" onclick="hablar('${a[1]}')"><span class="emoji">${a[2]}</span><p><b>${a[0]}</b> - ${a[1]}</p>🔊</div>`).join("");

const palabrasPorTipo=[
{t:"A) 25 MONOSILABAS",c:"#fef9c3",l:[["sol","sol","☀️"],["pan","pan","🍞"],["luz","luz","💡"],["mar","mar","🌊"],["tren","tren","🚆"],["flor","flor","🌸"],["pez","pez","🐟"],["pie","pie","🦶"],["sal","sal","🧂"],["rey","rey","👑"],["voz","voz","🗣️"],["miel","miel","🍯"],["cruz","cruz","✝️"],["dos","dos","2️⃣"],["gol","gol","⚽"],["club","club","🏟️"],["flan","flan","🍮"],["gris","gris","⬜"],["tres","tres","3️⃣"],["seis","seis","6️⃣"],["diez","diez","🔟"],["bloc","bloc","📒"],["chef","chef","👨‍🍳"],["gas","gas","⛽"],["bus","bus","🚌"]]},
{t:"B) 25 BISILABAS",c:"#dbeafe",l:[["casa","ca-sa","🏠"],["mesa","me-sa","🪑"],["luna","lu-na","🌙"],["perro","pe-rro","🐶"],["gato","ga-to","🐱"],["papa","pa-pa","🥔"],["mama","ma-ma","👩"],["taza","ta-za","☕"],["sopa","so-pa","🍲"],["lobo","lo-bo","🐺"],["nube","nu-be","☁️"],["nido","ni-do","🪺"],["rosa","ro-sa","🌹"],["cama","ca-ma","🛏️"],["leche","le-che","🥛"],["queso","que-so","🧀"],["libro","li-bro","📚"],["lapiz","la-piz","✏️"],["arbol","ar-bol","🌳"],["nieve","nie-ve","❄️"],["playa","pla-ya","🏖️"],["barco","bar-co","🚢"],["moto","mo-to","🏍️"],["silla","si-lla","🪑"],["carro","ca-rro","🚗"]]},
{t:"C) 25 TRISILABAS",c:"#dcfce7",l:[["pelota","pe-lo-ta","⚽"],["manzana","man-za-na","🍎"],["tomate","to-ma-te","🍅"],["paloma","pa-lo-ma","🕊️"],["camisa","ca-mi-sa","👕"],["ventana","ven-ta-na","🪟"],["caballo","ca-ba-llo","🐴"],["cuchara","cu-cha-ra","🥄"],["familia","fa-mi-lia","👨‍👩‍👧‍👦"],["cometa","co-me-ta","🪁"],["estrella","es-tre-lla","⭐"],["jirafa","ji-ra-fa","🦒"],["helado","he-la-do","🍦"],["cascada","cas-ca-da","🌊"],["pintura","pin-tu-ra","🎨"],["guitarra","gui-ta-rra","🎸"],["mochila","mo-chi-la","🎒"],["tortuga","tor-tu-ga","🐢"],["pescado","pes-ca-do","🐟"],["medico","me-di-co","👨‍⚕️"],["pajaro","pa-ja-ro","🐦"],["circulo","cir-cu-lo","⭕"],["platano","pla-ta-no","🍌"],["naranja","na-ran-ja","🍊"],["zapato","za-pa-to","👟"]]},
{t:"D) 25 POLISILABAS",c:"#fce7f3",l:[["mariposa","ma-ri-po-sa","🦋"],["bicicleta","bi-ci-cle-ta","🚲"],["elefante","e-le-fan-te","🐘"],["chocolate","cho-co-la-te","🍫"],["caramelo","ca-ra-me-lo","🍬"],["murcielago","mur-cie-la-go","🦇"],["hipopotamo","hi-po-po-ta-mo","🦛"],["cocodrilo","co-co-dri-lo","🐊"],["universidad","u-ni-ver-si-dad","🎓"],["supermercado","su-per-mer-ca-do","🛒"],["semaforo","se-ma-fo-ro","🚦"],["computadora","com-pu-ta-do-ra","💻"],["helicoptero","he-li-cop-te-ro","🚁"],["ambulancia","am-bu-lan-cia","🚑"],["telescopio","te-les-co-pio","🔭"],["microscopio","mi-cros-co-pio","🔬"],["escalera","es-ca-le-ra","🪜"],["calabaza","ca-la-ba-za","🎃"],["zanahoria","za-na-ho-ria","🥕"],["oruga","o-ru-ga","🐛"],["carniceria","car-ni-ce-ri-a","🥩"],["panaderia","pa-na-de-ri-a","🥖"],["ferrocarril","fe-rro-ca-rril","🚃"],["paraguas","pa-ra-guas","☂️"],["biblioteca","bi-blio-te-ca","📚"]]}
];
let htmlP="";
palabrasPorTipo.forEach(b=>{htmlP+=`<div class="barra sub" style="background:${b.c}">${b.t}</div><div class="grid">`;b.l.forEach(x=>{htmlP+=`<div class="tarjeta" onclick="hablar('${x[0]}')"><span class="emoji">${x[2]}</span><p><b>${x[0]}</b></p><p class="sep">${x[1]}</p>🔊</div>`});htmlP+=`</div>`});
document.getElementById("grid-palabras").innerHTML=htmlP;

// 6. ORACIONES - VUELTA A COMO ESTABA ANTES, SIMPLE CON AUDIO
const oracionesLista=[
{texto:"Mama ama la casa",sep:"ma-ma a-ma la ca-sa",emoji:"👩🏠"},
{texto:"El sol brilla mucho",sep:"el sol bri-lla mu-cho",emoji:"☀️✨"},
{texto:"Mi perro corre rapido",sep:"mi pe-rro co-rre ra-pi-do",emoji:"🐶💨"},
{texto:"La luna sale de noche",sep:"la lu-na sa-le de no-che",emoji:"🌙🌃"},
{texto:"Papa lee el libro",sep:"pa-pa le-e el li-bro",emoji:"👨📚"},
{texto:"La gata duerme en la cama",sep:"la ga-ta duer-me en la ca-ma",emoji:"🐱🛏️"},
{texto:"El barco navega en el mar",sep:"el bar-co na-ve-ga en el mar",emoji:"🚢🌊"},
{texto:"La flor huele muy bien",sep:"la flor hue-le muy bien",emoji:"🌸👃"},
{texto:"Mi bici es de color azul",sep:"mi bi-ci es de co-lor a-zul",emoji:"🚲💙"},

{texto:"La mariposa vuela feliz",sep:"la ma-ri-po-sa vue-la fe-liz",emoji:"🦋"},

{texto:"Escucho musica con guitarra",sep:"es-cu-cho mu-si-ca con gui-ta-rra",emoji:"🎸"}
];

document.getElementById("grid-oraciones").innerHTML=oracionesLista.map(o=>`
<div class="tarjeta" style="min-height:130px" onclick="hablar('${o.texto}')">
<span class="emoji">${o.emoji}</span>
<p style="font-size:13px"><b>${o.texto}</b></p>
<p class="sep">${o.sep}</p>
🔊
</div>`).join("");
</script>
</body>
</html>
