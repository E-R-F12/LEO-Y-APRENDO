<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEO Y APRENDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#f6f8fb;color:#1e293b}
header{background:white;padding:12px 4%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:99}
.logo{font-weight:900;font-size:24px;color:#1e3a8a}
.barra{background:#facc15;color:#1e3a8a;font-weight:900;padding:10px 14px;border-radius:8px;margin:22px 0 12px}
.barra.sub{background:#e0e7ff;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.tarjeta{background:white;border-radius:12px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;min-height:85px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.tarjeta b{color:#c0265a}
.tarjeta .emoji{font-size:36px!important;display:block!important;line-height:1;margin-bottom:6px;visibility:visible!important;opacity:1!important}
.tarjeta img.icono{width:50px;height:50px;object-fit:contain;display:none;margin-bottom:4px}
.tarjeta p{font-size:13px;margin-top:2px}
</style>
</head>
<body>

<div id="letras" class="section"><div class="barra">1. LETRAS</div><div class="grid" id="grid-letras"></div></div>
<div id="grupos" class="section"><div class="barra">2. GRUPOS VOCÁLICOS - ae ao ea eo oa oe ai au ei eu ia ie io iu ua ue ui ay ey oy</div><div class="grid" id="grid-grupos"></div></div>
<div id="directas" class="section"><div class="barra">3. SÍLABAS DIRECTAS - TODAS</div><div id="grid-directas"></div></div>
<div id="inversas" class="section"><div class="barra">4. SÍLABAS INVERSAS - 50 palabras CON ICONO</div><div id="grid-inversas"></div></div>

<script>
function hablar(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=0.9;speechSynthesis.speak(u);}

document.getElementById("grid-letras").innerHTML=[["A","Avión","✈️"],["E","Elefante","🐘"],["I","Iglú","🧊"],["O","Oso","🐻"],["U","Uva","🍇"],["B","Barco","🚢"],["C","Casa","🏠"],["D","Dado","🎲"],["F","Foca","🦭"],["G","Gato","🐱"]].map(([l,pal,em])=>`<div class="tarjeta" onclick="hablar('${pal}')"><div class="emoji">${em}</div><p><b>${l}</b> - ${pal}</p>🔊</div>`).join("");

document.getElementById("grid-grupos").innerHTML=[["ae","aéreo","✈️"],["ao","caos","🌪️"],["ea","teatro","🎭"],["eo","león","🦁"],["oa","boa","🐍"],["oe","poeta","✍️"],["ai","aire","💨"],["au","aula","🏫"],["ei","peine","🪮"],["eu","Europa","🌍"],["ia","piano","🎹"],["ie","cielo","☁️"],["io","avión","✈️"],["iu","ciudad","🏙️"],["ua","agua","💧"],["ue","huevo","🥚"],["ui","ruido","🔊"],["uo","antiguo","🏛️"],["ay","playa","🏖️"],["ey","rey","👑"],["oy","hoy","📅"]].map(([g,pal,em])=>`<div class="tarjeta" onclick="hablar('${pal}')"><div class="emoji">${em}</div><img class="icono" src="./imagenes/iconos/vocalicos/${pal}.png" onload="this.style.display='block';this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"><p><b>${g}</b> - ${pal}</p>🔊</div>`).join("");

const directas=[
{title:"B - ba be bi bo bu", items:[["ba","barco","🚢"],["be","bebé","👶"],["bi","bici","🚲"],["bo","bola","⚽"],["bu","burro","🫏"]]},
{title:"C - ca ce ci co cu + que qui", items:[["ca","casa","🏠"],["ce","cena","🍝"],["ci","cine","🎬"],["co","cola","🥤"],["cu","cuna","🍼"],["que","queso","🧀"],["qui","quitar","🗑️"]]},
{title:"D - da de di do du", items:[["da","dado","🎲"],["de","dedo","☝️"],["di","día","☀️"],["do","domingo","📅"],["du","duende","🧝"]]},
{title:"F - fa fe fi fo fu", items:[["fa","foca","🦭"],["fe","feo","🤪"],["fi","fiesta","🎉"],["fo","foco","💡"],["fu","fuego","🔥"]]},
{title:"G - ga ge gi go gu + gue gui", items:[["ga","gato","🐱"],["ge","genio","🧞"],["gi","gigante","👹"],["go","gorro","🧢"],["gu","guante","🧤"],["gue","guerra","⚔️"],["gui","guitarra","🎸"]]},
{title:"H - ha he hi ho hu", items:[["ha","hada","🧚"],["he","helado","🍦"],["hi","hilo","🧵"],["ho","hola","👋"],["hu","huevo","🥚"]]},
{title:"J - ja je ji jo ju", items:[["ja","jaula","🗝️"],["je","jefe","👨‍💼"],["ji","jirafa","🦒"],["jo","joya","💎"],["ju","juguete","🧸"]]},
{title:"L - la le li lo lu", items:[["la","luna","🌙"],["le","leche","🥛"],["li","lima","🍋"],["lo","lobo","🐺"],["lu","lupa","🔍"]]},
{title:"M - ma me mi mo mu", items:[["ma","mamá","👩"],["me","mesa","🪑"],["mi","mimo","🤗"],["mo","moto","🏍️"],["mu","mula","🐴"]]},
];
let htmlD=""; directas.forEach(b=>{ htmlD+=`<div class="barra sub">${b.title}</div><div class="grid">`; b.items.forEach(([sil,pal,em])=>{ htmlD+=`<div class="tarjeta" onclick="hablar('${pal}')"><div class="emoji">${em}</div><p><b>${sil}</b> - ${pal}</p>🔊</div>`; }); htmlD+=`</div>`; });
document.getElementById("grid-directas").innerHTML=htmlD;

// 4. INVERSAS - ESTA ES LA QUE TE FALLA EN LA CAPTURA - AHORA CON EMOJI FORZADO
const inv=[
{t:"Con M: AM EM IM OM UM", d:[["am","ambos","👫"],["em","empezar","🏁"],["im","imperio","👑"],["om","ombligo","🫃"],["um","rumbo","🧭"]]},
{t:"Con C: AC EC IC OC UC", d:[["ac","acción","🎬"],["ec","lección","📚"],["ic","ficción","👽"],["oc","octubre","🍂"],["uc","conducir","🚗"]]},
{t:"Con Z: AZ EZ IZ OZ UZ", d:[["az","azteca","🛕"],["ez","lezna","🪡"],["iz","dizque","💬"],["oz","gozne","🚪"],["uz","juzgar","⚖️"]]},
{t:"Con D: AD ED ID OD UD", d:[["ad","admirar","😍"],["ed","edad","🎂"],["id","idear","💡"],["od","odio","💔"],["ud","sudar","💦"]]},
{t:"Con B: AB EB IB OB UB", d:[["ab","abdomen","🫃"],["eb","hebreo","📖"],["ib","ibérico","🍖"],["ob","objeto","📦"],["ub","subterráneo","🚇"]]},
{t:"Con L: AL EL IL OL UL", d:[["al","alto","⛰️"],["el","papel","📄"],["il","mil","💰"],["ol","soldado","🪖"],["ul","último","🏁"]]},
{t:"Con S: AS ES IS OS US", d:[["as","asno","🫏"],["es","estrella","⭐"],["is","isla","🏝️"],["os","oscuro","🌑"],["us","usted","🧑"]]},
{t:"Con N: AN EN IN ON UN", d:[["an","ancla","⚓"],["en","antena","📡"],["in","invierno","❄️"],["on","rótula","🦵"],["un","ayuntamiento","🏛️"]]},
{t:"Con R: AR ER IR OR UR", d:[["ar","árbol","🌳"],["er","tuerca","🔩"],["ir","irse","🚶"],["or","orca","🐋"],["ur","urgencia","🚑"]]},
{t:"Con X: AX EX IX OX UX", d:[["ax","axila","💪"],["ex","extraño","👾"],["ix","mixto","🔀"],["ox","óxido","🔧"],["ux","flux","🌊"]]},
];
let htmlI=""; inv.forEach(b=>{ htmlI+=`<div class="barra sub" style="background:#fef9c3">${b.t}</div><div class="grid">`; b.d.forEach(([sil,pal,em])=>{ htmlI+=`<div class="tarjeta" onclick="hablar('${pal}')"><div class="emoji">${em}</div><img class="icono" src="./imagenes/iconos/inversas/${pal}.png" onload="this.style.display='block';this.previousElementSibling.style.display='none'" onerror="this.style.display='none'"><p><b>${sil}</b> - ${pal}</p>🔊</div>`; }); htmlI+=`</div>`; });
document.getElementById("grid-inversas").innerHTML=htmlI;
</script>
</body>
</html>
