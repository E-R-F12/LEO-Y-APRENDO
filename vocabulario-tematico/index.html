<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VOCABULARIO REALISTA 3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;font-family:'Nunito',system-ui;background:#fff6f9;color:#333}header{background:linear-gradient(90deg,#6c5ce7,#e8438a);color:#fff;padding:18px;text-align:center;font-size:26px;font-weight:900;position:sticky;top:0;z-index:20}.badge{background:#fff;color:#e8438a;padding:4px 10px;border-radius:20px;font-size:14px;margin-left:8px}.search-card{background:#fff;border-radius:20px;padding:16px;margin:12px auto;max-width:1200px;box-shadow:0 8px 24px rgba(0,0,0,.08);text-align:center}#vocBuscador{width:100%;padding:18px;border-radius:16px;border:3px solid #ffbdd7;font-size:22px;font-weight:800;text-align:center;outline:none}.btn{border:0;padding:12px 18px;border-radius:16px;font-weight:900;cursor:pointer;font-family:'Nunito';font-size:16px}.btn-pink{background:#e8438a;color:#fff}.btn-green{background:#00b894;color:#fff}.btn-light{background:#fff0f6;color:#e8438a;border:2px solid #ffbdd7}.subtabs{display:flex;overflow-x:auto;gap:8px;padding:10px;background:#fff;position:sticky;top:64px;z-index:15;border-bottom:3px solid #ffe0ec}.subtabs button{border:0;background:#fff0f6;padding:12px 16px;border-radius:20px;font-weight:900;color:#e8438a;border:2px solid #ffbdd7;white-space:nowrap;cursor:pointer}.subtabs button.activo{background:#e8438a;color:#fff;border-color:#e8438a}.card{background:#fff;border-radius:24px;padding:18px;margin:12px auto;max-width:1200px;box-shadow:0 12px 30px rgba(0,0,0,.08);text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.item{border:2px solid #ffe0ec;border-radius:18px;padding:10px;background:#fff;cursor:pointer}.item.activo{border-color:#e8438a;background:#fff0f6;transform:scale(1.05)}.item img.real{width:100%;height:90px;object-fit:cover;border-radius:12px;margin-bottom:6px}.word{border:3px solid #e8438a;background:#fff;color:#e8438a;padding:12px 16px;border-radius:16px;font-weight:900;font-size:22px;cursor:grab}.drop{width:140px;min-height:80px;border:4px dashed #ffbdd7;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#6c5ce7;background:#fff;font-size:26px}.letra-big{font-size:68px;font-weight:900;line-height:1}.letra-big.ligada{font-family:'Dancing Script',cursive}.hero{width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-bottom:12px;border:3px solid #ffe0ec}</style></head><body>
<header>📚 VOCABULARIO REALISTA 3.0 <span class="badge">FOTOS REALES</span></header>
<div class="search-card"><input id="vocBuscador" placeholder="🔍 Buscar: euro real, hora, calendario, ropa, comida..." oninput="filtrarVocab()"><div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn btn-light" onclick="clearBuscador()">❌ Borrar</button><button class="btn btn-pink" onclick="vocabRandom()">🎲 Aleatoria</button></div><div id="contador" style="margin-top:8px;font-weight:900;color:#6c5ce7"></div></div>
<div class="subtabs" id="subtabs"></div>
<div class="card"><img id="heroImg" class="hero" style="display:none"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><button class="btn btn-light" style="width:56px;height:56px;border-radius:50%;font-size:24px" onclick="vocabNav(-1)">⬅️</button><div style="flex:1"><div id="vocImgWrap"><img id="vocImgReal" style="width:260px;height:180px;object-fit:cover;border-radius:18px;border:3px solid #ffe0ec;display:none;margin:0 auto"><div id="vocEmoji" style="font-size:110px;line-height:1">💶</div></div><div id="vocPalabra" class="letra-big ligada">euro</div><div id="vocSil" style="color:#6c5ce7;font-size:28px;font-weight:800;margin-top:4px"></div><div id="vocFrase" style="color:#ff8f5a;font-size:26px;font-weight:700;margin-top:6px"></div></div><button class="btn btn-light" style="width:56px;height:56px;border-radius:50%;font-size:24px" onclick="vocabNav(1)">➡️</button></div><button class="btn btn-green" style="margin-top:16px;padding:16px 28px;font-size:20px" onclick="hablarVocab()">🔊 Escuchar</button><div id="vocPool" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0;min-height:60px;padding:14px;background:#fff0f6;border-radius:18px;border:2px dashed #ffbdd7"></div><div id="vocDrop" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0"></div><button class="btn btn-pink" style="padding:14px 24px;font-size:18px" onclick="comprobarVocab()">Comprobar ✅</button><div id="vocMsg" style="font-weight:900;margin-top:10px;font-size:24px"></div></div><div class="card"><div class="grid" id="gridVocab"></div></div><script>
const IMG_EUROS="https://images.unsplash.com/photo-1621761191319-c6fb62004040?w=600";
const IMG_BILLETES="https://images.unsplash.com/photo-1580519542036-c47de6196ba5?w=600";
const IMG_CLOCK="https://images.unsplash.com/photo-1508962914676-134849a727f0?w=600";
const IMG_CAL="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=600";
const IMG_ROPA="https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=600";
const IMG_COMIDA="https://images.unsplash.com/photo-1542838132-92c53300491e?w=600";const VOCAB_TEMATICO={
"EL DINERO Y EL EURO":[
{p:"euro",e:"💶",img:IMG_EUROS,sil:["eu","ro"],s:"Un euro vale - moneda real",ej:"eu-ro"},
{p:"un euro",e:"🪙",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3c/1_euro_coin_common_side.jpg/320px-1_euro_coin_common_side.jpg",sil:["un","eu","ro"],s:"Moneda real de 1 euro",ej:"un eu-ro"},
{p:"dos euros",e:"🪙",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9c/2_euro_coin_common_side.jpg/320px-2_euro_coin_common_side.jpg",sil:["dos","eu","ros"],s:"Moneda real de 2 euros",ej:"dos eu-ros"},
{p:"céntimo",e:"🪙",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/1_cent_euro_coin_common_side.jpg/320px-1_cent_euro_coin_common_side.jpg",sil:["cén","ti","mo"],s:"Moneda de 1 céntimo real",ej:"cén-ti-mo"},
{p:"cinco céntimos",e:"🪙",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2e/5_cent_euro_coin_common_side.jpg/320px-5_cent_euro_coin_common_side.jpg",sil:["cin","co","cén","ti","mos"],s:"5 céntimos reales",ej:"cin-co cén-ti-mos"},
{p:"cinco euros",e:"💶",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/5_euro_banknote_2013_obverse.jpg/400px-5_euro_banknote_2013_obverse.jpg",sil:["cin","co","eu","ros"],s:"Billete real de 5 euros",ej:"cin-co eu-ros"},
{p:"diez euros",e:"💶",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/10_euro_banknote_2014_obverse.jpg/400px-10_euro_banknote_2014_obverse.jpg",sil:["diez","eu","ros"],s:"Billete real de 10 euros",ej:"diez eu-ros"},
{p:"veinte euros",e:"💶",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/20_euro_banknote_2015_obverse.jpg/400px-20_euro_banknote_2015_obverse.jpg",sil:["vein","te","eu","ros"],s:"Billete real de 20 euros",ej:"vein-te eu-ros"},
{p:"cincuenta euros",e:"💶",img:"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f0/50_euro_banknote_2017_obverse.jpg/400px-50_euro_banknote_2017_obverse.jpg",sil:["cin","cuen","ta","eu","ros"],s:"Billete real de 50 euros",ej:"cin-cuen-ta eu-ros"},
{p:"cartera",e:"👛",img:IMG_EUROS,sil:["car","te","ra"],s:"Mi cartera guarda euros reales",ej:"car-te-ra"}
],
"LA HORA":[
{p:"hora",e:"🕐",img:IMG_CLOCK,sil:["ho","ra"],s:"Reloj analógico real - qué hora es",ej:"ho-ra"},
{p:"reloj de pared",e:"🕐",img:"https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?w=600",sil:["re","loj","de","pa","red"],s:"Reloj de pared real marca las horas",ej:"re-loj de pa-red"},
{p:"en punto",e:"🕐",img:IMG_CLOCK,sil:["en","pun","to"],s:"Reloj real: las dos en punto",ej:"en pun-to"},
{p:"y media",e:"🕧",img:"https://images.unsplash.com/photo-1507646227500-4d389b0012be?w=600",sil:["y","me","dia"],s:"Reloj real: dos y media",ej:"y me-dia"},
{p:"despertador",e:"⏰",img:"https://images.unsplash.com/photo-1495360010541-f48722b34f7d?w=600",sil:["des","per","ta","dor"],s:"Despertador real suena",ej:"des-per-ta-dor"}
],
"DÍAS-SEMANAS-MESES DEL AÑO":[
{p:"calendario",e:"📅",img:IMG_CAL,sil:["ca","len","da","rio"],s:"Calendario real 2026 con meses",ej:"ca-len-da-rio"},
{p:"lunes",e:"📅",img:IMG_CAL,sil:["lu","nes"],s:"Lunes - primer día de la semana",ej:"lu-nes"},
{p:"enero",e:"❄️",img:"https://images.unsplash.com/photo-1491002052546-bf38f186af56?w=600",sil:["e","ne","ro"],s:"Enero con nieve real",ej:"e-ne-ro"},
{p:"abril",e:"🌧️",img:"https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=600",sil:["a","bril"],s:"Abril con lluvia real",ej:"a-bril"},
{p:"agosto",e:"☀️",img:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600",sil:["a","gos","to"],s:"Agosto playa real",ej:"a-gos-to"},
{p:"cumpleaños",e:"🎂",img:"https://images.unsplash.com/photo-1530103862676-de8c9debad1d?w=600",sil:["cum","ple","a","ños"],s:"Tarta de cumple real",ej:"cum-ple-a-ños"}
],
"LA ROPA MASCULINA Y FEMENINA":[
{p:"camisa",e:"👔",img:"https://images.unsplash.com/photo-1603252109303-2751441dd157?w=600",sil:["ca","mi","sa"],s:"Camisa blanca real",ej:"ca-mi-sa"},
{p:"vestido",e:"👗",img:"https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600",sil:["ves","ti","do"],s:"Vestido rojo real",ej:"ves-ti-do"},
{p:"pantalón",e:"👖",img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=600",sil:["pan","ta","lón"],s:"Pantalón vaquero real",ej:"pan-ta-lón"},
{p:"zapato",e:"👟",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600",sil:["za","pa","to"],s:"Zapato deportivo real",ej:"za-pa-to"},
{p:"abrigo",e:"🧥",img:"https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=600",sil:["a","bri","go"],s:"Abrigo de invierno real",ej:"a-bri-go"}
],
"LA COMIDA":[
{p:"pan",e:"🍞",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600",sil:["pan"],s:"Pan artesano real",ej:"pan"},
{p:"paella",e:"🥘",img:"https://images.unsplash.com/photo-1534080564583-6be75777b70a?w=600",sil:["pa","e","lla"],s:"Paella valenciana real",ej:"pa-e-lla"},
{p:"jamón",e:"🍖",img:"https://images.unsplash.com/photo-1544025162-d76694265947?w=600",sil:["ja","món"],s:"Jamón ibérico real",ej:"ja-món"},
{p:"pizza",e:"🍕",img:"https://images.unsplash.com/photo-1513104890138-7c749659a591?w=600",sil:["pi","zza"],s:"Pizza real con queso",ej:"pi-zza"},
{p:"ensalada",e:"🥗",img:"https://images.unsplash.com/photo-1512621776952-a57141f2eefd?w=600",sil:["en","sa","la","da"],s:"Ensalada fresca real",ej:"en-sa-la-da"}
],
"FRUTAS Y VERDURAS":[
{p:"manzana",e:"🍎",img:"https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=600",sil:["man","za","na"],s:"Manzana roja real del árbol",ej:"man-za-na"},
{p:"naranja",e:"🍊",img:"https://images.unsplash.com/photo-1557800636-894a64c1696f?w=600",sil:["na","ran","ja"],s:"Naranja real jugosa",ej:"na-ran-ja"},
{p:"plátano",e:"🍌",img:"https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600",sil:["plá","ta","no"],s:"Plátano amarillo real",ej:"plá-ta-no"},
{p:"tomate",e:"🍅",img:"https://images.unsplash.com/photo-1592924357228-91a4daadcfea?w=600",sil:["to","ma","te"],s:"Tomate rojo real de huerta",ej:"to-ma-te"},
{p:"brócoli",e:"🥦",img:"https://images.unsplash.com/photo-1459411621453-7b03977f4bfc?w=600",sil:["bró","co","li"],s:"Brócoli verde real",ej:"bró-co-li"}
]
};

function normaliza(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}
let temaActual='EL DINERO Y EL EURO',vocabActual=null,filtro='';
function initSubtabs(){let c=document.getElementById('subtabs');c.innerHTML='';let t=document.createElement('button');t.textContent='🔍 TODOS';t.id='sub_TODOS';t.onclick=()=>setTema('TODOS');c.appendChild(t);Object.keys(VOCAB_TEMATICO).forEach(k=>{let b=document.createElement('button');b.textContent=k;let safe=k.replace(/\s+/g,'_').replace(/[^\w_]/g,'');b.id='sub_'+safe;b.onclick=()=>setTema(k);c.appendChild(b);});}
function setTema(t){temaActual=t;document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('activo'));let id=t==='TODOS'?'sub_TODOS':'sub_'+t.replace(/\s+/g,'_').replace(/[^\w_]/g,'');document.getElementById(id)?.classList.add('activo');render();let l=t==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[t];if(l&&l[0])mostrar(l[0].p);
let hero=document.getElementById('heroImg');if(t==='EL DINERO Y EL EURO'){hero.src=IMG_BILLETES;hero.style.display='block';}else if(t==='LA HORA'){hero.src=IMG_CLOCK;hero.style.display='block';}else if(t==='DÍAS-SEMANAS-MESES DEL AÑO'){hero.src=IMG_CAL;hero.style.display='block';}else if(t==='LA COMIDA'||t==='FRUTAS Y VERDURAS'){hero.src=IMG_COMIDA;hero.style.display='block';}else if(t==='LA ROPA MASCULINA Y FEMENINA'){hero.src=IMG_ROPA;hero.style.display='block';}else{hero.style.display='none';}
}
function clearBuscador(){document.getElementById('vocBuscador').value='';filtro='';render();}
function filtrarVocab(){filtro=document.getElementById('vocBuscador').value.trim();render();}
function render(){let g=document.getElementById('gridVocab');g.innerHTML='';let lista=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];if(filtro){let f=normaliza(filtro);lista=Object.values(VOCAB_TEMATICO).flat().filter(x=>normaliza(x.p).includes(f)||normaliza(x.s).includes(f));document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('activo'));document.getElementById('sub_TODOS')?.classList.add('activo');}document.getElementById('contador').textContent=lista.length+' palabras REALES encontradas';lista.slice(0,200).forEach(it=>{let d=document.createElement('div');d.className='item'+(vocabActual&&vocabActual.p===it.p?' activo':'');d.innerHTML=`${it.img?`<img class="real" src="${it.img}">`:`<span style="font-size:34px">${it.e}</span>`}<div style="font-weight:900;color:#e8438a;font-size:14px">${it.p}</div><div style="font-size:10px;color:#6c5ce7">${it.ej}</div>`;d.onclick=()=>mostrar(it.p);g.appendChild(d);});}
function mostrar(p){let it=Object.values(VOCAB_TEMATICO).flat().find(x=>x.p===p);if(!it)return;vocabActual=it;let e=document.getElementById('vocEmoji');let ir=document.getElementById('vocImgReal');if(it.img){e.style.display='none';ir.src=it.img;ir.style.display='block';}else{e.style.display='block';ir.style.display='none';e.textContent=it.e;}document.getElementById('vocPalabra').textContent=it.p;document.getElementById('vocSil').textContent=it.sil.join(' - ')+' • '+it.ej;document.getElementById('vocFrase').textContent=it.s;let pool=document.getElementById('vocPool');pool.innerHTML='';[...it.sil].sort(()=>Math.random()-0.5).forEach(s=>{let d=document.createElement('div');d.className='word';d.textContent=s;d.dataset.sil=s.toLowerCase();d.draggable=true;d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',s.toLowerCase()));d.addEventListener('click',()=>{let empty=[...document.querySelectorAll('#vocDrop div')].find(b=>!b.dataset.filled);if(empty){empty.textContent=d.textContent;empty.dataset.filled=d.textContent.toLowerCase();d.style.visibility='hidden';}});pool.appendChild(d);});let drop=document.getElementById('vocDrop');drop.innerHTML='';it.sil.forEach(s=>{let b=document.createElement('div');b.className='drop';b.dataset.expected=s.toLowerCase();b.textContent='?';b.addEventListener('dragover',e=>e.preventDefault());b.addEventListener('drop',e=>{e.preventDefault();let txt=e.dataTransfer.getData('text/plain');b.textContent=txt;b.dataset.filled=txt;});b.addEventListener('click',()=>{if(b.dataset.filled){let w=[...document.querySelectorAll('#vocPool.word')].find(x=>x.dataset.sil===b.dataset.filled);if(w)w.style.visibility='visible';b.textContent='?';delete b.dataset.filled;}});drop.appendChild(b);});document.getElementById('vocMsg').textContent='';}
function hablarVocab(){if(!vocabActual)return;let u=new SpeechSynthesisUtterance(vocabActual.p+'. '+vocabActual.s);u.lang='es-ES';u.rate=0.55;speechSynthesis.speak(u);}
function comprobarVocab(){let drops=[...document.querySelectorAll('#vocDrop div')];let ok=drops.length>0&&drops.every(b=>b.dataset.filled&&b.dataset.filled===b.dataset.expected);let msg=document.getElementById('vocMsg');msg.textContent=ok?'¡Perfecto! 🎉':'Sigue intentando 👀';msg.style.color=ok?'#00b894':'#e8438a';if(ok)setTimeout(()=>hablarVocab(),400);}
function vocabNav(d){let l=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];if(filtro){let f=normaliza(filtro);l=Object.values(VOCAB_TEMATICO).flat().filter(x=>normaliza(x.p).includes(f)||normaliza(x.s).includes(f));}let i=l.findIndex(x=>x.p===vocabActual.p);mostrar(l[(i+d+l.length)%l.length].p);}
function vocabRandom(){let l=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];if(filtro){let f=normaliza(filtro);l=Object.values(VOCAB_TEMATICO).flat().filter(x=>normaliza(x.p).includes(f)||normaliza(x.s).includes(f));}mostrar(l[Math.floor(Math.random()*l.length)].p);}
initSubtabs();setTema('EL DINERO Y EL EURO');
</script></body></html>
