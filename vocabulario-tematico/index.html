.btn-pink{background:#e8438a;color:#fff}.btn-green{background:#00b894;color:#fff}.btn-light{background:#fff0f6;color:#e8438a;border:2px solid #ffbdd7}

.subtabs button.activo{background:#e8438a;color:#fff;border-color:#e8438a}
.card{background:#fff;border-radius:24px;padding:18px;margin:12px auto;max-width:1200px;box-shadow:0 12px 30px rgba(0,0,0,.08);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{border:2px solid #ffe0ec;border-radius:18px;padding:10px;background:#fff;cursor:pointer}
.item.activo{border-color:#e8438a;background:#fff0f6;transform:scale(1.05)}
.word{border:3px solid #e8438a;background:#fff;color:#e8438a;padding:12px 16px;border-radius:16px;font-weight:900;font-size:22px;cursor:grab}
.drop{width:140px;min-height:80px;border:4px dashed #ffbdd7;border-radius:18px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#6c5ce7;background:#fff;font-size:26px}

};let temaActual='MI FAMILIA', vocabActual=null, filtro='';
function initSubtabs(){
 let c=document.getElementById('subtabs'); c.innerHTML='';
 let t=document.createElement('button'); t.textContent='🔍 TODOS (450)'; t.id='sub_TODOS'; t.onclick=()=>setTema('TODOS'); c.appendChild(t);
 Object.keys(VOCAB_TEMATICO).forEach(k=>{
  let b=document.createElement('button'); b.textContent=k;
  let safe=k.replace(/\s+/g,'_').replace(/[^\w_]/g,'');
  b.id='sub_'+safe; b.onclick=()=>setTema(k); c.appendChild(b);
 });
}
function setTema(t){
 temaActual=t;
 document.querySelectorAll('.subtabs button').forEach(b=>b.classList.remove('activo'));
 let id=t==='TODOS'?'sub_TODOS':'sub_'+t.replace(/\s+/g,'_').replace(/[^\w_]/g,'');
 document.getElementById(id)?.classList.add('activo');
 render();
 let l=t==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[t];
 if(l && l[0]) mostrar(l[0].p);
}
function clearBuscador(){document.getElementById('vocBuscador').value='';filtro='';render();}
function filtrarVocab(){filtro=document.getElementById('vocBuscador').value.toLowerCase().trim();render();}
function render(){
 let g=document.getElementById('gridVocab'); g.innerHTML='';
 let lista=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];
 if(filtro) lista=lista.filter(x=>x.p.toLowerCase().includes(filtro)||x.s.toLowerCase().includes(filtro));
 document.getElementById('contador').textContent=lista.length+' palabras encontradas';
 lista.slice(0,200).forEach(it=>{
  let d=document.createElement('div'); d.className='item'+(vocabActual&&vocabActual.p===it.p?' activo':'');
  d.innerHTML=`<span style="font-size:34px">${it.e}</span><div style="font-weight:900;color:#e8438a;font-size:14px">${it.p}</div><div style="font-size:10px;color:#6c5ce7">${it.ej}</div>`;
  d.onclick=()=>mostrar(it.p); g.appendChild(d);
 });
}
function mostrar(p){
 let it=Object.values(VOCAB_TEMATICO).flat().find(x=>x.p===p); if(!it) return;
 vocabActual=it;
 document.getElementById('vocEmoji').textContent=it.e;
 document.getElementById('vocPalabra').textContent=it.p;
 document.getElementById('vocSil').textContent=it.sil.join(' - ')+' • '+it.ej;
 document.getElementById('vocFrase').textContent=it.s;
 let pool=document.getElementById('vocPool'); pool.innerHTML='';
 [...it.sil].sort(()=>Math.random()-0.5).forEach(s=>{
  let d=document.createElement('div'); d.className='word'; d.textContent=s; d.dataset.sil=s.toLowerCase(); d.draggable=true;
  d.addEventListener('dragstart',e=>e.dataTransfer.setData('text/plain',s.toLowerCase()));
  d.addEventListener('click',()=>{let empty=[...document.querySelectorAll('#vocDrop div')].find(b=>!b.dataset.filled); if(empty){empty.textContent=d.textContent; empty.dataset.filled=d.textContent.toLowerCase(); d.style.visibility='hidden';}});
  pool.appendChild(d);
 });
 let drop=document.getElementById('vocDrop'); drop.innerHTML='';
 it.sil.forEach(s=>{
  let b=document.createElement('div'); b.className='drop'; b.dataset.expected=s.toLowerCase(); b.textContent='?';
  b.addEventListener('dragover',e=>e.preventDefault());
  b.addEventListener('drop',e=>{e.preventDefault(); let txt=e.dataTransfer.getData('text/plain'); b.textContent=txt; b.dataset.filled=txt;});
  b.addEventListener('click',()=>{if(b.dataset.filled){let w=[...document.querySelectorAll('#vocPool.word')].find(x=>x.dataset.sil===b.dataset.filled); if(w) w.style.visibility='visible'; b.textContent='?'; delete b.dataset.filled;}});
  drop.appendChild(b);
 });
 document.getElementById('vocMsg').textContent=''; render();
}
function hablarVocab(){
 if(!vocabActual) return;
 let u=new SpeechSynthesisUtterance(vocabActual.p+'. '+vocabActual.s); u.lang='es-ES'; u.rate=0.55; speechSynthesis.speak(u);
}
function comprobarVocab(){
 let drops=[...document.querySelectorAll('#vocDrop div')];
 let ok=drops.length>0 && drops.every(b=>b.dataset.filled && b.dataset.filled===b.dataset.expected);
 let msg=document.getElementById('vocMsg'); msg.textContent=ok?'¡Perfecto! 🎉':'Sigue intentando 👀'; msg.style.color=ok?'#00b894':'#e8438a';
 if(ok) setTimeout(()=>hablarVocab(),400);
}
function vocabNav(d){
 let l=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];
 let i=l.findIndex(x=>x.p===vocabActual.p); mostrar(l[(i+d+l.length)%l.length].p);
}
function vocabRandom(){
 let l=temaActual==='TODOS'?Object.values(VOCAB_TEMATICO).flat():VOCAB_TEMATICO[temaActual];
 mostrar(l[Math.floor(Math.random()*l.length)].p);
}
function addTema(){
 let n=prompt('Nombre del nuevo tema (ej: EL CUERPO HUMANO, LOS COLORES, LOS ANIMALES):');
 if(!n) return; n=n.trim().toUpperCase(); if(!n) return;
 if(!VOCAB_TEMATICO[n]) VOCAB_TEMATICO[n]=[{p:"ejemplo",e:"⭐",sil:["e","jem","plo"],s:"Este es un ejemplo de "+n.toLowerCase(),ej:"e-jem-plo"}];
 initSubtabs(); setTema(n);
 alert('¡Tema '+n+' creado! Edita el archivo para añadir 30 palabras reales.');
}
